orientacoes_gerais: |-
  Apresenta os saldos das contas contábeis e referenciais. Os registros deste bloco podem ser:
  I – Digitados;
  II – Importados; ou
  III – Replicados a partir do Bloco E.
tabela_blocos:
  nome: Saldos das Contas Contábeis e Referenciais
  descricao: |-
    Apresenta os saldos das contas contábeis patrimoniais e de resultado por período de
    apuração e o seu mapeamento para as contas referenciais.
    Caso haja recuperação da ECD, o bloco K pode ser construído automaticamente e é
    permitida a sua edição.
    O bloco K também pode ser importado, independentemente da recuperação da ECD.
