bloco: S
nome: TEF/SAF – Tributação das Entidades de Futebol / Sociedade Anônima de Futebol
paginas_manual:
- 355
- 355
orientacoes_gerais: |-
  Deverão preencher este bloco as entidades que forem Sociedade Anônima de Futebol – SAF e estiverem sob amparado da Tributação das Entidades de Futebol, conforme Lei nº 14.193, de 6 de agosto de 2021.
  Para que o bloco fique disponível para inserção de dados, o campo FORMA_TRIB do registo 0010 deve ter como flag a opção 10 – TEF – Tributação Específica do Futebol.
  As SAFs devem seguir, de modo subsidiário, as disposições contidas na Lei nº 6.404, de 15 de dezembro de 1976 e da Lei nº 9.615, de 24 de março de 1988.
  As SAFs são obrigadas a realizar a entrega da Escrituração Contábil Digital – ECD e fazer a sua recuperação no momento da entrega da ECF.
  As SAFs são obrigadas a recolhimento mensal dos tributos que estão sujeitos, utilizando o regime de caixa. (Art. 31, § 1º da L ei 14.193/21).
