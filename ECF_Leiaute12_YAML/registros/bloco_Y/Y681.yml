_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y681
nome: Informações de Optantes pelo Refis (Lucros Real, Presumido e Arbitrado)
bloco: Y
nome_tabela_registros: Informações de Optantes pelo Refis (Lucro Real, Presumido e Arbitrado)
paginas_manual:
- 596
- 597
descricao: Este registro deve ser preenchido pela pessoa jurídica, exceto imune ou isenta, que optou pelo REFIS para os meses em que esteve submetida ao programa (indicados no registro Y680).
titulo_leiaute: 'REGISTRO Y681: INFORMAÇÕES DE OPTANTES PELO REFIS (LUCRO REAL, PRESUMIDO E ARBITRADO)'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: CODIGO
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0010.OPT_REFIS="S" E 0010.FORMA_TRIB ≠ “8” e “9”
  ocorrencia: '[0;12]'
hierarquia:
  pai: Y680
  filhos: []
  irmaos: []
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (Y681).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X681]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Código, conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: 6
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição, conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: VALOR
  descricao: Valor
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
tabelas_dinamicas: |-
  Y681 - Informações de Optantes pelo Refis (Lucro Real, Presumido e Arbitrado)
  Vide planilha deste Registro no arquivo “Tabelas_Dinamicas_ECF_Leiaute_12_AC2025_SIT_ESP_2026.xlsx” a partir do link http://sped.rfb.gov.br/pasta/show/1644.
  (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
  Regras de validação da tabela dinâmica Y681:
  Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_Y681_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas. (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
