  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0020.IND_ REC_EXT = "S" OU 0020.IND_PGTO_EXT = "S"
  ocorrencia: '[0;N]'
hierarquia:
  pai: Y001
  filhos: []
  irmaos:
  - Y570
