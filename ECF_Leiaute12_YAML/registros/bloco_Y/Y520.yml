  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y520
nome: Pagamentos/Recebimentos do Exterior ou de Não Residentes
bloco: Y
nome_tabela_registros: Pagamentos/Recebimentos do Exterior ou de Não Residentes
paginas_manual:
- 562
- 564
descricao: |-
  Este registro será habilitado somente para as pessoas jurídicas que receberam (0020.IND_REC_EXT = "S") ou pagaram, creditaram, entregaram, empregaram ou remeteram (0020.IND_PGTO_EXT = "S"), durante o ano-calendário, de pessoas físicas ou jurídicas, residentes ou domiciliadas no exterior ou de não-residentes:
  - quaisquer valores mediante operações de câmbio de qualquer natureza;
  - quaisquer valores por intermédio de transferências internacionais em reais (TIR), ou seja, provenientes de conta bancária em reais (R$) titulada por não-residente;
  - quaisquer valores por intermédio de depósitos em contas bancárias mantidas no exterior;
  - valores iguais ou superiores a R$ 120.000,00 (cento e vinte mil reais), equivalentes a R$ 10.000,00 por mês, por intermédio de cartões de crédito;
  - valores em moeda nacional ou estrangeira, cheques ou cheques de viagem, convertidos em reais (R$) na data de cada operação, iguais ou superiores a R$ 120.000,00 (cento e vinte mil reais), equivalentes a R$ 10.000,00 por mês.
  A pessoa jurídica deverá informar os valores consolidados por país, conforme registrado na sua apuração contábil.
titulo_leiaute: 'REGISTRO Y520: PAGAMENTOS/RECEBIMENTOS DO EXTERIOR OU DE NÃO RESIDENTES'
regras_validacao_registro:
- REGRA_Y520_OBRIGATORIO_R
- REGRA_Y520_OBRIGATORIO_P
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: TIP_EXT + PAIS + FORMA + NAT_OPER
