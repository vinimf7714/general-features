descricao: Este registro deve ser preenchido pela pessoa jurídica que está obrigada a entregar a ECF relativa às situações especiais de fusão, cisão parcial, cisão total ou incorporação/incorporada, quando 0000.SIT_ESPECIAL for informado, com dados de sucessora(s).
