regras_validacao_campos:
- numero: null
  campo: PERC_PAT_LIQ
  regras:
  - regra: REGRA_PERC_PAT_CISAO_TOTAL
    descricao: Verifica, quando 0000.SIT_ESPECIAL igual a “2” (Fusão), “3” (Incorporação/Incorporada) ou “5” (Cisão Total) se o somatório de Y660.PERC_PAT_LIQ é igual a 100%.
    tipo: Erro
  - regra: REGRA_PERC_PAT_CISAO_PARCIAL
    descricao: Verifica, quando 0000.SIT_ESPECIAL igual a “6” (Cisão Parcial) se o somatório de Y660.PERC_PAT_LIQ é diferente do resultado da diferença de 100% e 0000.PAT_REMAN_CIS.
    tipo: Erro
