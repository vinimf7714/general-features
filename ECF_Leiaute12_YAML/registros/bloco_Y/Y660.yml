  obrigatorio: true
- numero: 4
  campo: PERC_PAT_LIQ
  descricao: 'Percentual do Patrimônio Líquido Destinado: Percentual do patrimônio líquido da empresa sucedida destinado à pessoa jurídica resultante do evento.'
  tipo: N
  tamanho: 8
  decimal: 4
  valores_validos: null
