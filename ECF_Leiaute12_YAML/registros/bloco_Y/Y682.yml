_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y682
nome: Informações de Optantes pelo Refis – Imunes ou Isentas
bloco: Y
nome_tabela_registros: Informações de Optantes pelo Refis - Imunes ou Isentas
paginas_manual:
- 598
- 599
descricao: |-
  Este registro deve ser preenchido pela pessoa jurídica imune ou isenta que optou pelo REFIS para os meses em que esteve submetida ao programa.
  No Y682.ACRES_PATR, deve ser informado o somatório das receitas auferidas em cada mês, independentemente de sua natureza.
titulo_leiaute: 'REGISTRO Y682: INFORMAÇÕES DE OPTANTES PELO REFIS (IMUNES OU ISENTAS)'
