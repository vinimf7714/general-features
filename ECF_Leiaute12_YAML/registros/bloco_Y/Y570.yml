  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: F
    condicao: Não deve existir se 0010.FORMA_APUR_I = “D” E 0010.APUR_CSLL = “D”
  ocorrencia: '[0;N]'
