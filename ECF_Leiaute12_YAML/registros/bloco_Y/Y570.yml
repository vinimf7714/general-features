campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (Y570).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[Y570]'
  obrigatorio: true
- numero: 2
  campo: CNPJ_FON
  descricao: 'CNPJ: CNPJ da fonte pagadora'
  tipo: C
  tamanho: 14
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: NOM_EMP
  descricao: 'Nome Empresarial: Nome da pessoa jurídica responsável pela retenção e recolhimento da fonte que estiver sendo compensado.'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: IND_ORG_PUB
  descricao: |-
    Indicador de Órgão Público:
    S - Sim
    N – Não
    Selecione “Sim” ou “Não” em relação à pessoa jurídica responsável pela retenção e recolhimento da fonte que estiver sendo compensado. Ao selecionar "Sim" serão disponibilizados os códigos de recolhimento utilizados pelos Órgãos Públicos Federais ou Entidades da Administração Pública Federal, ao selecionar "Não", serão disponibilizados os demais códigos.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S; N]'
  obrigatorio: true
- numero: 5
  campo: COD_REC
  descricao: Código de Receita Utilizado Para Recolhimento na Fonte, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: N
  tamanho: 4
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 6
  campo: VL_REND
  descricao: 'Rendimento Bruto: Valor bruto do rendimento que originou a retenção.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 7
  campo: IR_RET
  descricao: 'IR Retido na Fonte: Valor de todo o imposto de renda retido na fonte durante o período abrangido pela declaração, incidente sobre as receitas que compõem a base de cálculo do tributo devido, independentemente de a empresa ter apurado prejuízo fiscal ou imposto de renda devido menor que o retido na fonte durante o período.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: CSLL_RET
  descricao: 'CSLL Retida na Fonte: Valor de toda a contribuição social sobre o lucro líquido retida na fonte durante o período abrangido pela declaração, incidente sobre as receitas que compõem a base de cálculo do tributo devido, independentemente de a empresa ter apurado base de cálculo negativa ou CSLL devida menor que a retida na fonte durante o período.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
regras_validacao_campos:
- numero: 5
  campo: COD_REC
  regras:
  - regra: REGRA_COD_REC_ORP_PUB
    descricao: Verifica, quando Y570.IND_ORG_PUB igual a “Sim”, se Y570.COD_REC é igual a 4085 ou 4397 ou 5928 ou 5936 ou 5944 ou 6147 ou 6175 ou 6188 ou 6190 ou 6228 ou 6256 ou 8739 ou 8767 ou 8850 ou 8863 ou 9060 ou 9997.
    tipo: Erro
  - regra: REGRA_COD_REC_ORP_PUB_NAO
    descricao: Verifica, quando Y570.IND_ORG_PUB igual a “Não”, se Y570.COD_REC é igual a 0916 ou 0924 ou 1708 ou 1895 ou 3277 ou 3280 ou 3426 ou 5204 ou 5232 ou 5273 ou 5557 ou 5706 ou 5928 ou 5936 ou 5944 ou 5952 ou 5987 ou 6800 ou 6813 ou 8045 ou 8468 ou 9385 ou 9998 ou 9999.
    tipo: Erro
- numero: 7
  campo: IR_RET
  regras:
  - regra: REGRA_COD_REC_IR_RET
    descricao: Verifica se Y570.IR_RET está preenchido quando Y570.COD_REC é igual a 5928 ou 5936 ou 5944 ou 6147 ou 6175 ou 6188 ou 6190 ou 6256 ou 8739 ou 8767 ou 8850 ou 8863 ou 9060 ou 9997 ou 0916 ou 0924 ou 1708 ou 1895 ou 3277 ou 3280 ou 3426 ou 5204 ou 5232 ou 5273 ou 5557 ou 5706 ou 5928 ou 5936 ou 5944 ou 6800 ou 6813 ou 8045 ou 8468 ou 9385 ou 9999.
    tipo: Erro
  - regra: REGRA_EXISTE_IR_RET
    descricao: Verifica, quando (N620 (21) ou N620 (23) ou N620 (24) forem maiores que zero); ou (0010.COD_QUALIF_PJ = “1” e (N630 (20) ou N630 (21) ou N630 (22) forem maiores que zero); ou (0010.COD_QUALIF_PJ ≠ “1” e (N630 (17) ou N630 (18) ou N630 (19)) forem maiores que zero); ou (P300 (10) ou P300 (12) ou P300 (13) forem maiores que zero); ou (T150 (11) ou T150 (13) ou T150 (14) forem maiores que zero); se Y570.IR_RET está preenchido.
    tipo: Erro
- numero: 8
  campo: CSLL_RET
  regras:
  - regra: REGRA_COD_REC_CSLL_RET
    descricao: Verifica se Y570.CSLL_RET está preenchido quando Y570.COD_REC é igual a 4085 ou 4397 ou 5928 ou 5936 ou 5944 ou 6147 ou 6175 ou 6188 ou 6190 ou 6228 ou 8739 ou 8767 ou 8850 ou 8863 ou 9060 ou 9997 ou 5952 ou 5987 ou 9998.
    tipo: Erro
  - regra: REGRA_EXISTE_CSLL_RET
    descricao: Verifica, quando (N660 (14) ou N660 (15) ou N660 (16) ou N660 (17) forem maiores que zero); ou ((N670 (15) ou N670 (16) ou N670 (17) ou N670 (18)) forem maiores que zero); ou (P500 (9) ou P500 (10) ou P500 (11) ou P500 (12) forem maiores que zero); ou (T181 (11) ou T181 (12) ou T181 (13) ou T181 (14) forem maiores que zero); se Y570.CSLL_RET está preenchido.
    tipo: Erro
