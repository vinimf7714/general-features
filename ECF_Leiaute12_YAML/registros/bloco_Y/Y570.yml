  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y570
nome: Demonstrativo do Imposto de Renda e CSLL Retidos na Fonte
bloco: Y
nome_tabela_registros: Demonstrativo do Imposto de Renda e CSLL Retidos na Fonte
paginas_manual:
- 565
- 568
descricao: |-
  Neste registro devem ser prestadas informações sobre todo o imposto de renda (IRRF) e contribuição social sobre o lucro líquido (CSLL) retidos na fonte durante o período abrangido pela ECF, incidentes sobre as receitas que compõem a base de cálculo do tributo devido.
  Não devem ser informados nesse registro:
  - Valores retidos à título de IRRF sobre o pagamento de Juros sobre Capital Próprio e IRRF incidente sobre o pagamento efetuado a cooperativas que foram utilizados em compensações, nos termos do art. 81 da IN RFB 2055, de 2021; e
  - Valores de retenção não utilizados, por opção da pessoa jurídica, na apuração do IRPJ e da CSLL.
titulo_leiaute: 'REGISTRO Y570: DEMONSTRATIVO DO IMPOSTO DE RENDA E CSLL RETIDOS NA FONTE'
regras_validacao_registro: []
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: CNPJ_FON + COD_REC
