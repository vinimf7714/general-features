descricao: |-
  Este registro é obrigatório para todas as pessoas jurídicas, no caso de transmissão de arquivos da ECF originais. A sua obrigatoriedade será verificada na hora da validação para a transmissão.
  Para as pessoas jurídicas tributadas pelo lucro presumido, arbitrado ou imunes/isentas, apenas devem ser preenchidos os campos Y720.INTIMACAO e Y720.INT.ATRASO (de acordo com a regra prevista para o campo). Para as pessoas jurídicas tributadas pelo lucro real e para as formas de tributação mistas, além dos campos anteriormente citados e suas regras de obrigatoriedade, os demais campos do registro também serão preenchidos.
  No caso das pessoas jurídicas tributadas pelo lucro real, a multa incidirá sobre o valor lucro líquido antes do Imposto de Renda da pessoa jurídica e da Contribuição Social sobre o Lucro Líquido, no período a que se refere a apuração.
  Assim sendo, i) na forma de apuração trimestral, deverá ser considerado como base, o somatório dos resultados líquidos antes da incidência do Imposto de Renda da pessoa jurídica e da Contribuição Social sobre o lucro líquido de todos os trimestres a que se refere a ECF entregue em atraso, e ii) na forma de apuração anual, deverá ser considerado como base, o lucro líquido antes da incidência do Imposto de Renda da pessoa jurídica e da Contribuição Social sobre o lucro líquido do período da ECF entregue em atraso.
  Observação: No caso de lucro real trimestral, o programa considera a soma dos quatro trimestres de apuração para verificar se há lucro ou prejuízo no período. Portanto, se a soma dos quatro trimestres de apuração for maior que zero, esse será o valor utilizado como base de cálculo da multa por atraso na entrega da ECF. Por outro lado, caso a soma algébrica dos quatro trimestres seja menor que zero, o contribuinte deverá informar o lucro líquido do último período de apuração informado neste registro, conforme previsto no parágrafo 4º do art. 8º-A do Decreto-Lei no 1.598/1977.
  Nos termos do parágrafo 4º do art. 8º-A do Decreto-Lei no 1.598/1977, para a situação em que a empresa não tenha apresentado lucro líquido no período de apuração a que se refere a ECF, deverá ser utilizado como base de cálculo para a multa, o lucro líquido, antes do Imposto de Renda da Pessoa Jurídica e da Contribuição Social sobre o Lucro Líquido do último período de apuração em que a empresa apresentou lucro, atualizado pela taxa referencial do Sistema Especial de Liquidação e de Custódia - Selic, até o termo final de encerramento do período a que se refere a escrituração.
  Ou seja, se a empresa não apresentou lucro no período da escrituração, deverá informar o lucro líquido do último período anterior a esse em que obteve lucro, ainda que em outro regime de tributação (Lucro Presumido, Arbitrado ou Simples Nacional) e atualizar esse valor, pela SELIC, até o termo final de encerramento do período a que se refere a escrituração. O programa está preparado para efetuar a atualização pela SELIC, automaticamente; logo deverá ser informado o lucro líquido em valores históricos.
  Conforme está previsto no parágrafo 1º do art. 8º-A do Decreto-Lei no 1.598/1977, há um limite para o valor da multa, estabelecido em função do valor da receita bruta total do ano-calendário anterior. Por isso, essa informação é exigida pelo programa no preenchimento deste registro (Campo 4 - REC_BRUT_ANT).
