- numero: 2
  campo: LUC_LIQ
  descricao: |-
    Lucro líquido antes da incidência do imposto sobre a renda e da contribuição social sobre o lucro líquido do último período de apuração informado, sem a atualização pela taxa referencial do Selic, pois o sistema efetuará o cálculo automaticamente.
    Observação: De acordo com o parágrafo único do art. 6º da Instrução Normativa RFB no 2.004, de 18 de janeiro de 2022, na aplicação da multa de que trata o caput, quando não houver lucro líquido, antes do Imposto de Renda e da Contribuição Social, no período de apuração a que se refere a escrituração, deverá ser utilizado o último lucro líquido, antes do Imposto de Renda e da Contribuição Social informado, atualizado pela taxa referencial do Sistema Especial de Liquidação e de Custódia - Selic, até o termo final de encerramento do período a que se refere a escrituração.
