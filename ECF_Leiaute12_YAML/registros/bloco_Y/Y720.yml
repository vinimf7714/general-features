regras_validacao_campos:
- numero: null
  campo: LUC_LIQ
  regras:
  - regra: REGRA_OBRIGATORIO_LUCRO_REAL
    descricao: Verifica se Y720.LUC_LIQ está preenchido quando 0010.FORMA_TRIB é igual a “1” (lucro real) ou “02” (lucro real/arbitrado) ou “03” (lucro presumido/real) ou “04” (lucro presumido/real/arbitrado).
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_LUCRO_REAL
    descricao: Verifica se Y720.LUC_LIQ não está preenchido quando 0010.FORMA_TRIB é igual a “5” (lucro presumido) ou “06” (lucro arbitrado) ou “07” (lucro presumido/arbitrado) ou “08” (imune) ou “09” (isenta).
    tipo: Erro
- numero: null
  campo: DT_LUC_LIQ
  regras:
  - regra: REGRA_MENOR_DT_INI_ESC
    descricao: Verifica se Y720.DT_LUC_LIQ é menor ou igual que a 0000.DT_INI.
    tipo: Erro
  - regra: REGRA_OBRIGATORIO_LUCRO_REAL
    descricao: Verifica se Y720.DT_LUC_LIQ está preenchido quando 0010.FORMA_TRIB é igual a “1” (lucro real) ou “02” (lucro real/arbitrado) ou “03” (lucro presumido/real) ou “04” (lucro presumido/real/arbitrado).
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_LUCRO_REAL
    descricao: Verifica se Y720.DT_LUC_LIQ não está preenchido quando 0010.FORMA_TRIB é igual a “5” (lucro presumido) ou “06” (lucro arbitrado) ou “07” (lucro presumido/arbitrado) ou “08” (imune) ou “09” (isenta).
- numero: 4
  campo: REC_BRUT_ANT
  regras:
  - regra: REGRA_OBRIGATORIO_LUCRO_REAL
    descricao: Verifica se Y720.REC_BRUT_ANT está preenchido quando 0010.FORMA_TRIB é igual a “1” (lucro real) ou “02” (lucro real/arbitrado) ou “03” (lucro presumido/real) ou “04” (lucro presumido/real/arbitrado).
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_LUCRO_REAL
    descricao: Verifica se Y720.REC_BRUT_ANT não está preenchido quando 0010.FORMA_TRIB é igual a “5” (lucro presumido) ou “06” (lucro arbitrado) ou “07” (lucro presumido/arbitrado) ou “08” (imune) ou “09” (isenta).
    tipo: Erro
- numero: 6
  campo: INT_ATRASO
  regras:
  - regra: REGRA_PRAZO_INTIMACAO_OBRIGATORIO
    descricao: Verifica se Y720.INT_ATRASO está preenchido quando Y720.INTIMACAO é igual a “S” (Sim).
    tipo: Erro
  - regra: REGRA_PRAZO_INTIMACAO_NAO_PREENCHER
    descricao: Verifica se Y720.INT_ATRASO não está preenchido quando Y720.INTIMACAO é igual a “N” (Não).
    tipo: Erro
