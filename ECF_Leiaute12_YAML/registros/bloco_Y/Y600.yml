  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y600
nome: Identificação e Remuneração de Sócios, Titulares, Dirigentes e Conselheiros
bloco: Y
nome_tabela_registros: Identificação e Remuneração de Sócios, Titulares, Dirigentes e Conselheiro
paginas_manual:
- 571
- 576
descricao: |-
  Este registro deve ser preenchido pela pessoa jurídica com os dados dos até 999 (novecentos e noventa e nove) sócios, dirigentes e conselheiros ou dos titulares que tenham recebido maiores remunerações no período da ECF, inclusive os titulares, sócios, dirigentes e conselheiros que tenham se retirado da pessoa jurídica no período da ECF e não fazem parte do quadro societário na data final.
  Regras de preenchimento:
  1 – Informar os 500 maiores dirigentes, conselheiros, sócios ou titulares na data final do período de apuração, ordenados pelo total dos campos Y600.VL_REM_TRAB; Y600.VL_LUC_DIV;
  Y600.VL_JUR_CAP e Y600. VL_DEM_REND;
  Observação: No caso de ações em tesouraria, a sociedade deverá informar uma ocorrência do registro com Y600. IND_QUALIF_SOCIO = “PJ”, Y600.CPF_CNPJ = “CNPJ da própria sociedade”, Y600.DT_ALT_SOC = “31/12/Ano da Escrituração” e Y600.NOM_EMP = “Ações em Tesouraria”.
  Observação: No caso de ações em free float (livre circulante), a sociedade deverá informar uma ocorrência do registro com Y600. IND_QUALIF_SOCIO = “PJ”, Y600.CPF_CNPJ = “CNPJ da própria sociedade”, Y600.DT_ALT_SOC = “31/12/Ano da Escrituração” e Y600.NOM_EMP = “Ações em Free Float”.
  2 – Informar as 499 maiores alterações Y600.DT_ALT_SOC ocorridas durante o período, não contempladas pelo item 1.
  Exemplos de eventos que devem ser registrados:
  1- Alteração intermediária da porcentagem de participação no capital social da Pessoa Jurídica no curso do período de apuração.
  2- Aquisição e alienação de participação no capital social da Pessoa Jurídica no curso do período de apuração. Os dois eventos devem estar registrados.
  3- Alterações das porcentagens de free float e ações em tesouraria.
  4- Emissões ou cancelamentos de quotas/ ações, mesmo derivadas da conversão de outros valores mobiliários.
  5- Split ou inplit de ações.
  Observação: Para os campos relativos a valores, eles devem ser informados em todos os casos, mesmo quando o valor seja “zero”.
titulo_leiaute: 'REGISTRO Y600: IDENTIFICAÇÃO E REMUNERAÇÃO DE SÓCIOS, TITULARES, DIRIGENTES E CONSELHEIROS'
