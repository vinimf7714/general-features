_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y650
nome: Participantes do Consórcio
bloco: Y
nome_tabela_registros: Participantes do Consórcio
paginas_manual:
- 587
- 587
descricao: |-
  Este registro deve ser preenchido quando a pessoa jurídica indicou ser líder de consórcio no registro Y640 (Y640.COND_DECL = “1”). Deverão ser indicados, neste registro, para cada um dos demais participantes do consórcio no qual a declarante é líder, o CNPJ do participante e a respectiva receita auferida, observado o disposto no caput do art. 3o da IN RFB no 1.199, de 2011.
  Não é necessário informar o CNPJ e a receita da empresa líder, pois já foram informados no registro Y640.
titulo_leiaute: 'REGISTRO Y650: PARTICIPANTES DO CONSÓRCIO'
regras_validacao_registro: []
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: CNPJ
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se Y640.COND_DECL="1"
  ocorrencia: '[0;N]'
hierarquia:
  pai: Y640
  filhos: []
  irmaos: []
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (Y650).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[Y650]'
  obrigatorio: true
- numero: 2
  campo: CNPJ
  descricao: CNPJ da Empresa Participante do Consórcio.
  tipo: C
  tamanho: 14
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: VL_PART
  descricao: Receita do Participante do Consórcio.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
regras_validacao_campos:
- numero: null
  campo: VL_PART
  regras:
  - regra: REGRA_SOMA_VL_PART
    descricao: Verifica se o somatório das receitas dos participantes informadas em Y650.VL_PART dos registros Y650 filhos somado ao valor da receita da empresa líder informada no Y640.VL_DECL é igual ao Y640.VL_CONS.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|Y650|11111111000191|100000,00|'
  explicacao:
  - valor: '|Y650|'
    descricao: Identificação do tipo do registro.
  - valor: '|11111111000191|'
    descricao: CNPJ da empresa participante do consórcio (11.111.111/0001-91).
  - valor: '|100000,00|'
    descricao: Valor da receita da empresa participante (R$ 100.000,00).
nota_errata: 'Divergência no manual: a Tabela de Registros (item 4.2) indica nível 2, mas o leiaute do registro indica nível 3. A árvore usa o nível do leiaute.'
