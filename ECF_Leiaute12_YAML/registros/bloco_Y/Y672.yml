    tipo: Erro
  - regra: REGRA_Y672_CAPITAL_NAO_INFORMADO
    descricao: Verifica se o campo Y762.VL_CAPITAL está preenchido quando 0010.FORMA_TRIB for igual a “5” (Lucro Presumido) e 0010.TIPO_ESC_PRE for igual a “L” (Livro Caixa) ou quando 0010.FORMA_TRIB for igual a “6” (Lucro Arbitrado) ou “7” (Presumido/Arbitrado).
    tipo: Aviso
