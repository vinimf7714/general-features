    descricao: Verifica se Y672.IND_AVAL_ESTOQ não está preenchido, quando Y672.VL_ESTOQUES for maior que zero, 0010.FORMA_TRIB for igual a “5” (Lucro Presumido) ou “7” (Lucro Presumido/Arbitrado) e 0010TIPO_ESC_PRE for igual a “L” (Livro Caixa).
    tipo: Erro
  - regra: REGRA_Y672_METODO_P100
    descricao: |-
      Verifica se Y672.IND_AVAL_ESTOQ não está preenchido, quando 0010.FORMA_TRIB for igual a “5” (Lucro
      Presumido) ou “7” (Lucro Presumido/Arbitrado), 0010.TIPO_ESC_PRE for igual a “C” (Contábil) e P100(“1.01.03.01.21”) diferente de zero para qualquer período informado no registro P030.
    tipo: Erro
