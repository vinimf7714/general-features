  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 15
  campo: VL_COMPRA_ATIVO
  descricao: 'Compras de Elementos do Ativo no Ano-Calendário, Exceto os Classificáveis no Ativo Circulante e Ativo Não Circulante Realizável a Longo Prazo: Valor das aquisições de elementos do ativo no ano-calendário, exceto os classificáveis no ativo circulante e ativo não circulante realizável a longo prazo.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 16
  campo: VL_RECEITAS
  descricao: |-
    Receitas e Rendimentos Não Tributáveis ou Tributados Exclusivamente na Fonte;
    Informar, neste campo, o valor das seguintes receitas e rendimentos: a) as recuperações de créditos que não representem ingressos de novas receitas; b) a reversão de saldo de provisões anteriormente constituídas; c) os lucros e dividendos decorrentes de participações societárias avaliadas pelo custo de aquisição e a contrapartida do ajuste por aumento do valor de investimentos avaliados pelo método da equivalência patrimonial; d) as importâncias recebidas na forma do caput do art. 18 da Lei nº 11.196, de 2005, desde que utilizadas integralmente na realização da pesquisa ou desenvolvimento de inovação tecnológica; e e) as receitas decorrentes de valores em espécie pagos ou creditados pelos Estados, Distrito Federal e Municípios, relativos ao Imposto sobre Operações relativas à Circulação de Mercadorias e sobre Prestações de Serviços de Transporte Interestadual e Intermunicipal e de Comunicação - ICMS e ao Imposto sobre Serviços de Qualquer Natureza - ISS, no âmbito de programas de concessão de crédito voltados ao estímulo à solicitação de documento fiscal na aquisição de mercadorias e serviços. (Art. 4º, da Lei nº 11.945, de 4 de junho de 2009). f) de debêntures emitidas por SPE e de fundos de investimentos, tributados exclusivamente na fonte, à alíquota de 15% (quinze por cento), quando auferidos por pessoa jurídica tributada com base no presumido ou arbitrado (arts. 2º e 3º da Lei nº 12.431, de 2011).
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 17
  campo: TOT_ATIVO
  descricao: 'Total do Ativo: Valor total do Ativo no fim do “Ano da Declaração”.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 18
  campo: IND_AVAL_ESTOQ
  descricao: |-
    Método de Avaliação de Estoques:
    1 – Custo Médio Ponderado
    2 – PEPS (Primeiro que entra, primeiro que sai)
    3 – Arbitramento - art. 296, Inc. I e II, do RIR/99
    4 – Custo Específico
    5 – Valor Realizável Líquido
    6 – Inventário Periódico
    7 – Outros
    8 – Não há (Exemplo: Empresas Prestadoras de Serviços)
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[1; 2; 3; 4; 5; 6; 7; 8]'
  obrigatorio: false
