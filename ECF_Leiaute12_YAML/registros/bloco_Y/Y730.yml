regras_validacao_registro_detalhe:
- regra: REGRA_OBRIGATORIEDADE_REG
  descricao: Verifica se alguma dedução do IRPJ/CSLL validada por esse registro possui valor maior que zero no registro N630. Em caso afirmativo, então deve existir pelo menos um registro Y730 para cada dedução com valor maior que zero. Se a regra for descumprida, a ECF gera um erro.
- regra: REGRA_DUPLICIDADE_REGI
  descricao: Verifica se há algum registro Y730 com mais de uma DEDUCAO E TIPO E DATA E DESTINATARIO com o mesmo valor. Se existir, a ECF gera um erro.
regras_validacao_campos:
- numero: null
  campo: null
  nota: Continuação de regras de campo iniciadas na página anterior do manual (ver regras_validacao_campos_observacoes).
  regras:
  - regra: null
    descricao: 'PRONAS_PCD_PJ: Verifica se a DEDUÇÃO for igual a 90 – Programa Nacional de Apoio à Atenção da Saúde da Pessoa com Deficiência - PRONAS/PCD (Lei nº 12.715/2012, arts. 3º e 4º) E TIPO_DESTINATARIO for igual a “PF” OU DESTINATARIO for igual a um CPF. PROJETOS_RECICLAGEM_PJ: Verifica se a DEDUÇÃO for igual a 110 – Incentivo a Projetos de Reciclagem (Art. 3º, da Lei nº 14.260/2021) E TIPO_DESTINATARIO for igual a “PF” OU DESTINATARIO for igual a um CPF. PAT_PJ: Verifica se a DEDUÇÃO for igual a 20 – Programa de Alimentação do Trabalhador E TIPO_DESTINATARIO for igual a “PF”.'
- numero: null
  campo: DATA
  regras:
  - regra: REGRA_DT_DOACAO_ENTRE_DT_INICIA_DT_FINAL
    descricao: Verifica se a data informada é menor à data inicial definida em 0000.DT_INI OU maior à data final definida em 0000.DT_FIN.
    tipo: Erro
- numero: null
  campo: TIPO_DESTINATARIO
  regras:
  - regra: REGRA_CPF_IND_QUALIF_PJ_Y730
    descricao: Verifique se o campo TIPO_DESTINATARIO estiver preenchido com valor “PJ” – Pessoa Jurídica, então o campo DESTINATARIO tem que ter um CNPJ – 14 dígitos e válido.
    tipo: Erro
  - regra: REGRA_CPF_IND_QUALIF_PF_Y730
    descricao: Verifique se o campo TIPO_DESTINATARIO estiver preenchido com valor “PF” – Pessoa Física, então o campo DESTINATARIO tem que ter um CPF – 11 dígitos e válido.
    tipo: Erro
  - regra: REGRA_CNPJ_CONTRIBUINTE
    descricao: Exceto para a dedução 20 – Programa de Alilmentação do Trabalhador, não pode o contribuinte informar o próprio CNPJ como destinatário de uma dedução.
    tipo: Erro
regras_validacao_campos_observacoes: |-
  Nº Campo Regras de Validação do Campo Tipo
  3 TIPO TIPO_DOACAO_PESSOA_FISICA_LICENCA_PATERNIDADE_MATERNIDADE: Verifica se a DEDUCAO for igual a 100 - Valor da Erro
  Remuneração da Prorrogação da Licença-Maternidade e da Licença-Paternidade E TIPO_DESTINATARIO for igual a “PJ” OU DESTINATARIO for igual a um CNPJ.
  FUNDO_CRIANCA_ADOLESCENTE_PJ: Verifica se a DEDUÇÃO for igual a 50 – Fundos dos Direitos da Criança e do Adolescente E Erro
  TIPO_DESTINATARIO for igual a “PF” OU DESTINATARIO for igual a um CPF.
  FUNDO_IDOSO_PJ: Verifica se a DEDUÇÃO for igual a 60 – Fundos Nacional, Estaduais ou Municipais do Idoso (Lei nº 12.213/2010, art. 3º) E Erro TIPO_DESTINATARIO for igual a “PF” OU DESTINATARIO for igual a um CPF.
  PRONON_PJ: Verifica se a DEDUÇÃO for igual a 80 – |Programa Nacional de Apoio à Atenção Oncológica - PRONON (Lei nº 12.715/2012, arts. Erro
  1º e 4º) E TIPO_DESTINATARIO for igual a “PF” OU DESTINATARIO for igual a um CPF.
