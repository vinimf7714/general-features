  obrigatorio: true
- numero: 2
  campo: DEDUCAO
  descricao: Tipo da dedução, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas/ SPEDECF_DEDUCOES_IRPJ_CSLL).
  tipo: N
  tamanho: 4
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: TIPO
  descricao: Tipo da dedução, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas/ SPEDECF_TIPO_DOACAO).
  tipo: N
  tamanho: 4
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: DATA
  descricao: Data que a doação foi efetuada.
  tipo: N
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: TIPO_DESTINATARIO
  descricao: Identificação se o destinatário da dedução é pessoa física ou jurídica.
