  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y730
nome: Identificação de donatários/destinatários de deduções do IRPJ/CSLL
bloco: Y
nome_tabela_registros: Identificação de donatários/destinatários de deduções do IRPJ/CSLL
paginas_manual:
- 603
- 606
descricao: |-
  É dever do contribuinte verificar se cumpre os requisitos legais relacionados à dedução que utilizar.
  Este registro é obrigatório para todas as pessoas jurídicas tributadas pelo lucro real que utilizarem alguma das seguintes deduções:
  ▪ Operações de Caráter Cultural e Artístico
  ▪ Programa de Alimentação do Trabalhador
  ▪ Desenvolvimento Tecnológico Industrial/Agropecuário
  ▪ Atividade Audiovisual
  ▪ Fundos dos Direitos da Criança e do Adolescente
  ▪ Fundos Nacional, Estaduais ou Municipais do Idoso
  ▪ Atividades de Caráter Desportivo
  ▪ Programa Nacional de Apoio à Atenção Oncológica – PRONON
  ▪ Programa Nacional de Apoio à Atenção da Saúde da Pessoa com Deficiência – PRONAS/PCD
  ▪ Valor da Remuneração da Prorrogação da Licença-Maternidade e da Licença Paternidade
  ▪ Incentivo a Projetos de Reciclagem
  ▪ Outras Deduções
  Em relação à dedução do Programa de Alimentação do Trabalhador – PAT, caso o sujeito passivo mantenha serviço próprio ou distribua alimentos, deverá indicar seu próprio CNPJ no campo DESTINATÁRIO. Porém, caso firme contratos com entidades de alimentação coletiva, informar o CNPJ da entidade contratada que presta o serviço.
  Não devem ser informados nesse registro:
  - Valores de deduções não utilizados, por opção da pessoa jurídica, na apuração do IRPJ/CSLL.
titulo_leiaute: 'REGISTRO Y730: IDENTIFICAÇÃO DOS DONATÁRIOS/DESTINATÁRIOS DE DEDUÇÕES DO IRPJ/CSLL'
regras_validacao_registro:
- REGRA_OBRIGATORIEDADE_REG
- REGRA_DUPLICIDADE_REGI
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: DEDUCAO + TIPO_DOACAO + DT_DOACAO + DESTINATARIO
