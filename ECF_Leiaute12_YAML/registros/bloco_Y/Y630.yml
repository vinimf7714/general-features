_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: Y630
nome: Fundos/Clubes de Investimento
bloco: Y
nome_tabela_registros: Fundos/Clubes de Investimento
paginas_manual:
- 583
- 584
descricao: Este registro deve ser preenchido pelas pessoas jurídicas administradoras de fundos ou clubes de investimento, e pelos fundos de investimento imobiliário de que trata a Lei no 8.668, de 25 de junho de 1993, alterada pelos arts. 2o a 4o e 22 da Lei no 9.779, de 19 de janeiro de 1999.
titulo_leiaute: 'REGISTRO Y630: FUNDOS/CLUBES DE INVESTIMENTO'
regras_validacao_registro: []
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: CNPJ
