_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: '9900'
nome: Registros do Arquivo
bloco: '9'
nome_tabela_registros: Registros do Arquivo
paginas_manual:
- 616
- 617
descricao: Este registro informa a quantidade total de registros por tipo de registro do arquivo da ECF. Devem ser mostradas a quantidade de ocorrências de todos os registros que aparecem no arquivo da ECF, inclusive do próprio registro 9900, que será preenchido por último. Além disso, deve ser informado o código da versão da tabela dinâmica utilizada (atualmente a versão é 1.00) e a identificação da tabela dinâmica utilizada (será preenchido pelo sistema). Ambos os campos (9900.VERSAO e 9900.ID_TAB_DIN), atualmente, são não obrigatórios.
titulo_leiaute: 'REGISTRO 9900: REGISTROS DO ARQUIVO'
