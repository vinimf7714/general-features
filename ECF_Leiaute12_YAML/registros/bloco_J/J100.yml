_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: J100
nome: Centro de Custos
bloco: J
nome_tabela_registros: Centro de Custos
paginas_manual:
- 141
- 141
descricao: Registro destinado à informação dos centros de custos utilizados pela pessoa jurídica.
titulo_leiaute: 'REGISTRO J100: CENTRO DE CUSTOS'
regras_validacao_registro: []
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: DT_ALT + COD_CCUS
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: FC
    condicao: Se (0010.FORMA_TRIB = “1” ou “2” ou “3”,“4” ou “10”) Ou (0010. FORMA_TRIB = “5” ou “7” ou “8” ou “9” E 0010.TIP_ESC_PRE = “C”)
  ocorrencia: '[0;N]'
hierarquia:
  pai: J001
  filhos: []
  irmaos:
  - J050
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (J100).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[J100]'
  obrigatorio: true
- numero: 2
  campo: DT_ALT
  descricao: Data da Inclusão/Alteração.
  tipo: N
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: COD_CCUS
  descricao: Código do Centro de Custos.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: CCUS
  descricao: Nome do Centro de Custos.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
regras_validacao_campos:
- numero: 2
  campo: DT_ALT
  regras:
  - regra: REGRA_DT_ALT_DATA_MAIOR
    descricao: Verifica se J100.DT_ALT é menor ou igual a 0000.DT_FIN.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|J100|01012025|1234|CENTRO DE CUSTOS 1234|'
  explicacao:
  - valor: '|J100|'
    descricao: Identificação do tipo do registro.
  - valor: '|01012025|'
    descricao: Data da alteração (01/01/2025).
  - valor: '|1234|'
    descricao: Código do centro de custos.
  - valor: '|CENTRO DE CUSTOS 1234|'
    descricao: Nome do centro de custos.
