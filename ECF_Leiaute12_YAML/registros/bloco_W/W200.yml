- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (W200).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[W200]'
  obrigatorio: true
- numero: 2
  campo: JURISDICAO
  descricao: |-
    Jurisdição de Residência para fins Tributários, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    A entidade declarante deve listar todas as jurisdições nas quais entidades integrantes do grupo multinacional são residentes para fins tributários e aquelas em que opera por meio de um estabelecimento permanente (ou seja, todas as jurisdições nas quais o grupo multinacional opera). Para cada uma dessas jurisdições, deverão ser fornecidas, de maneira agregada (isto é, somados os valores de todas as entidades integrantes do grupo multinacional presentes em cada jurisdição) as informações solicitadas nos campos subsequentes.
    Observação: Caso exista uma ou mais entidades integrantes do grupo multinacional que sejam consideradas sem residência para fins tributários, o campo W200.JURISDICAO deve ser preenchido com o código X5 (Sem residência para fins tribvutários). Para esse campo, deverão ser reportadas, de maneira agregada, as informações a respeito de todas as entidades integrantes do grupo multinacional consideradas sem residência para fins tributários.
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: VL_REC_NAO_REL_EST
  descricao: |-
    Receitas Provenientes de Partes Não Relacionadas em Moeda Estrangeira (identificada no campo W100.TIP_MOEDA): O contribuinte deve informar a soma das receitas, em moeda estrangeira, de todas as entidades integrantes do grupo multinacional presentes na jurisdição tributária em questão que tenham sido geradas de transações com partes não relacionadas.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: VL_REC_NAO_REL
  descricao: |-
    Receitas Provenientes de Partes Não Relacionadas: O contribuinte deve informar a soma das receitas, em reais, de todas as entidades integrantes do grupo multinacional presentes na jurisdição tributária em questão que tenham sido geradas de transações com partes não relacionadas.
    Observação: Caso o campo W200.VL_REC_NAO_REL_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: VL_REC_REL_EST
  descricao: |-
    Receitas Provenientes de Partes Relacionadas em Moeda Estrangeira (identificada no campo W100.TIP_MOEDA): O contribuinte deve informar a soma das receitas, em moeda estrangeira, de todas as entidades integrantes do grupo multinacional presentes na jurisdição tributária em questão que tenham sido geradas de transações com partes relacionadas.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: VL_REC_REL
  descricao: |-
