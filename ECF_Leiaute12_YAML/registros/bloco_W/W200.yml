  campo: VL_REC_TOTAL
  descricao: 'Receita Total: Soma das receitas provenientes de partes não relacionadas e das receitas provenientes de partes relacionadas, caso tenham sido informadas em reais. Este campo será calculado pelo sistema (W200.VL_REC_NAO_REL + W200.VL_REC_REL).'
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 9
  campo: VL_LUC_PREJ_ANTES_IR_EST
  descricao: |-
    Lucro ou Prejuízo Antes do IR em Moeda Estrangeira (identificada no campo W100.TIP_MOEDA): Deve ser reportada a soma do lucro (ou prejuízo) antes do imposto de renda, em moeda estrangeira, de todas as entidades integrantes do grupo multinacional presentes na jurisdição em questão. O lucro (ou prejuízo) antes do imposto de renda deve incluir todas as receitas e despesas extraordinárias.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: NS
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 10
  campo: VL_LUC_PREJ_ANTES_IR
  descricao: |-
    Lucro ou Prejuízo Antes do IR: Deve ser reportada a soma do lucro (ou prejuízo) antes do imposto de renda, em reais, de todas as entidades integrantes do grupo multinacional presentes na jurisdição em questão. O lucro (ou prejuízo) antes do imposto de renda deve incluir todas as receitas e despesas extraordinárias.
    Observação: Caso o campo W200.VL_LUC_PREJ_ANTES_IR_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: NS
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 11
  campo: VL_IR_PAGO_EST
  descricao: |-
    Imposto de Renda Pago, em moeda estrangeira (identificada no campo W100.TIP_MOEDA): deve ser informado o montante total de imposto de renda efetivamente pago, em moeda estrangeira, durante o ano fiscal de declaração por todas as entidades integrantes do grupo multinacional presentes na jurisdição reportada. Nesse montante devem ser incluídos impostos pagos por uma entidade integrante a sua própria jurisdição de residência para fins tributários e para todas as outras jurisdições. Também estão incluídos valores pagos a título de imposto de renda retido na fonte por outras entidades (sejam elas independentes ou relacionadas) com relação a pagamentos realizados a uma entidade integrante do grupo multinacional. Dessa forma, se, por exemplo: a entidade A, residente na jurisdição A, recebe valores a título de juros na jurisdição B, o imposto retido na jurisdição B deve ser reportado pela entidade A (isto é, com referência à jurisdição em que a entidade A está situada).
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 12
  campo: VL_IR_PAGO
  descricao: |-
    Imposto de Renda Pago: deve ser informado o montante total de imposto de renda efetivamente pago, em reais, durante o ano fiscal de declaração por todas as entidades integrantes do grupo multinacional presentes na jurisdição reportada. Nesse montante devem ser incluídos impostos pagos por uma entidade integrante a sua própria jurisdição de residência para fins tributários e para todas as outras jurisdições. Também estão incluídos valores pagos a título de imposto de renda retido na fonte por outras entidades (sejam elas independentes ou relacionadas) com relação a pagamentos realizados a uma entidade integrante do grupo multinacional. Dessa forma, se, por exemplo: a entidade A, residente na jurisdição A, recebe valores a título de juros na jurisdição B, o imposto retido na jurisdição B deve ser reportado pela entidade A (isto é, com referência à jurisdição em que a entidade A está situada).
    Observação: Caso o campo W200.VL_IR_PAGO_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 13
  campo: VL_IR_DEVIDO_EST
  descricao: |-
    Imposto de Renda Devido, em moeda estrangeira (identificada no campo W100.TIP_MOEDA): Deve ser informada a soma do imposto de renda devido, em moeda estrangeira, sobre os lucros tributáveis ou prejuízos no ano fiscal de declaração de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição reportada. A despesa deve refletir apenas operações realizadas no ano e não inclui impostos diferidos ou provisões para passivos tributários incertos.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 14
  campo: VL_IR_DEVIDO
  descricao: |-
    Imposto de Renda Devido: Deve ser informada a soma do imposto de renda devido, em reais, sobre os lucros tributáveis ou prejuízos no ano fiscal de declaração de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição reportada. A despesa deve refletir apenas operações realizadas no ano e não inclui impostos diferidos ou provisões para passivos tributários incertos.
    Observação: Caso o campo W200.VL_IR_DEVIDO_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 15
  campo: VL_CAP_SOC_EST
  descricao: |-
    Capital Social em Moeda Estrangeira (identificada no campo
    W100.TIP_MOEDA): A entidade declarante deve reportar a soma do capital social, em moeda estrangeira, de todas as entidades integrantes residentes para fins tributários na jurisdição informada. Quanto aos estabelecimentos permanentes, o capital social deve ser reportado pela entidade à qual o estabelecimento está relacionado, a menos que exista, na jurisdição onde o estabelecimento permanente está situado, a obrigatoriedade de um capital definido, para fins regulatórios. Nesse caso, o capital atribuído a um estabelecimento permanente deve ser especificado no campo de Informações Adicionais do registro W300.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 16
  campo: VL_CAP_SOC
  descricao: |-
    Capital Social: A entidade declarante deve reportar a soma do capital social, em reais, de todas as entidades integrantes residentes para fins tributários na jurisdição informada. Quanto aos estabelecimentos permanentes, o capital social deve ser reportado pela entidade à qual o estabelecimento está relacionado, a menos que exista, na jurisdição onde o estabelecimento permanente está situado, a obrigatoriedade de um capital definido, para fins regulatórios. Nesse caso, o capital atribuído a um estabelecimento permanente deve ser especificado no registro de Informações Adicionais do registro W300.
    Observação: Caso o campo W200.VL_CAP_SOC_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 17
  campo: VL_LUC_ACUM_EST
  descricao: |-
    Lucros Acumulados em Moeda Estrangeira (identificada no campo
    W100.TIP_MOEDA): A entidade declarante deve reportar a soma do total de lucros acumulados, em moeda estrangeira, de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição informada. No que diz respeito aos estabelecimentos permanentes, os lucros acumulados devem ser reportados pela entidade à qual o estabelecimento está relacionado.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 18
  campo: VL_LUC_ACUM
  descricao: |-
    Lucros Acumulados: A entidade declarante deve reportar a soma do total de lucros acumulados, em reais, de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição informada. No que diz respeito aos estabelecimentos permanentes, os lucros acumulados devem ser reportados pela entidade à qual o estabelecimento está relacionado.
    Observação: Caso o campo W200.LUC_ACUM_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 19
  campo: VL_ATIV_TANG_EST
  descricao: |-
    Ativos Tangíveis (exceto caixa e equivalentes de caixa) em Moeda Estrangeira (identificada no campo W100.TIP_MOEDA): Deve ser informada a soma do valor contábil líquido dos ativos tangíveis, em moeda estrangeira, de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição indicada. Quanto aos estabelecimentos permanentes, seus ativos devem ser reportados com referência à jurisdição na qual o estabelecimento está situado. Para fins da Declaração País-a-País, ativos tangíveis não incluem caixa ou itens equivalentes de caixa, intangíveis ou ativos financeiros.
    Observação: Esse campo deve ser preenchido somente se
    W100.TIP_MOEDA for diferente de Real.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: false
- numero: 20
  campo: VL_ATIV_TANG
  descricao: |-
    Ativos Tangíveis (exceto caixa e equivalentes de caixa): Deve ser informada a soma do valor contábil líquido dos ativos tangíveis, em reais, de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição indicada. Quanto aos estabelecimentos permanentes, seus ativos devem ser reportados com referência à jurisdição na qual o estabelecimento está situado. Para fins da Declaração País-a-País, ativos tangíveis não incluem caixa ou itens equivalentes de caixa, intangíveis ou ativos financeiros.
    Observação: Caso o campo W200.VL_ATIV_TANG_EST seja informado, este campo será calculado pelo sistema, utilizando como base para conversão tabela do Banco Central para a data de 31 de dezembro do ano da Declaração.
  tipo: N
  tamanho: 19
  decimal: 0
  valores_validos: null
  obrigatorio: true
- numero: 21
  campo: NUM_EMP
  descricao: 'Número de Empregados: Deve ser informado o número total de empregados, trabalhadores e demais colaboradores de todas as entidades integrantes do grupo multinacional residentes para fins tributários na jurisdição indicada. O número de empregados deve ser totalizado ao final do ano, e reportado com base na média registrada para o ano ou outro critério aplicado de maneira consistente entre as jurisdições do grupo e para todos os anos. Para fins da Declaração País- a-País, profissionais independentes contratados participantes das atividades operacionais ordinárias da entidade integrante devem ser reportados como empregados. Arredondamentos ou aproximações razoáveis do número de empregados são permitidas, desde que não gerem distorções relevantes à distribuição relativa de empregados entre as diversas jurisdições tributárias onde o grupo opera. Critérios consistentes devem ser aplicados de um ano para outro entre as entidades.'
  tipo: N
  tamanho: 7
  decimal: 0
  valores_validos: null
  obrigatorio: true
regras_validacao_campos:
- numero: 3
  campo: VL_REC_NAO_REL_EST
  regras:
  - regra: REGRA_HABILITA_MOEDA_ESTRANGEIRA
    descricao: |-
      Caso W100.TIP_MOEDA seja diferente de “Reais”, o campo
      W200.VL_REC_NAO_REL_EST deve ser habilitado. Caso contrário, o campo W200.VL_REC_NAO_REL_EST é desabilitado.
    tipo: Habilita
  - regra: REGRA_VALOR_ESTRANGEIRO_OBRIGATORIO
    descricao: Verifica, quando W100.TIP_MOEDA é diferente de “Reais”, se o campo W200.VL_REC_NAO_REL_EST está preenchido.
    tipo: Erro
  - regra: REGRA_VALOR_ESTRANGEIRO_NAO_PREENCHER
    descricao: Verifica, quando W100.TIP_MOEDA é igual a “Reais”, se o campo W200.VL_REC_NAO_REL_EST não está preenchido.
    tipo: Erro
- numero: 4
  campo: VL_REC_NAO_REL
  regras:
  - regra: REGRA_HABILITA_REAL
    descricao: |-
      Caso W100.TIP_MOEDA seja igual a “Reais”, o campo W200.VL_REC_NAO_REL deve ser habilitado.
      Caso contrário, o campo W200.VL_REC_NAO_REL é desabilitado, pois é calculado automaticamente pelo sistema.
    tipo: Habilita
  - regra: REGRA_CALCULA_REAL_CNA
    descricao: |-
      Caso o campo W100.TIP.MOEDA seja diferente de “Reais”, o campo
      W200.VL_REC_NAO_REL será igual ao resultado da multiplicação do campo W200.VL_REC_NAO_REL_EST pela taxa de câmbio para real em 31/12/ano da escrituração, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    tipo: Erro
- numero: 5
  campo: VL_REC_REL_EST
  regras:
  - regra: REGRA_HABILITA_MOEDA_ESTRANGEIRA
    descricao: |-
      Caso W100.TIP_MOEDA seja diferente de “Reais”, o campo
      W200.VL_REC_REL_EST deve ser habilitado. Caso contrário, o campo W200.VL_REC_REL_EST é desabilitado.
    tipo: Habilita
  - regra: REGRA_VALOR_ESTRANGEIRO_OBRIGATORIO
    descricao: Verifica, quando W100.TIP_MOEDA é diferente de “Reais”, se o campo W200.VL_REC_REL_EST está preenchido.
    tipo: Erro
  - regra: REGRA_VALOR_ESTRANGEIRO_NAO_PREENCHER
    descricao: Verifica, quando W100.TIP_MOEDA é igual a “Reais”, se o campo W200.VL_REC_REL_EST não está preenchido.
    tipo: Erro
- numero: 6
  campo: VL_REC_REL
  regras:
  - regra: REGRA_HABILITA_REAL
    descricao: Caso W100.TIP_MOEDA seja igual a “Reais”, o campo W200.VL_REC_REL deve ser habilitado. Caso contrário, o campo W200.VL_REC_REL é desabilitado, pois é calculado automaticamente pelo sistema.
    tipo: Habilita
  - regra: REGRA_CALCULA_REAL_CNA
    descricao: Caso o campo W100.TIP.MOEDA seja diferente de “Reais”, o campo W200.VL_REC_REL será igual ao resultado da multiplicação do campo W200.VL_REC_REL_EST pela taxa de câmbio para real em 31/12/ano da escrituração, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    tipo: Erro
- numero: 7
  campo: VL_REC_TOTAL_EST
  regras:
  - regra: REGRA_VL_REC_TOTAL_EST_CNA
    descricao: Verifica se o campo W200.VL_REC_TOTAL_EST é igual ao somatório dos campos W200.VL_REC_NAO_REL_EST e W200.VL_REC_REL_EST.
    tipo: Erro
- numero: 8
  campo: VL_REC_TOTAL
  regras:
  - regra: REGRA_VL_REC_TOTAL_CNA
    descricao: Verifica se o campo W200.VL_REC_TOTAL é igual ao somatório dos campos W200.VL_REC_NAO_REL e W200.VL_REC_REL.
