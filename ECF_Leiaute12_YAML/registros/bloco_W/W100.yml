_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: W100
nome: Informações sobre o Grupo Multinacional e a Entidade Declarante – Declaração País-a-País
bloco: W
nome_tabela_registros: Informações Sobre o Grupo Multinacional e a Entidade Declarante
paginas_manual:
- 432
- 443
descricao: Este registro apresenta as informações sobre o grupo multinacional e a entidade declarante da Declaração País-a-País. Toda entidade residente no Brasil que seja integrante de um grupo multinacional deve preencher o registro.
titulo_leiaute: 'REGISTRO W100: INFORMAÇÕES SOBRE O GRUPO MULTINACIONAL E A ENTIDADE DECLARANTE - DECLARAÇÃO PAÍS-A-PAÍS'
regras_validacao_registro:
- REGRA_W100_Y600
nivel_hierarquico: 2
ocorrencia: 0:1
campos_chave: REG
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0020.IND_PAIS_A_PAIS = "S"
  ocorrencia: '[0;1]'
hierarquia:
  pai: W001
  filhos:
  - W200
  irmaos:
  - W300
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (W100).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[W100]'
  obrigatorio: true
- numero: 2
  campo: NOME_MULTINACIONAL
  descricao: 'Nome do Grupo Multinacional: Deve ser identificado o nome do grupo multinacional o qual o contribuinte integra.'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: IND_CONTROLADORA
  descricao: |-
    Identifica se a Entidade é a Controladora Final do Grupo Multinacional.
    A Entidade é controladora final do grupo multinacional, conforme definição estabelecida no artigo 2º, inciso VI, da Instrução Normativa RFB nº 1.681/2016.? S - Sim N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 4
  campo: NOME_CONTROLADORA
  descricao: |-
    Nome da Controladora Final.
    Observação: Caso a entidade não seja a controladora final do grupo multinacional do qual faz parte, deve identificar a entidade que possui essa posição, por meio do nome legal completo da entidade, incluindo a designação doméstica da forma legal, conforme indicado em seus documentos de constituição ou similares.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: JURISDICAO_CONTROLADORA
  descricao: Jurisdição de Residência para fins Tributários do Controlador Final, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 6
  campo: TIN_CONTROLADORA
  descricao: |-
    Tax Identification Number (TIN): Número de identificação fiscal utilizado pela administração tributária da jurisdição de residência para fins tributários do controlador final do grupo multinacional. Caso não exista o número, o campo deve ser preenchido com a expressão "NOTIN". Se o controlador final for residente no Brasil, informar o CNPJ.
    Observação: Este campo não deve ser preenchido quando a declarante da ECF for a controladora final (W100.IND_CONTROLADORA = Sim).
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 7
  campo: IND_ENTREGA
  descricao: |-
    Identifica a Entidade Responsável pela Entrega da Declaração País-a-País (entidade declarante).
    Entidade responsável pela entrega da Declaração País-a-País:
    1 - Grupo multinacional dispensado da entrega da Declaração País-a-País.
    2 - Controlador final do grupo multinacional.
    3 - Própria entidade declarante da ECF, na condição de Entidade Substituta ou de Preenchimento Local
    4 - Outra entidade, na condição de Entidade Substituta ou de Preenchimento Local
  tipo: N
  tamanho: 1
  decimal: '-'
  valores_validos: '[1;2;3;4]'
  obrigatorio: true
- numero: 8
  campo: IND_MODALIDADE
  descricao: |-
    Identifica a Modalidade de entrega da Declaração País-a-País:
    1 - Entidade substituta.
    2 - Preenchimento Local.
    Se IND_ENTREGA = "3" e IND_MODALIDADE = "1", então a própria entidade declarante da ECF é responsável pela entrega da Declaração País-a- País na condição de Entidade Substituta.
    Se IND_ENTREGA = "4" e IND_MODALIDADE = "1", então outra entidade é responsável pela entrega da Declaração País-a-País na condição de Entidade Substituta.
    Se IND_ENTREGA = "3" e IND_MODALIDADE = "2", então a própria entidade declarante da ECF é responsável pela entrega da Declaração País-a- País na condição de Preenchimento Local.
    Se IND_ENTREGA = "4" e IND_MODALIDADE = "2", então outra entidade é responsável pela entrega da Declaração País-a-País na condição de Preenchimento Local.
  tipo: N
  tamanho: 1
  decimal: '-'
  valores_validos: '[1;2]'
  obrigatorio: true
- numero: 9
  campo: NOME_SUBSTITUTA
  descricao: 'Nome da Entidade Substituta/Entidade Local: Caso a entidade declarante da Declaração País-a-País seja outra entidade, na condição de Entidade Substituta (residente no Brasil ou no exterior) ou de Preenchimento Local, o contribuinte deve identificá-la por meio do nome legal completo da entidade, incluindo a designação doméstica da forma legal, conforme indicado em seus documentos de constituição ou similares.'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 10
  campo: JURISDICAO_SUBSTITUTA
  descricao: |-
    Jurisdição de Residência para fins Tributários da Entidade Substituta/Entidade Local, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    Observação: O contribuinte deve indicar o país de residência para fins tributários da entidade declarante, seja ela entidade substituta residente no Brasil ou no exterior, ou outra entidade na condição de preenchimento local.
    Neste último caso, a jurisdição a ser informada deve ser obrigatoriamente Brasil (pois a modalidade de entrega da Declaração de preenchimento local só é admitida para entidades residentes no Brasil).
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 11
  campo: TIN_SUBSTITUTA
  descricao: |-
    Tax Identification Number (TIN): Número de identificação fiscal utilizado pela administração tributária da jurisdição de residência para fins tributários da entidade substituta do grupo multinacional ou da entidade integrante local.
    Caso não exista o número, o campo deve ser preenchido com a expressão "NOTIN". Se a entidade for residente no Brasil, informar o CNPJ.
  tipo: N
  tamanho: 14
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 12
  campo: DT_INI
  descricao: |-
    Data de Início do Período Societário.
    Observação: A Declaração País-a-País deve cobrir o ano fiscal do controlador final do grupo multinacional. Dessa forma, caso o contribuinte seja a entidade declarante na condição de entidade substituta ou na forma de preenchimento local, hipóteses em que o controlador final do grupo é residente no exterior, o ano fiscal de declaração deve ser o período societário do controlador final, mesmo que não coincida com o período societário do próprio contribuinte.
    Exemplo: O ano fiscal do contribuinte brasileiro vai de 01/01/XXXX a 31/12/XXXX, enquanto que o ano fiscal do controlador final do grupo multinacional do qual faz parte, residente no exterior, vai de 01/10/XXXX a 30/09/XXXX. Nesse caso, o período que deve ser abrangido pela Declaração País-a-País, e que deve ser devidamente informado neste campo e no campo 13, é o ano fiscal do controlador final, ou seja, 01/10/XXXX a 30/09/XXXX.
  tipo: N
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 13
  campo: DT_FIN
  descricao: |-
    Data Final do Período Societário.
    Observações: i) O ano fiscal da Declaração País-a-País deve ser o ano fiscal encerrado imediatamente anterior, podendo, dessa forma, ter data final igual ou anterior à data final do período a que se refere a ECF. ii) Caso o período a que se refere a Declaração País-a-País não corresponda a um ano completo, devem ser fornecidos esclarecimentos no campo de informações adicionais do registro W300.
  tipo: N
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 14
  campo: TIP_MOEDA
  descricao: |-
    Moeda: a entidade deve indicar qual a moeda utilizada nas informações em valores fornecidas na Declaração País-a-País, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    Observação: As informações em valores da Declaração País-a-País devem ser prestadas em uma única moeda, que deve ser a moeda do controlador final do grupo multinacional.
  tipo: C
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 15
  campo: IND_IDIOMA
  descricao: |-
    Idioma Utilizado nas Informações Adicionais da Declaração País-a-País. Deve ser indicado o idioma utilizado nos campos de informações adicionais da DPP, fornecidas em texto livre, caso tenham sido prestadas:
    PT - Português.
    EN - Inglês.
    ES - Espanhol.
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: '[PT, EN, ES]'
  obrigatorio: false
regras_validacao_registro_detalhe:
- regra: REGRA_W100_Y600
  descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “S” (Sim) e quando Y600.PAIS é diferente de “Brasil” e Y600.IND_QUAIF.SOCIO é igual a “PJ”, se o somatório do Y600.PERC_CAP_TOT é menor que 50% e se o somatório de Y600.PERC_CAP_VOT é menor que 50%. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_W100_W250
  descricao: Verifica, quando W100.IND_ENTREGA é igual a “3” (Própria entidade declarante da ECF, na condição de Entidade Substituta ou de Preenchimento Local), se existe um registro X250.TIN igual ao W100.TIN_CONTROLADOR. Se a regra não for cumprida, a ECF gera um erro.
regras_validacao_campos:
- numero: 3
  campo: IND_CONTROLADORA
  regras:
  - regra: REGRA_HABILITA_IND_CONTROLADORA
    descricao: Caso 0000.SIT_ESPECIAL seja igual “0” (Normal – sem ocorrência de situação especial ou evento), o campo W100.IND_CONTROLADORA é habilitado. Caso contrário, o campo W100.IND_CONTROLADORA é desabilitado.
    tipo: Habilita
  - regra: REGRA_IND_CONTROLADORA_OBRIGATORIO
    descricao: Verifica, quando 0000.SIT_ESPECIAL é igual “0” (Normal – sem ocorrência de situação especial ou evento), se o campo W100.IND_CONTROLADORA está preenchido.
    tipo: Erro
  - regra: REGRA_IND_CONTROLADORA_NAO_PREENCHER
    descricao: Verifica, quando 0000.SIT_ESPECIAL é diferente de “0” (Normal – sem ocorrência de situação especial ou evento), se o campo W100.IND_CONTROLADORA não está preenchido.
    tipo: Erro
- numero: 4
  campo: NOME_CONTROLADORA
  regras:
  - regra: REGRA_HABILITA_CONTROLADORA_DIFERENTE
    descricao: |-
      Caso W100.IND_CONTROLADORA seja igual a “N” (Não), o campo
      W100.NOME_CONTROLADORA é habilitado. Caso contrário, o campo W100.NOME_CONTROLADORA é desabilitado.
    tipo: Habilita
  - regra: REGRA_NOME_CONTROLADORA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “N” (Não), se o campo W100.NOME_CONTROLADORA está preenchido.
    tipo: Erro
  - regra: REGRA_NOME_CONTROLADORA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “S” (Sim), se o campo W100.NOME_CONTROLADORA não está preenchido.
    tipo: Erro
- numero: 5
  campo: JURISIDICAO_CONTROLADORA
  regras:
  - regra: REGRA_HABILITA_CONTROLADORA_DIFERENTE
    descricao: |-
      Caso W100.IND_CONTROLADORA seja igual a “N” (Não), o campo
      W100.JURISDICAO_CONTROLADORA é habilitado. Caso contrário, o campo W100.JURISDICAO_CONTROLADORA é desabilitado.
    tipo: Habilita
  - regra: REGRA_JURISDICAO_CONTROLADORA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “N” (Não), se o campo W100.JURISDICAO_CONTROLADORA está preenchido.
    tipo: Erro
  - regra: REGRA_JURISDICAO_CONTROLADORA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “S” (Sim), se o campo W100.JURISDICAO_CONTROLADORA não está preenchido.
    tipo: Erro
  - regra: REGRA_EXISTE_JURISDICAO_W200
    descricao: – Verifica, quando W100.IND_CONTROLADORA é igual “N” e W100.IND_ENTREGA = “3” (Própria entidade declarante da ECF, na condição de Entidade Substituta ou de Preenchimento Local) e o campo W100.JURISDICAO_CONTROLADORA está preenchido, se existe um registro W200 com o campo jurisdição igual ao campo W100.JURISDICAO_CONTROLADORA. Se a empresa declarante informa que não é a controladora, deve haver um registro W200 com a mesma Jurisdição.
    tipo: Erro
  - regra: REGRA_EXISTE_TIN_JURISDICAO_W250
    descricao: – Verifica, quando o campo W100.IND_CONTROLADORA é igual “N” e W100.IND_ENTREGA = “3”, se existe um registro W250 com os campos TIN e JURISDICAO_TIN iguais a um registro W100 com os campos TIN e JURISDICAO_CONTROLADORA. Deve existir registro W250 com o mesmo TIN e jurisdição da controladora informada no registro W100.
    tipo: Erro
- numero: 6
  campo: TIN_CONTROLADORA
  regras:
  - regra: REGRA_TIN_CONTROLADORA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “N” (Não), se o campo W100.TIN_CONTROLADORA está preenchido.
    tipo: Habilita
  - regra: REGRA_TIN_CONTROLADORA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_CONTROLADORA é igual a “S” (Sim), se o campo W100.TIN_CONTROLADORA não está preenchido.
    tipo: Erro
  - regra: REGRA_VALIDA_TIN_CONTROLADORA
    descricao: 'Verifica, quando W100.JURISDICAO_CONTROLADORA for igual a “BR” (Brasil), se o campo W100.TIN_CONTROLADORA está preenchido com um CNPJ (aplica a REGRA_VALIDA_CNPJ: Verifica se o CNPJ informado é válido).'
    tipo: Erro
  - regra: REGRA_CNPJ_BASICO_DIFERENTE_CONTROLADORA
    descricao: Verifica, quando W100.JURISDICAO_CONTROLADORA for igual a “BR” (Brasil), se o campo W100.TIN_CONTROLADORA está preenchido com um CNPJ e se o CNPJ básico informado é diferente do CNPJ básico do declarante da ECF, informado em 0000.CNPJ.
    tipo: Erro
- numero: 7
  campo: IND_ENTREGA
  regras:
  - regra: REGRA_IND_ENTREGA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_CONTROLADORA está preenchido, se o campo W100.IND_ENTREGA está preenchido.
    tipo: Erro
  - regra: REGRA_IND_ENTREGA_NAO_PREENCHER_SEM_ACORDO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “2” (Controladora final do grupo multinacional) e W100.JURISDICAO_CONTROLADORA é diferente de “Brasil”, se o país informado no campo W100.JURISDICAO_CONTROLADORA consta na tabela de Acordo de Autoridades Competentes (A jurisdição de residência tributária da controladora final do grupo multinacional deve possuir Acordo de Autoridades Competentes com o Brasil para intercâmbio da Declaração País-a-País).
    tipo: Erro
  - regra: REGRA_IND_ENTREGA_NAO_PREENCHER_FALHA_SISTEMICA
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “2” (Controladora final do grupo multinacional) e W100.JURISDICAO_CONTROLADORA é diferente de “Brasil”, se o país informado no campo W100.JURISDICAO_CONTROLADORA consta na tabela de Falha Sistêmica (A jurisdição de residência tributária da controladora final do grupo multinacional está enquadra na situação de falha sistêmica, conforme definido na IN RFB nº 1.681/2016).
    tipo: Erro
  - regra: REGRA_IND_ENTREGA_JURISDICAO_BRASIL
    descricao: Verifica, quando W100.JURISDICAO_CONTROLADORA for igual a “BR” (Brasil), se o campo W100.IND_ENTREGA é igual a “1” (Grupo multinacional dispensado da entrega da Declaração País-a-País) ou “2” (Controladora do grupo multinacional).
    tipo: Erro
  - regra: REGRA_IND_ENTREGA_IND_CONTROLADORA
    descricao: Verifica, quando W100.IND_CONTROLADORA for igual a “S” (Sim), se o campo W100.IND_ENTREGA é igual a “1” (Grupo multinacional dispensado da entrega da Declaração País-a-País) ou “2” (Controladora do grupo multinacional).
    tipo: Erro
- numero: 8
  campo: IND_MODALIDADE
  regras:
  - regra: REGRA_HABILITA_IND_MODALIDADE
    descricao: Caso W100.IND_ENTREGA seja igual a “3” (Própria entidade declarante) ou “4” (Outra entidade), o campo W100.IND_MODALIDADE é habilitado. Caso contrário, o campo W100.IND_MODALIDADE é desabilitado.
    tipo: Habilita
  - regra: REGRA_IND_MODALIDADE_OBRIGATORIO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “3” (Própria entidade declarante) ou “4” (Outra entidade), se o campo W100.IND_MODALIDADE está preenchido.
    tipo: Erro
  - regra: REGRA_IND_MODALIDADE_NAO_PREENCHER_DISPENSADO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “1” (Grupo multinacional dispensado da entrega da Declaração País-a-País) ou “2” (Controlador do grupo multinacional), se o campo W100.IND_MODALIDADE não está preenchido.
    tipo: Erro
- numero: 9
  campo: NOME_SUBSTITUTA
  regras:
  - regra: REGRA_HABILITA_NOME_SUBSTITUTA
    descricao: |-
      Caso W100.IND_ENTREGA seja igual a “4” (Outra entidade), o campo
      W100.NOME_SUBSTITUTA é habilitado. Caso contrário, o campo W100.NOME_SUBSTITUTA é desabilitado.
    tipo: Habilita
  - regra: REGRA_NOME_SUBSTITUTA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade), se o campo W100.NOME_SUBSTITUTA está preenchido.
    tipo: Erro
  - regra: REGRA_NOME_SUBSTITUTA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_ENTREGA é diferente de “4” (Outra entidade), se o campo W100.NOME_SUBSTITUTA não está preenchido.
    tipo: Erro
- numero: 10
  campo: JURISDICAO_SUBSTITUTA
  regras:
  - regra: REGRA_HABILITA_SUBSTITUTA
    descricao: |-
      Caso W100.IND_ENTREGA seja igual a “4” (Outra entidade), o campo
      W100.JURISDICAO_SUBSTITUTA é habilitado. Caso contrário, o campo W100.JURISDICAO_SUBSTITUTA é desabilitado.
    tipo: Habilita
  - regra: REGRA_JURISDICAO_SUBSTITUTA_OBRIGATORIA
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade), se o campo W100.JURISDICAO_SUBSTITUTA está preenchido.
    tipo: Erro
  - regra: REGRA_JURISDICAO_SUBSTITUTA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_ENTREGA é diferente de “4” (Outra entidade), se o campo W100.JURISIDICAO_SUBSTITUTA não está preenchido.
    tipo: Erro
  - regra: REGRA_JURISDICAO_SUBSTITUTA_LOCAL
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade) e W100.IND_MODALIDADE é igual a “2” (Preenchimento local), se W100.JURISDICAO_SUBSTITUTA é igual a “Brasil”.
    tipo: Erro
  - regra: REGRA_JURISDICAO_SUBSTITUTA_NAO_PREENCHER_SEM_ACORDO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade) e W100.IND_MODALIDADE é igual a “1” (Entidade substituta) e W100.JURISDICAO_SUBSTITUTA é diferente de “Brasil”, se o país informado no campo W100.JURISDICAO_SUBSTITUTA consta na tabela de Acordo de Autoridades Competentes (A jurisdição de residência para fins tributários da entidade substituta do grupo multinacional deve possuir Acordo de Autoridades Competentes com o Brasil para intercâmbio da Declaração País-a-País).
    tipo: Erro
  - regra: REGRA_JURISDICAO_SUBSTITUTA_NAO_PREENCHER_FALHA_SISTEMICA
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade) e W100.IND_MODALIDADE é igual a “1” (Entidade substituta) e W100.JURISDICAO_SUBSTITUTA é diferente de “Brasil”, se o país informado no campo W100.JURISDICAO_SUBSTITUTA consta na tabela de Falha Sistêmica (A jurisdição de residência tributária da entidade substituta do grupo multinacional está enquadrada na situação de falha sistêmica, conforme definido na IN RFB nº 1.681/2016).
    tipo: Erro
- numero: 11
  campo: TIN_SUBSTITUTA
  regras:
  - regra: REGRA_HABILITA_SUBSTITUTA
    descricao: |-
      Caso W100.IND_ENTREGA seja igual a “4” (Outra entidade), o campo
      W100.TIN_SUBSTITUTA é habilitado. Caso contrário, o campo W100.TIN_SUBSTITUTA é desabilitado.
    tipo: Habilita
  - regra: REGRA_TIN_SUBSTITUTA_OBRIGATORIO
    descricao: Verifica, quando W100.IND_ENTREGA é igual a “4” (Outra entidade) e W100.JURISDICAO_SUBSTITUTA é igual a “Brasil”, se o campo W100.TIN_SUBSTITUTA está preenchido.
    tipo: Erro
  - regra: REGRA_TIN_SUBSTITUTA_NAO_PREENCHER
    descricao: Verifica, quando W100.IND_ENTREGA é diferente de “4” (Outra entidade) ou W100.JURISDICAO_SUBSTITUTA é diferente de “Brasil”, se o campo W100.TIN_SUBSTITUTA não está preenchido.
