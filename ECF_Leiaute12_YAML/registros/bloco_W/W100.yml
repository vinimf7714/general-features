    descricao: Caso [W100.IND_CONTROLADORA seja igual a “S” (Sim) e W100.IND_ENTREGA seja igual a “2” (Controladora final do grupo multinacional)] ou [W100.IND_ENTREGA seja igual a “3” (Própria entidade declarante da ECF) e W100.IND_MODALIDADE esteja preenchido], o campo W100.DT_INI é habilitado.
