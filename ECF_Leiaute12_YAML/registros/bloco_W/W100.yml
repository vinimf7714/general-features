informacoes_adicionais:
- conteudo: |-
    Observações:
    1 – Campo 7: IND_ENTREGA:
    Nesse campo, o contribuinte deve informar quem é a entidade declarante da Declaração País-a-País, em nome de todo o grupo multinacional, conforme as opções dispostas.
    O contribuinte deverá selecionar a opção 1 caso o grupo multinacional o qual integra esteja enquadrado na hipótese de dispensa de entrega da Declaração País-a-País descrita no item 1.1.1 do presente Manual e conforme artigo 4º da IN RFB nº 1.681/2016, bem como em caso de enquadramento em uma das situações descritas no tópico 1.1.3 do Manual com relação ao período fiscal do controlador final do grupo.
    A opção 2 deverá ser selecionada caso o responsável pela entrega da DPP seja o controlador final do grupo multinacional, residente no Brasil ou no exterior - situação em que o controlador cumprirá a obrigação junto à administração tributária de sua respectiva jurisdição de residência e em que a Declaração será compartilhada com a Receita Federal do Brasil por meio de acordo específico de troca automática de informação em vigor.
    Em conformidade com o que dispõe a IN RFB nº 1.681/2016, em seu artigo 3º, § 1º , é importante destacar que, para que o contribuinte possa apontar o controlador final estrangeiro como entidade responsável pelo cumprimento da obrigação de entrega da DPP, é necessário que a sua jurisdição de residência para fins tributários exija, em sua legislação doméstica*, a entrega da Declaração País-a- País; tenha firmado acordo de autoridades competentes com o Brasil que preveja o compartilhamento automático da Declaração; e não tenha sido notificada pelo Brasil de enquadramento em falha sistêmica, nem tenha notificado o País de enquadramento nessa situação. Caso algum desses requisitos não seja satisfeito, o grupo multinacional deve definir uma entidade substituta para o cumprimento da obrigação em nome de todo o grupo, a qual deve ser identificada pelo contribuinte (podendo ser ele mesmo a entidade substituta), ou o próprio contribuinte será obrigado à entrega da Declaração País-a-País, na condição de “Preenchimento Local”.
    A opção 3 deverá ser selecionada caso o próprio contribuinte seja a entidade responsável pela entrega da Declaração País-a-País junto à Receita Federal do Brasil, seja na condição de entidade substituta, seja na condição de Preenchimento Local (a identificação do papel desempenhado pelo contribuinte quando este for o responsável pela entrega da DPP deve ser efetuada no campo seguinte).
    É importante esclarecer que sob qualquer uma dessas condições a Declaração País-a-País deverá ser preenchida e entregue integralmente, com informações referentes a todo o grupo multinacional.
    A opção 4 deverá ser selecionada quando outra entidade, diferente do controlador final do grupo multinacional, for a responsável pela entrega da Declaração País-a-País (isto é, a entidade declarante), seja na condição de entidade substituta (residente no Brasil ou no exterior) ou na condição de Preenchimento Local. Essa última condição refere-se à hipótese em que a obrigação de entrega da Declaração País-a-País recaia sobre outra entidade integrante do grupo multinacional residente no Brasil que não seja o controlador final nem a entidade substituta, e exista mais de uma entidade integrante do mesmo grupo residente no Brasil (IN RFB nº 1.681/2016, art. 3º, §§ 1º e 2º).
    *Determinados países ainda estão em fase de implementação da Declaração País-a-País e não estarão em condições de exigir o documento de seus residentes com relação ao ano fiscal de 2016.
    Diante de tal situação, foi acordado entre os países participantes do Projeto BEPS a possibilidade de as jurisdições que estiverem com a implementação da Declaração País-a-País em andamento adotarem um mecanismo transitório de entrega voluntária da DPP com relação ao ano fiscal de declaração iniciado em 20163.
    Esse mecanismo permite que entidades controladoras finais de grupos multinacionais residentes nessas jurisdições entreguem a Declaração País-a-País às suas respectivas administrações tributárias, de maneira voluntária, para que sejam compartilhadas com os demais países onde o grupo opera e evitar que cada um desses países exija a entrega da Declaração localmente, da entidade integrante do grupo residente para fins tributários em sua jurisdição (modalidade intitulada aqui de “entrega local” ou “Preenchimento Local”).
    Portanto, poderão existir casos em que, apesar de na legislação doméstica da jurisdição de residência do controlador final do grupo multinacional ainda não estar vigorando a exigência da DPP com relação ao ano fiscal de 2016, estando a implementação da obrigação em andamento, será considerada válida a indicação de entidade declarante residente em tal jurisdição e aceito o documento devidamente compartilhado para fins do cumprimento da obrigação em nome do grupo.
    No entanto, para que o mecanismo seja aceito pelas demais jurisdições onde o grupo multinacional opera devem ser satisfeitos todos os requisitos estabelecidos no art. 7º, §2º da IN RFB nº 1.681/2016. Nesse caso, e desde que cumpridos todos os requisitos estabelecidos, o contribuinte deve preencher o campo 7 normalmente, indicando que o responsável pela entrega da Declaração País-a- País é o controlador final do grupo multinacional do qual faz parte.
    3 Informações adicionais podem ser encontradas no Guidance on the Implementation of Country-by-Country Reporting, publicado pela Organização para a Cooperação e o Desenvolvimento Econômico em junho de 2016. O documento pode ser acessado por meio do link: <http://www.oecd.org/tax/beps/guidance-on-the-implementation-of-country-by-country-reporting-beps-action-13.htm>
    2 – Campo 8: IND_MODALIDADE:
    Deve ser preenchido pelo contribuinte para indicar qual o papel desempenhado pela entidade declarante quando, no campo 7, houver sido informado que a entidade responsável pela Declaração País-a-País será o próprio contribuinte (opção 3) ou outra entidade (opção 4).
    A opção 1 deve ser selecionada quando a entidade responsável pela entrega da Declaração País-a-País for a entidade substituta.
    Caso no campo W100.IND_ENTREGA tenha sido informado que o próprio contribuinte é a entidade declarante (opção 3) e a opção 1 no campo W100.IND_MODALIDADE for selecionada, significa que o contribuinte é a entidade substituta, designada pelo grupo multinacional para cumprir a obrigação em nome do grupo, em substituição ao controlador final. Caso tenha sido indicado no campo W100.IND_ENTREGA que é outra entidade a responsável pela entrega da Declaração País-a-País (opção 4) e a opção 1 no campo W100.IND_MODALIDADE for selecionada, entende-se que é outra entidade, residente no Brasil ou no exterior, a entidade declarante, e na condição de entidade substituta.
    Importante ressaltar que uma entidade residente no Brasil somente poderá ser designada entidade substituta do grupo multinacional o qual integra caso o controlador final do grupo seja residente no exterior (vide art. 3º, caput, da IN RFB nº 1.681/2016).
    Quanto à designação de entidade substituta residente no exterior, essa só será aceita pela Receita Federal para fins de cumprimento da obrigação referente à Declaração País-a-País caso sejam verificadas todas as condições necessárias estabelecidas no art. 3º, §3º da IN RFB nº 1.681/2016.
    A opção 2, Preenchimento Local, deve ser selecionada quando a entidade responsável pela entrega da Declaração País-a-País não configurar nem como o controlador final do grupo multinacional, nem como a entidade substituta, estando obrigada à entrega da DPP (por exemplo, em razão da ocorrência de pelo menos uma das situações previstas na IN RFB nº 1.681/2016, em seu art. 3º, §1º). Destaca- se que essa modalidade de cumprimento da obrigação é válida apenas para entidades residentes no Brasil.
    Caso no campo W100.IND_ENTREGA tenha sido informado que a entidade declarante é o próprio contribuinte e a opção 2 do campo W100.IND_MODALIDADE for selecionada, significa que o controlador final do grupo multinacional é estrangeiro, mas que a obrigação de entrega da Declaração País-a-País junto à Receita Federal do Brasil recaiu sobre o próprio contribuinte. Na hipótese de existência de outras entidades residentes no Brasil integrantes do mesmo grupo multinacional, o preenchimento da forma citada estaria informando à Receita Federal, em cumprimento ao disposto na IN RFB nº 1.681/2016, em seu artigo 3º, § 2º, que o próprio contribuinte foi designado, dentre as entidades residentes brasileiras, a efetuar o cumprimento da obrigação. Assim, as demais entidades residentes no Brasil deverão preencher os campos W100.IND_ENTREGA e W100.IND_MODALIDADE em suas respectivas ECFs conforme o parágrafo abaixo, indicando que é outra entidade integrante brasileira a responsável pela entrega da DPP, na condição de Preenchimento Local.
    Na hipótese de ter sido indicado no W100.IND_ENTREGA que a entidade declarante é outra entidade e a opção 2 do campo W100.IND_MODALIDADE for selecionada, significa que o controlador final do grupo multinacional é estrangeiro, mas que a obrigação de entrega da Declaração País-a-País junto à Receita Federal do Brasil recaiu a outra entidade integrante do grupo residente no Brasil (não designada entidade substituta). Nesse caso, o contribuinte estaria informando, conforme determinado na IN RFB nº 1.681/2016, que existe mais de uma entidade do mesmo grupo residente no Brasil, além dele mesmo, e que a responsabilidade pelo cumprimento da obrigação acessória ficará a cargo de outra entidade, a ser identificada nos campos a seguir.
