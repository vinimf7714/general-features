  - regra: REGRA_VALIDA_TIN_SUBSTITUTA
    descricao: |-
      Verifica, quando W100.JURISDICAO_SUBSTITUTA for igual a “BR” (Brasil), se o campo
      W100.TIN_SUBSTITUTA está preenchido com um CNPJ (aplica a REGRA_VALIDA_CNPJ: Verifica se o CNPJ informado é válido).
    tipo: Erro
  - regra: REGRA_CNPJ_BASICO_DIFERENTE_SUBSTITUTA
    descricao: Verifica, quando W100.JURISDICAO_SUBSTITUTA for igual a “BR” (Brasil), se o campo W100.TIN_SUBSTITUTA está preenchido com um CNPJ e se o CNPJ básico informado é diferente do CNPJ básico do declarante da ECF, informado em 0000.CNPJ.
    tipo: Erro
