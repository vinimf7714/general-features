regras_validacao_registro_detalhe:
- regra: REGRA_DECLARANTE_INTEGRANTE_PAIS_A_PAIS
  descricao: Deve existir, pelo menos, um registro W250, com as oito primeiras posições do campo W250.TIN igual às oito primeiras posições do campo 0000.CNPJ.
- regra: REGRA_OBRIGATORIO_CAMPOS_W250
  descricao: Pelo menos um dos campos 13 a 26 deve estar preenchido com o "S". Se a regra não for cumprida, o sistema gera um erro.
regras_validacao_campos:
- numero: 4
  campo: TIN
  regras:
  - regra: REGRA_TIN_UNICO
    descricao: Verifica se existe somente um registro W250 com o TIN informado em W250.TIN. A regra não é executada caso W250.TIN seja igual a “NOTIN”.
    tipo: Erro
  - regra: REGRA_VALIDA_TIN
    descricao: 'Verifica, quando W250.JURISDICAO_TIN for igual a “BR” (Brasil), se o campo W250.TIN está preenchido com um CNPJ (aplica a REGRA_VALIDA_CNPJ: Verifica se o CNPJ informado é válido).'
    tipo: Erro
- numero: 5
  campo: JURISDICAO_TIN
  regras:
  - regra: REGRA_HABILITA_JURISDICAO_TIN
    descricao: Caso W250.TIN seja diferente de “NOTIN”, o campo W250.JURISDICAO_TIN deve ser habilitado. Caso contrário, o campo W250.JURISDICAO_TIN é desabilitado.
    tipo: Habilita
  - regra: REGRA_JURISDICAO_TIN_OBRIGATORIO
    descricao: |-
      Verifica, quando W250.TIN é diferente de “NOTIN”, se o campo
      W250.JURISDICAO_TIN está preenchido ou quando for igual a “NOTIN” e W100.IND_CONTROLADORA é igual a “N” e o campo W100.TIN_CONTROLADORA igual a “NOTIN”.
    tipo: Erro
  - regra: REGRA_JURISDICAO_TIN_NAO_PREENCHER
    descricao: |-
      Verifica, quando W250.TIN é igual a “NOTIN”, se o campo
      W250.JURISDICAO_TIN não está preenchido, o campo W100.IND_CONTROLADORA é diferente “N” e o campo W100.TIN_CONTROLADORA diferente de “NOTIN”.
    tipo: Erro
- numero: 7
  campo: JURISDICAO_NI
  regras:
  - regra: REGRA_HABILITA_JURISDICAO_NI
    descricao: |-
      Caso W250.NI esteja preenchido, o campo W250.JURISDICAO_NI deve ser habilitado.
      Caso contrário, o campo W250.JURISDICAO_NI é desabilitado.
    tipo: Habilita
  - regra: REGRA_JURISDICAO_IN_NAO_PREENCHER
    descricao: Verifica, quando W250.NI não está preenchido, se o campo W250.JURISDICAO_NI não está preenchido.
    tipo: Erro
- numero: 8
  campo: TIPO_NI
  regras:
  - regra: REGRA_HABILITA_TIPO_NI
    descricao: Caso W250.IN esteja preenchido, o campo W250.TIPO_NI deve ser habilitado. Caso contrário, o campo W250.TIPO_NI é desabilitado.
    tipo: Habilita
  - regra: REGRA_TIPO_NI_OBRIGATORIO
    descricao: Verifica, quando W250.NI está preenchido, se o campo W250.TIPO_NI está preenchido.
    tipo: Erro
  - regra: REGRA_TIPO_NI_NAO_PREENCHER
    descricao: Verifica, quando W250.NI não está preenchido, se o campo W250.TIPO_NI não está preenchido.
    tipo: Erro
- numero: 26
  campo: DESC_OUTROS
  regras:
  - regra: REGRA_HABILITA_DESC_OUTROS
    descricao: Caso W250.ATIV_13 seja igual a “S” (Sim), o campo W250.DESC_OUTROS deve ser habilitado. Caso contrário, o campo W250.DESC_OUTROS é desabilitado.
    tipo: Habilita
  - regra: REGRA_DESC_OUTROS_OBRIGATORIO
    descricao: Verifica, quando W250.ATIV_13 é igual a “S” (Sim), se o campo W250.DESC_OUTROS está preenchido.
    tipo: Erro
  - regra: REGRA_DESC_OUTROS_NAO_PREENCHER
    descricao: Verifica, quando W250.ATIV_13 é igual a “N” (Não), se o campo W250.DESC_OUTROS não está preenchido.
    tipo: Erro
