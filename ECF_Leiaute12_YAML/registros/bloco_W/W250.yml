campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (W250).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[W250]'
  obrigatorio: true
- numero: 2
  campo: JUR_DIFERENTE
  descricao: 'Jurisdição Tributária de Organização ou Incorporação, se diferente da jurisdição de residência para fins tributários, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas): A entidade declarante deve informar a jurisdição sob cuja legislação a entidade integrante do grupo multinacional está estabelecida, se diferente da jurisdição de residência para fins tributários.'
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 3
  campo: NOME
  descricao: |-
    Nome/Razão Social da Entidade Integrante: Nome legal completo da entidade, incluindo a designação doméstica da forma legal, conforme indicado em seus documentos de constituição ou similares.
    Caso a entidade seja um estabelecimento permanente, deverá ser reportada com referência à jurisdição onde está situada, e seu nome deve ser seguido por (P.E.), designação que significa, em inglês, “Permanent Establishment” (Estabelecimento Permanente). Além disso, deve ser indicada a entidade legal ao qual o estabelecimento permanente está relacionado. Exemplo: ABC P.E. (XYZ Ltda – China)
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: TIN
  descricao: |-
    Tax Identification Number (TIN): Número de identificação fiscal utilizado pela administração tributária da jurisdição de residência para fins tributários da entidade integrante reportada. Caso a entidade integrante reportada possua esse número de identificação, a informação é de fornecimento obrigatório. Para entidades residentes no Brasil, deve ser informado o CNPJ.
    Observação: Caso não exista o número, deve ser incluída a expressão "NOTIN".
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: JURISDICAO_TIN
  descricao: Jurisdição de Emissão do TIN, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 6
  campo: NI
  descricao: 'Número de Identificação (NI): O campo deve ser preenchido em caso de existência de outro número de identificação da entidade, como um número de registro ou um número de identificação global da entidade (“Global Entity Identification Number” – EIN).'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 7
  campo: JURISDICAO_NI
  descricao: |-
    Jurisdição de Emissão do NI, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
    Observação: Caso a jurisdição de emissão do NI não seja conhecida, o campo deve ser deixado em branco.
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: TIPO_NI
  descricao: 'Tipo do NI: Deve ser descrito, em texto livre, o tipo do número de identificação (NI) informado no W250.NI. Exemplo: número de identificação global da entidade (“Global Entity Identification Number” – EIN).'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 9
  campo: TIP_END
  descricao: |-
    Tipo do Endereço: A entidade declarante deve indicar, dentre as opções disponíveis de preenchimento do campo, o tipo do endereço da entidade integrante que está sendo reportada, o qual deverá ser descrito no campo seguinte.
    OECD302 - Residencial
    OECD303 - Comercial
  tipo: C
  tamanho: 7
  decimal: '-'
  valores_validos: '[OECD301; OECD302; OECD303; OECD304; OECD305]'
  obrigatorio: true
- numero: 10
