regras_validacao_registro_detalhe:
- regra: REGRA_C157_OBRIGATORIO
  descricao: Se existe na ECD o registro I157 para, pelo menos, uma conta em um período (Exceto o primeiro período da escrituração - C150.DT_INI diferente 0000.DT_INI – Se há I157 no primeiro período, o sistema recupera normalmente, sem verificar saldo do registro I157), deve existir neste período, registro I157(C157) para todas as contas com I155(C155).VL_SLD_INI diferente de zero. A conta deste período que não possui registro I157 gera erro e não é calculada no processo de recuperação.
- regra: REGRA_CONTA_SUBSTITUTA_SALDO_ZERO
  descricao: Se existe na ECD mais de uma ocorrência do registro I157 para a mesma conta/centro de custos e o seu somatório, considerando os indicadores de saldo (D = Devedor; C = Credor), for igual a zero, as contas/centros de custos existentes no registro C155 vinculadas ao registro C157 (oriundo do registro I157) serão apontadas, no relatório de validação das ECD recuperadas, com erro e não serão calculadas no processo de recuperação.
