descricao: Este registro armazena as informações provenientes dos registros K155/K156 da ECF do período imediatamente anterior. O usuário solicitará a recuperação dos dados através da funcionalidade “Recuperar Saldos da ECF anterior”.
titulo_leiaute: 'REGISTRO E015: CONTAS CONTÁBEIS MAPEADAS'
regras_validacao_registro:
- REGRA_EXISTENCIA_MAPEAMENTO
- REGRA_EXISTENCIA_K155_E015
- REGRA_COMPATIBILIDADE_C155_E015
- REGRA_COMPATIBILIDADE_E015_C155_C157
- REGRA_COMPATIBILIDADE_C157_E015
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: COD_CTA + COD_CCUS
