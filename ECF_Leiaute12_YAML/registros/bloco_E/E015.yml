regras_validacao_registro_detalhe:
- regra: REGRA_EXISTENCIA_MAPEAMENTO
  descricao: |-
    Verifica se o mapeamento recuperado existe no mapeamento atual. O erro ocorre se (0010.FORMA_TRIB = “1”, “2”, “3” ou “4” ou (0010.FORMA_TRIB = “5”, “7”, “8” ou “9” e 0010.TIP_ESC_PRE = “C”) e quando existir o registro E015, não existir pelo menos um registro J051 considerando:
    E015.COD_CTA = J050.COD_CTA
    E015.COD_CCUS = J051.COD_CCUS
    E010.COD_CTA_REF = J051.COD_CTA_REF
    E010.VAL_CTA diferente de zero
    Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_EXISTENCIA_K155_E015
  descricao: |-
    Verifica se o saldo inicial (K155) é igual ao somatório do saldo do registro E015 para a mesma conta contábil e centro de custo. O erro ocorre se existir ECF anterior recuperada (0000.HASH_ECF_ANTERIOR é diferente de vazio) e, para cada conta e centro de custo do registro K155 do primeiro período de apuração (K030.DT_INI = 0000.DT_INI) não existir um C157 para a mesma conta e centro de custo subordinado a um C150, onde:
    C150.DT_INI é maior ou igual a K030.DT_INI
    C150.DT_FIN é menor ou igual a K030.DT_FIN e o o saldo inicial (K155.VL_SLD_INI) for diferente do somatório de E015.VAL_CTA, onde:
    E015.COD_CTA = K155.COD_CTA; e E015.COD_CCUS = K155.COD_CCUS.
    Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_COMPATIBILIDADE_C155_E015
  descricao: |-
    Verifica se o saldo final da ECF anterior é igual ao saldo inicial da primeira ECD do período dos registros C155. O erro ocorre se existir ECF anterior recuperada (0000.HASH_ECF_ANTERIOR é diferente de vazio) e, considerando os registros filhos de C150, onde (C150.DT_INI = 0000.DT_INI): Para cada conta e centro de custo do registro C155 que não possua filhos C157, o valor inicial do C155 é diferente de zero e não existe a mesma conta e centro de custo no registro E015 e a conta é C040.COD_NAT diferente de “4” (contas de resultado).
    Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_COMPATIBILIDADE_E015_C155_C157
  descricao: |-
    Verifica a compatibilidade entre o registro E015 e os registros C155 ou C157. Para cada somatório por conta e centro de custo do registro E015 maior que zero e considerando os filos de C150, onde (C050.DT_INI = 0000.DT_INI):
    Se existir C157 para esta conta e centro de custos, o erro ocorre se o somatório de E015 for diferente do somatório de C157 para a mesma conta e centro de custos.
    Se não existir C157 para esta conta e centro de custos, o erro ocorre se o somatório de E015 for diferente do valor do saldo inicial de C155 para a mesma conta e centro de custos.
    Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_COMPATIBILIDADE_C157_E015
  descricao: |-
    Verifica se o saldo final da ECF anterior é igual ao saldo inicial da primeira ECD do período dos registros C157. O erro ocorre se existir ECF anterior recuperada (0000.HASH_ECF_ANTERIOR é diferente de vazio) e, considerando os registros filhos de C150, onde (C150.DT_INI = 0000.DT_INI): Para cada conta e centro de custo do registro C157, o valor inicial do C157 é diferente de zero e não existe a mesma conta e centro de custo no registro E015 e a conta é C040.COD_NAT diferente de “4” (contas de resultado).
    Se a regra não for cumprida, a ECF gera um aviso.
