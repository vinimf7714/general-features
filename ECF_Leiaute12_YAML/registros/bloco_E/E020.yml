_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: E020
nome: Saldos Finais das Contas na Parte B do e-Lalur da ECF Imediatamente Anterior
bloco: E
nome_tabela_registros: Saldos Finais das Contas da Parte B do e-Lalur da ECF Imediatamente Anterior
paginas_manual:
- 126
- 126
descricao: Recuperação dos saldos finais das contas da parte B do e-LALUR que serão replicados automaticamente pelo sistema para o registro M010/M500.
titulo_leiaute: 'REGISTRO E020: SALDOS FINAIS DAS CONTAS NA PARTE B DO e-LALUR DA ECF IMEDIATAMENTE ANTERIOR'
regras_validacao_registro:
- REGRA_EXISTENCIA_M010
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: COD_CTA_B + TRIBUTO
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: N
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se houver recuperação de dados da ECD
  ocorrencia: '[0;N]'
hierarquia:
  pai: E001
  filhos: []
  irmaos:
  - E010
  - E030
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (E020).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[E020]'
  obrigatorio: true
- numero: 2
  campo: COD_CTA_B
  descricao: 'Código da Conta da Parte B: Código unívoco atribuído pela empresa à conta no e-Lalur.'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESC_CTA_LAL
  descricao: Descrição da Conta.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: DT_AP_LAL
  descricao: 'Data de Criação: Data final do período de apuração em que a conta foi criada.'
  tipo: C
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 5
  campo: DT_LIM_LAL
  descricao: Data Limite para a Exclusão, Adição ou Compensação do Valor Controlado, se houver.
  tipo: C
  tamanho: 8
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: TRIBUTO
  descricao: |-
    Indicador de Tributo da Adição/Exclusão:
    I – Imposto de Renda Pessoa Jurídica C – Contribuição Social sobre o Lucro Líquido A – Ambos (IRPJ e CSLL)
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[I; C; A]'
  obrigatorio: false
- numero: 7
  campo: VL_SALDO_FIN
  descricao: Saldo Final do Período Anterior.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: IND_VL_SALDO_FIN
  descricao: |-
    Indicador de Saldo Final do Período Anterior:
    D – Para prejuízos ou valores que reduzam o lucro real ou a base de cálculo da contribuição social em períodos subsequentes.
    C – Para valores que aumentam o lucro real ou a base de cálculo na contribuição social em períodos subsequentes.
  tipo: C
  tamanho: 1
  decimal: null
  valores_validos: '[D; C]'
  obrigatorio: false
- numero: 9
  campo: COD_PB_RFB
  descricao: Código da tabela padrão da Parte B.
  tipo: C
  tamanho: 6
  decimal: '-'
  valores_validos: null
  obrigatorio: true
informacoes_adicionais:
- titulo: I – Regras de Validação de Registro
  conteudo: 'REGRA_EXISTENCIA_M010: Verifica se os dados recuperados no registro E020 existem no registro M010. Se a regra não for cumprida, a ECF gera um erro.'
