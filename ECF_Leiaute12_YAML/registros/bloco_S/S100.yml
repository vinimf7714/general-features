regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_BALANCO_SALDO_FINAL
  descricao: Verifica se o saldo final do ativo é igual ao saldo final do passivo. Gera um erro, caso S030.PER_APUR = “A12”.
- regra: REGRA_BALANCO_SALDO_INICIAL
  descricao: Verifica se o saldo inicial do ativo é igual ao saldo inicial do passivo. Gera um erro, caso S030.PER_APUR = “A01”.
regras_validacao_campos:
- numero: 2
  campo: CODIGO
  regras:
  - regra: REGRA_CTA_REF_MAPEADA_J051
    descricao: Verifica se a conta referencial utilizada encontra-se mapeada no registro J051.
    tipo: Erro
- numero: 8
  campo: VAL_CTA_REF_INI
  regras:
  - regra: REGRA_BAL_SI_IGUAL_ANT
    descricao: Verifica se o valor do saldo inicial do período atual é igual ao valor do saldo final do período anterior.
    tipo: Erro
- numero: 10
  campo: VAL_CTA_REF_DEB
  regras:
  - regra: REGRA_COMPARA_CONT_REF_DEB
    descricao: Verifica se o valor total dos débitos – S100.VAL_CTA_REF_DEB – é igual ao somatório dos débitos informados nos registro K156 – K156.VL_DEB.
    tipo: Erro
- numero: 11
  campo: VAL_CTA_REF_CRED
  regras:
  - regra: REGRA_COMPARA_CONT_REF_CRED
    descricao: Verifica se o valor total dos créditos – S100.VAL_CTA_REF_CRED – é igual ao somatório dos créditos informados nos registro K156 – K156.VL_CRED.
    tipo: Erro
- numero: 12
  campo: VAL_CTA_REF_FIN
  regras:
  - regra: REGRA_VALIDACAO_SALDO_FINAL_BAL
    descricao: |-
      Verifica se o valor do saldo final – S100.VAL_CTA_REF_FIN – é igual ao valor do saldo inicial –
      S100.VAL_CTA_REF_INI – somado ao valor total dos débitos – S100.VAL_CTA_REF_DEB – e subtraído do valor total dos créditos – S100.VAL_CTA_REF_CRED.
    tipo: Erro
  - regra: REGRA_COMPARA_CONT_REF_SF
    descricao: Verifica, para cada período da escrturação, se o somatório do saldo final do registro K156 é igual a S100.VAL_CTA_REF_INI, para a mesma conta referencial. Se a regra não for cumprida, a ECF gera um erro.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|S100|1.1.1.01|CAIXA|S|4|01|1.1.1|10000,00|C|5000,00|15000,00|20000,00|C|'
  explicacao:
  - valor: '|S100|'
    descricao: Identificação do tipo do registro.
  - valor: '|1.1.1.01|'
    descricao: Código da linha.
  - valor: '|CAIXA|'
    descricao: Descrição da linha.
  - valor: '|S|'
    descricao: Tipo da conta (S = Sintética).
  - valor: '|4|'
    descricao: Nível da conta.
  - valor: '|01|'
    descricao: Natureza da conta (01 = Ativo).
  - valor: '|1.1.1|'
    descricao: Código da conta superior.
  - valor: '|10000,00|'
    descricao: Valor do saldo inicial (R$ 10.000,00).
  - valor: '|C|'
    descricao: Indicador do sinal do saldo inicial da conta (C = Credor).
  - valor: '|5000,00|'
    descricao: Valor total dos débitos (R$ 5.000,00).
  - valor: '|15000,00|'
    descricao: Valor total dos créditos (R$ 15.000,00).
  - valor: '|20000,00|'
    descricao: Valor do saldo final (R$ 20.000,00).
  - valor: '|C|'
    descricao: Indicador do sinal do saldo final da conta (C = Credor).
