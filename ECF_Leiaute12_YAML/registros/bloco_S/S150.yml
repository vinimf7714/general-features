_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: S150
nome: Demonstrativo do Resultado Líquido no Período Fiscal
bloco: S
nome_tabela_registros: Demonstração do Resultado do Exercício das entidades TEF/SAF.
paginas_manual:
- 362
- 364
descricao: Apresenta a apuração da demonstração do resultado do exercício.
titulo_leiaute: 'REGISTRO S150: DEMONSTRATIVO DO RESULTADO LÍQUIDO NO PERÍODO FISCAL'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: CODIGO
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0010. FORMA_TRIB = “10”
  ocorrencia: '[0:12]'
hierarquia:
  pai: S030
  filhos: []
  irmaos:
  - S100
  - S200
  - S300
  - S500
  - S700
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (S150).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[S150]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Código da Conta Referencial (Analíticas e Sintéticas), conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF, no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: 50
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição da Conta Referencial.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: TIPO
  descricao: |-
    Indicador do Tipo de Conta:
    S – Sintética
    A – Analítica
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S; A]'
  obrigatorio: true
- numero: 5
  campo: NIVEL
  descricao: Nível da Conta.
  tipo: N
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: COD_NAT
  descricao: |-
    Natureza da Conta:
    04 – Contas de Resultado
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: '[04]'
  obrigatorio: false
- numero: 7
  campo: COD_CTA_SUP
  descricao: Código da Conta Sintética de Nível Imediatamente Superior.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: VALOR
  descricao: Saldo Final da Conta Referencial.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 9
  campo: IND_VALOR
  descricao: |-
    Indicador do Sinal do Saldo Final:
    C – Credor
    D – Devedor
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[D; C]'
  obrigatorio: true
regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
regras_validacao_campos:
- numero: 8
  campo: VALOR
  regras:
  - regra: REGRA_COMPARA_CONT_REF_SF_DRE
    descricao: |-
      Para cada período da escrituração verificar se somatório do saldo final do registro K356 é igual ao saldo deste registro para a mesma conta referencial. O erro ocorre se (0010. FORMA_TRIB = 1,2, 3 ou 4) ou (FORMA_TRIB for igual a ("5" ou "7" ou "8" ou "9" ou "10") e 0010.TIP_ESC_PRE = "C") e O saldo final (considerando indicador de débito e credito) de cada conta referencial é diferente do somatório da mesma conta referencial nos registros K356 para o mesmo período de apuração.
      - Na inexistencia do registro K356 ou do registro atual, considerar o valor zero.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|S150| 3.1.1.1.1.02|PATROCINIO|A|6|04|3.1.1.1.1|10000,00|D|'
  explicacao:
  - valor: '|S150|'
    descricao: Identificação do tipo do registro.
  - valor: '| 3.1.1.1.1.02|'
    descricao: Código da linha.
  - valor: '|PATROCINIO|'
    descricao: Descrição da linha.
  - valor: '|A|'
    descricao: Tipo da conta (A = Analítica).
  - valor: '|6|'
    descricao: Nível da conta.
  - valor: '|04|'
    descricao: Natureza da conta (04 = Contas de Resultado).
  - valor: '|3.1.1.1.1|'
    descricao: Código da conta superior.
  - valor: '|10000,00|'
    descricao: Valor do saldo final (R$ 10.000,00).
  - valor: '|D|'
    descricao: Indicador do sinal do saldo final da conta (D = Devedor).
informacoes_adicionais:
- titulo: III – Plano de Contas Referencial
  conteudo: |-
    Código: Chave da linha.
    Ordem: Ordem de apresentação das linhas.
    Tipo: S = Sintética; A = Analítica
    Natureza: 01 = Ativo; 02 = Passivo; 03 = Patrimônio Líquido; 04 = Contas de Resultado
    III.1 – S150 - Plano de Contas Referencial - Contas de Resultado - PJ do TEF::
    Vide planilha deste Registro no arquivo “Tabelas_Dinamicas_ECF_Leiaute_12_AC2025_SIT_ESP_2026.xlsx” a partir do link http://sped.rfb.gov.br/pasta/show/1644.
    (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
    Regras de validação da tabela dinâmica S150:
    Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_S150_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas.
    (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
