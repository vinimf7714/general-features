regras_validacao_registro_detalhe:
- regra: REGRA_COMPARA_CONT_REF_SI
  descricao: Verifica se P100.VAL_CTA_REF_INI é igual ao somatório dos saldos iniciais dos registros K155 “pai” da mesma conta referencial, multiplicado pelo saldo final do registro K156 dividido pelo saldo final do registro K155 “pai”. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_COMPARA_CONT_REF_SF
  descricao: Verifica, para cada período da escrturação, se o somatório do saldo final do registro K156 é igual a P100.VAL_CTA_REF_INI, para a mesma conta referencial. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_COMPATIBILIDADE_P100_E010
  descricao: Verifica se o saldo inicial do primeiro período de apuração da escrituração é diferente dos saldos finais da ECF recuperada. O erro ocorre se (0010.FORMA_TRIB = “3” ou “4”) ou (0010.FORMA_TRIB = “5” ou “7” e 0010.TIP_ESC_PRE = “C”) e 0010.HASH_ECF_ANTERIOR é diferente de vazio e P030.DT.INI é igual a 0000.DT_INI e (P100.VAL_CTA_REF_INI diferente de zero e não for localizada a mesma conta referencial no registro E010 ou P100.VAL_CTA_REF_INI diferente de E010.VAL_CTA_REF ou P100.IND_VAL_CTA_REF_INI diferente de E010.IND_VAL_CTA_REF). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_BALANCO_SALDO_FINAL
  descricao: Verifica se o saldo final do ativo é igual ao saldo final do passivo. Gera um erro, caso P030.PER_APUR = “T04”.
- regra: REGRA_BALANCO_SALDO_INICIAL
  descricao: Verifica se o saldo inicial do ativo é igual ao saldo inicial do passivo. Gera um erro, caso P030.PER_APUR = “T01”.
regras_validacao_campos:
- numero: 8
  campo: VAL_CTA_REF_INI
  regras:
  - regra: REGRA_BAL_SI_IGUAL_ANT
    descricao: Verifica, no caso de forma de apuração trimestral – 0010.FORMA_APUR = “T” – se o valor do saldo incial – P100.VAL_CTA_REF_INI – do período atual é igual ao valor do saldo final – P100.VAL_CTA_REF_FIN – do período anterior.
    tipo: Erro
- numero: 10
  campo: VAL_CTA_REF_DEB
  regras:
  - regra: REGRA_COMPARA_CONT_REF_DEB
    descricao: Verifica se o valor total dos débitos – P100.VAL_CTA_REF_DEB – é igual ao somatório dos débitos informados nos registro K156 – K156.VL_DEB.
    tipo: Erro
- numero: 11
  campo: VAL_CTA_REF_CRED
  regras:
  - regra: REGRA_COMPARA_CONT_REF_CRED
    descricao: Verifica se o valor total dos créditos – P100.VAL_CTA_REF_CRED – é igual ao somatório dos créditos informados nos registro K156 – K156.VL_CRED.
    tipo: Erro
- numero: 12
  campo: VAL_CTA_REF_FIN
  regras:
  - regra: REGRA_VALIDACAO_SALDO_FINAL_BAL
    descricao: |-
      Verifica se o valor do saldo final – P100.VAL_CTA_REF_FIN – é igual ao valor do saldo inicial –
      P100.VAL_CTA_REF_INI – somado ao valor total dos débitos – P100.VAL_CTA_REF_DEB – e subtraído do valor total dos créditos – P100.VAL_CTA_REF_CRED.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|P100|2.03.04.01.99|Contas de Patrimônio Líquido Não Classificadas|A|5|03|2.03.04.01|10000,00|C|5000,00|15000,00|20000,00|C|'
  explicacao:
  - valor: '|P100|'
    descricao: Identificação do tipo do registro.
  - valor: '|2.03.04.01.99|'
    descricao: Código da linha.
  - valor: '|Contas de Patrimônio Líquido Não Classificadas|'
    descricao: Descrição da linha.
  - valor: '|A|'
    descricao: Tipo da conta (A = Analítica).
  - valor: '|5|'
    descricao: Nível da conta.
  - valor: '|03|'
    descricao: Natureza da conta (03 = Contas do Patrimônio Líquido).
  - valor: '|2.03.04.01|'
    descricao: Código da conta superior.
  - valor: '|10000,00|'
    descricao: Valor do saldo inicial (R$ 10.000,00).
  - valor: '|C|'
    descricao: Indicador do sinal do saldo inicial da conta (C = Credor).
  - valor: '|5000,00|'
    descricao: Valor total dos débitos (R$ 5.000,00).
  - valor: '|15000,00|'
    descricao: Valor total dos créditos (R$ 15.000,00).
  - valor: '|20000,00|'
    descricao: Valor do saldo final (R$ 20.000,00).
  - valor: '|C|'
    descricao: Indicador do sinal do saldo final da conta (C = Credor).
