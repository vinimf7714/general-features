_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: P100
nome: Balanço Patrimonial
bloco: P
nome_tabela_registros: Balanço Patrimonial
paginas_manual:
- 330
- 333
descricao: |-
  Apresenta o balanço patrimonial com base nas contas referenciais para o período de apuração. O saldo inicial pode ser replicado do registro E010/E015 ou preenchido. O saldo final será recuperado do registro K155/K156.
  Atenção:
  Caso 0010. TIP_ESC_PRE for igual a “L” (Livro Caixa), este registro não será preenchido; exceto se 0010. IND_REC_RECEITA for igual a “2” (Regime de Competência), quando este registro será obrigatório, mesmo que a empresa não tenha entregue/recuperado a ECD.
titulo_leiaute: 'REGISTRO P100: BALANÇO PATRIMONIAL'
regras_validacao_registro:
- REGRA_COMPARA_CONT_REF_SI
- REGRA_COMPARA_CONT_REF_SF
- REGRA_COMPATIBILIDADE_P100_E010
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
- REGRA_BALANCO_SALDO_FINAL
- REGRA_BALANCO_SALDO_INICIAL
nivel_hierarquico: 3
