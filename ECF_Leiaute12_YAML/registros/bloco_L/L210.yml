_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: L210
nome: Informativo da Composição de Custos
bloco: L
nome_tabela_registros: Informativo da Composição de Custos
paginas_manual:
- 231
- 232
descricao: |-
  Apresenta a composição dos custos dos produtos fabricação própria vendidos e custos dos serviços prestados no período para as empresas que utilizam o inventário permanente.
  Observação: No caso de lucro real estimativa (anual), o preenchimento do registro L210 será:
  - No caso de receita bruta: somente será informado o período anual (A00)
  - No caso de balanço ou balancete: mensal, com saldos acumulados de um mês para outro.
titulo_leiaute: 'REGISTRO L210: INFORMATIVO DE COMPOSIÇÃO DE CUSTOS'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: CODIGO
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se (COD_QUALIF_PJ = “01”) E (L030.PER_APUR = “A00” OU [T01..T04]) Ou ([A01..A012] E 0010. MES_BAL_RED [1..12] for igual = “B”)
  ocorrencia: '[0;N]'
hierarquia:
  pai: L030
  filhos: []
  irmaos:
  - L100
  - L200
  - L300
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (L210).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[L210]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Código da Conta de Custos (Analítica), conforme tabela dinâmica do Sped.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição da Conta de Custos.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: VALOR
  descricao: Saldo Final da Conta de Custos Antes do Encerramento.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
regras_validacao_campos:
- numero: 4
  campo: VALOR
  regras:
  - regra: REGRA_OBRIGATORIO_TIPO_DIFERENTE_R
    descricao: Verifica se o campo está preenchido quando o tipo da linha é diferente de “R”.
    tipo: Erro
tabelas_dinamicas: |-
  L210 - Informativo de Composição de Custos
  R = Rótulo; E = Editável; CA = Cálculo Alterável; CNA = Cálculo Não Alterável
  Vide planilha deste Registro no arquivo “Tabelas_Dinamicas_ECF_Leiaute_12_AC2025_SIT_ESP_2026.xlsx” a partir do link http://sped.rfb.gov.br/pasta/show/1644.
  (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
  Regras de validação da tabela dinâmica L210:
  Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_L210_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas.
  (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
exemplos_preenchimento:
- linhas_exemplo:
  - '|L210|92|Constituição de Provisões|1000,00|'
  explicacao:
  - valor: '|L210|'
    descricao: Identificação do tipo do registro.
  - valor: '|92|'
    descricao: Código da linha.
  - valor: '|Constituição de Provisões|'
    descricao: Descrição da linha.
  - valor: '|1000,00|'
    descricao: Valor da linha (R$ 1.000,00).
