_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: V100
nome: Demonstrativo dos Recursos em Moeda Estrangeira Decorrentes do Recebimento de Exportações
bloco: V
nome_tabela_registros: Demonstrativo dos recursos em moeda estrangeira decorrentes do recebimento de exportações
paginas_manual:
- 424
- 425
descricao: Este registro informa o código, a descrição e os valores de aplicações financeiras, investimentos e pagamento de obrigações próprias do exportador, na moeda informada no registro V010.
titulo_leiaute: 'REGISTRO V100: DEMONSTRATIVO DOS RECURSOS EM MOEDA ESTRANGEIRA DECORRENTES DO RECEBIMENTO DE EXPORTAÇÕES'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_ATUALIZADA
- REGRA_LINHA_DESPREZADA
nivel_hierarquico: 4
ocorrencia: 1:N ]
campos_chave: null
observacoes_leiaute:
- ']'
tabela_registros:
  nivel: 4
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: O
    condicao: Obrigatório se existir V010.
  ocorrencia: '[1;N]'
hierarquia:
  pai: V030
  filhos: []
  irmaos: []
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (V100).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[V100]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Identificação da linha, conforme tabela publicada pela RFB.
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: Conforme tabela SPEDECF_V100
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição da linha, conforme tabela publicada pela RFB
  tipo: C
  tamanho: 1000
  decimal: '-'
  valores_validos: null
  obrigatorio: '-'
- numero: 4
  campo: VALOR
  descricao: Valor da Linha
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: '-'
regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
regras_validacao_campos:
- numero: 4
  campo: VALOR
  regras:
  - regra: REGRA_OBRIGATORIO_TIPO_DIFERENTE_R
    descricao: Verifica se o campo está preenchido quando o tipo da linha é diferente de “R”.
    tipo: Erro
tabelas_dinamicas: |-
  V100 – Demonstrativo dos recursos em moeda estrangeira decorrentes do recebimento de exportações
  Vide planilha deste Registro no arquivo “Tabelas_Dinamicas_ECF_Leiaute_12_AC2025_SIT_ESP_2026.xlsx” a partir do link http://sped.rfb.gov.br/pasta/show/1644.
  (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
  Regras de validação da tabela dinâmica V100:
  Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_V100_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas. (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
