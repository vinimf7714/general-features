_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: M310
nome: Contas Contábeis Relacionadas ao Lançamento da Parte A do e-Lalur
bloco: M
nome_tabela_registros: Contas Contábeis Relacionadas ao Lançamento da Parte A do e-Lalur
paginas_manual:
- 253
- 254
descricao: Relaciona os lançamentos da parte A do e-Lalur com as contas contábeis.
titulo_leiaute: 'REGISTRO M310: CONTAS CONTABEIS RELACIONADAS AO LANÇAMENTO DA PARTE A DO e-LALUR'
regras_validacao_registro:
- REGRA_REGISTRO_M312_OBRIGATORIO
nivel_hierarquico: 4
ocorrencia: 0:N
campos_chave: COD_CTA + COD_CCUS
tabela_registros:
  nivel: 4
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se M300.IND_RELACAO = “2” ou “3”
  ocorrencia: '[0;N]'
hierarquia:
  pai: M300
  filhos:
  - M312
  irmaos:
  - M305
  - M315
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (M310).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[M310]'
  obrigatorio: true
- numero: 2
  campo: COD_CTA
  descricao: 'Código da Conta Contábil (Plano de Contas da Pessoa Jurídica): Código da conta ou subconta contábil onde está registrado o valor a ser adicionado ou excluído, quando possível sua identificação (deve existir no J050).'
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: '[J050.COD_CTA]'
  obrigatorio: true
- numero: 3
  campo: COD_CCUS
  descricao: Código do Centro de Custos (deve existir no J100).
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: '[J100_COD_CCUS]'
  obrigatorio: false
- numero: 4
  campo: VL_CTA
  descricao: Valor da Conta Utilizado no Lançamento da Parte A.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: IND_VL_CTA
  descricao: |-
    Indicador do Valor do Lançamento:
    D – Devedor.
    C – Credor.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[D; C]'
  obrigatorio: true
regras_validacao_registro_detalhe:
- regra: REGRA_REGISTRO_M312_OBRIGATORIO
  descricao: |-
    Verifica se o registro M312 foi preenchido no caso de M310.VL_CTA, para o mesmo M310.COD_CTA e M310.COD_CCUS:
    - No caso de J050.COD_NAT igual a“1” (Ativo), “2” (Passivo) ou “3” (Patrimônio Líquido):
    - For diferente do saldo final da conta em K155.VL_SLD_FIN no período de apuração; ou
    - For diferente do resultado da diferença entre o saldo final da conta em K155.VL_SLD_FIN e o saldo inicial da conta em K155.VL_SLD_INI no período de apuração (saldo do período); ou
    - For diferente do total de débitos da conta em K155.VL_DEB; ou
    - For diferente do total de crédito da conta me K155_VL_CRED.
    - No caso de J050.COD_NAT igual “4” (Contas de Resultado), for diferente do saldo final da conta em K355.VL_SLD_FIN.
    Se a regra não for cumprida, o sistema gera um aviso.
regras_validacao_campos:
- numero: 2
  campo: COD_CTA
  regras:
  - regra: REGRA_RELACIONAMENTO_PATRIMONIAL
    descricao: |-
      Verifica se a conta é de resultado, exceto no caso de exclusão de juros sobre o capital próprio, conforme abaixo:
      PJ em Geral – M300(166.03), M300(340,04), M350(166.03) e M350(340.04)
      Financeiras – M300(198.03) e M350(198.03)
      Seguradoras – M300(137.03) e M350(137.03)
    tipo: Aviso
  - regra: REGRA_VALIDA_CONTA_BALANCO_DRE
    descricao: Verifica se o campo M310.COD_CTA e o campo M310.COD_CCUS existem no registro K155 ou no registro K355 para o mesmo período de apuração.
    tipo: Erro
- numero: 4
  campo: VL_CTA
  regras:
  - regra: REGRA_SALDO_CONTABIL_MENOR
    descricao: Verifica se M310.VL_CTA é menor ou igual ao saldo final da conta no período menos os outros lançamentos no mesmo período de apuração para a parte A.
    tipo: Erro
  - regra: REGRA_OBRIGATORIA_M310_VL_CTA
    descricao: Verifica se M310.VL_CTA foi preenchido quando M300. IND_RELACAO for igual a “2” (com conta contábil).
    tipo: Erro
- numero: 5
  campo: IND_VL_CTA
  regras:
  - regra: REGRA_INDICADOR_CONTABIL_DIFERENTE
    descricao: Verifica se o indicador do saldo final da conta no período é igual ao indicador do valor da conta utilizado no relacionamento M310.IND_VL_CTA.
    tipo: Aviso
exemplos_preenchimento:
- linhas_exemplo:
  - '|M310|1.01.01.01||1000,00|D|'
  explicacao:
  - valor: '|M310|'
    descricao: Identificação do tipo do registro.
  - valor: '|1.01.01.01|'
    descricao: Código da conta contábil.
  - valor: '||'
    descricao: Código do centro de custos (não há).
  - valor: '|1000,00|'
    descricao: Valor da conta utilizado no lançamento da parte A do e-Lacs (R$ 1.000,00).
  - valor: '|D|'
    descricao: Indicador do valor da conta utilizado no lançamento da parte A do e-Lacs (D = Devedor).
