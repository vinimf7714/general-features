campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (M300).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[M300]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Código do Lançamento no e-Lalur, conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição do Tipo de Lançamento no e-Lalur, conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: TIPO_LANCAMENTO
  descricao: |-
    Indicador do Tipo de Lançamento:
    A- Adição
    E - Exclusão.
    P - Compensação de Prejuízo
    L - Lucro
    Observação: O tipo “R” (Rótulo) é para linhas de títulos, que aparecem na interface do programa. Portanto, não deve ser utilizado neste campo.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[A; E; P; L]'
  obrigatorio: false
- numero: 5
  campo: IND_RELACAO
  descricao: |-
    Indicador de Relacionamento do Lançamento da Parte A:
    1 - Com Conta da Parte B
    2 - Com Conta Contábil
    3 – Com Conta da parte B e Conta Contábil
    4 - Sem Relacionamento
    Observação: O valor do lançamento do tipo 3 pode considerar o saldo contas da parte B ou somatório dos saldos das contas da parte B com os saldos das contas contábeis.
    Para isso, o valor do lançamento correto na parte A deve ser preenchido pela empresa.
  tipo: N
  tamanho: 1
  decimal: '-'
  valores_validos: '[1; 2; 3; 4]'
  obrigatorio: false
- numero: 6
  campo: VALOR
  descricao: Valor do Lançamento no e-Lalur
  tipo: NS
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 7
  campo: HIST_LAN_LAL
  descricao: Histórico do Lançamento no e-Lalur
  tipo: C
  tamanho: 500
  decimal: '-'
  valores_validos: null
  obrigatorio: false
exemplos_preenchimento:
- linhas_exemplo: []
  explicacao: []
  observacoes:
  - 1 - Contabilidade da Empresa - Constituição da Provisão
  - 'Débito: Despesas com Provisão 100'
  - 'Crédito: Perdas Estimadas com Créditos de Liquidação Duvidosa 100'
  - Essa despesa é indedutível, e será adicionada na Parte A do e-Lalur e, também, será constituído um saldo de mesmo valor na Parte B, para exclusões futuras (lançamento do tipo 3).
  - '2 – Reversão da Provisão:'
  - 'Débito: Perdas Estimadas com Créditos de Liquidação Duvidosa 50'
  - 'Crédito: Reversão da Provisão da Provisão (Receita) 50'
  - Nesse caso, há uma exclusão na Parta A do e-Lalur, reduzindo o saldo da parte B e, também, há a reversão do saldo na parte contábil (lançamento do tipo 3).
  - 3 - Perda considerada incobrável (Perda consumada)
  - 'Débito: Perdas Estimadas com Créditos de Liquidação Duvidosa 30'
  - 'Crédito: Duplicadas a Receber 30'
  - Nesse caso, há uma exclusão na Parta A do e-Lalur, reduzindo o saldo da parte B (lançamento do tipo 1).
  contexto: 'quando M300.IND_RELACAO = “3” (Conta Conta da Parte B e Conta Contábil):'
- linhas_exemplo:
  - '|M300|138|(-) Outras Exclusões|E|1|1000,00|LANÇAMENTO DE EXCLUSÃO XXXX|'
  explicacao:
  - valor: '|M300|'
    descricao: Identificação do tipo do registro.
  - valor: '|138|'
    descricao: Código do lançamento.
  - valor: '|(-) Outras Exclusões|'
    descricao: Descrição.
  - valor: '|E|'
    descricao: Tipo do lançamento (E = Exclusão).
  - valor: '|1|'
    descricao: Indicador de relacionamento (1 = Com Conta da Parte B).
  - valor: '|1000,00|'
    descricao: Valor (R$ 1.000,00)
  - valor: '|LANÇAMENTO DE EXCLUSÃO XXXX|'
    descricao: Histórico do lançamento.
regras_validacao_registro_detalhe:
- regra: REGRA_VALOR_DETALHADO
  descricao: |-
    Verifica, quando M300.IND_RELACAO for igual a “1” (com conta da parte B), se o M300.VALOR é igual ao somatório de M305.VALOR_CTA.
    Verifica, quando M300.IND_RELACAO for igual a “2” (com conta contábil) se o M300.VALOR é igual ao somatório de M310.VALOR_CTA.
    Verifica, quando M300.IND_RELACAO for igual a “3” (com conta da parte B e conta contábil) se o M300.VALOR é igual ao somatório de M305.VALOR_CTA ou é igual ao somatório de M310.VALOR_CTA ou é igual ao somatório de M305.VALOR_CTA com M310.VALOR_CTA.
    O somatorio deve fazer a seguinte conversão de sinais:
    Se M300.TIPO_LANCAMENTO = “A” (Adição) ou “L” (Lucro):
    - Se M305.IND_VL_CTA = “D”, então ”+” (valor positivo).
    - Se M305.IND_VL_CTA = “C”, então ”-” (valor negativo).
    - Se J050.COD_NAT = “4” (Conta de resultado) e M310.IND_VL_CTA = “D”, então ”+” (valor positivo).
    - Se J050.COD_NAT = “4” (Conta de resultado) e M310.IND_VL_CTA = “C”, então ”-” (valor negativo).
    - Se J050.COD_NAT = “1, 2 ou 3” (Conta de ativo, passivo ou patrimônio líquido) e M310.IND_VL_CTA = “D”, então ”-” (valor negativo).
    - Se J050.COD_NAT = “1, 2 ou 3” (Conta de ativo, passivo ou patrimônio líquido) e M310.IND_VL_CTA = “C”, então ”+” (valor positivo).
    Se M300.TIPO_LANCAMENTO = “E” (Exclusão) ou “P” (Prejuízo):
    - Se M305.IND_VL_CTA = “D”, então ”-” (valor negativo).
    - Se M305.IND_VL_CTA = “C”, então ”+” (valor positivo).
    - Se J050.COD_NAT = “4” (Conta de resultado) e M310.IND_VL_CTA = “D”, então ”-” (valor negativo).
    - Se J050.COD_NAT = “4” (Conta de resultado) e M310.IND_VL_CTA = “C”, então ”+” (valor positivo).
    - Se J050.COD_NAT = “1, 2 ou 3” (Conta de ativo, passivo ou patrimônio líquido) e M310.IND_VL_CTA = “D”, então ”+” (valor positivo).
    - Se J050.COD_NAT = “1, 2 ou 3” (Conta de ativo, passivo ou patrimônio líquido) e M310.IND_VL_CTA = “C”, então ”-” (valor negativo).
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
regras_validacao_campos:
- numero: 4
  campo: TIPO_LANCAMENTO
  regras:
  - regra: REGRA_OBRIGATORIO_TIPO_E
    descricao: Verifica se M300.TIPO_LANCAMENTO não está preenchido quando o tipo de linha é “E”.
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_TIPO_DIFERENTE_E
    descricao: Verifica se M300.TIP_LANCAMENTO está preenchido quando o tipo da linha é “E”.
    tipo: Erro
  - regra: REGRA_RELACAO_INEXISTENTE
    descricao: |-
      - Verifica se existe, pelo menos, um registro M305/M355 filho e não existe um registro M310/M360 filho, quando M300.IND_RELACAO é igual a “1” (Com Conta da Parte B).
      - Verifica se não existe registro M305/M355 filho e existe, pelo menos, um registro M310/M360 filho, quando M300.IND_RELACAO é igual a “2” (Com Conta Contábil).
      - Verifica se existe, pelo menos, um registro M305/M355 filho e, pelo menos, um registro M310/M360 filho, quando M300.IND_RELACAO é igual a “3” (Com Conta da Parte B e Conta Contábil).
      - Verifica se não existe registro M305/M355 filho e se não existe um registro M310/M360 filho, quando M300.IND_RELACAO é igual a “4” (Com Conta da Parte B).
    tipo: Erro
- numero: 5
  campo: IND_RELACAO
  regras:
  - regra: REGRA_IND_RELACAO
    descricao: Verifica, quando M300.TIPO_LANCAMENTO for igual a “P” (compensação de prejuízo), se M300.IND_RELACAO é igual a “1” (com conta da parte B).
    tipo: Erro
  - regra: REGRA_OBRIGATORIO_TIPO_E
    descricao: Verifica se o campo M300.IND_RELACAO não está preenchido quando o tipo de linha é “E”.
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_TIPO_DIFERENTE_E
    descricao: Verifica se o campo M300.IND_RELACAO está preenchido quando o tipo da linha é “E”.
    tipo: Erro
- numero: 6
  campo: VALOR
  regras:
  - regra: REGRA_OBRIGATORIO_TIPO_R
    descricao: Verifica se o campo M300.VALOR não está preenchido quando o tipo de linha é “R”.
    tipo: Erro
  - regra: REGRA_NAO_PREENCHER_TIPO_DIFERENTE_R
    descricao: Verifica se o campo M300.VALOR está preenchido quando o tipo da linha é “R”.
    tipo: Erro
- numero: 7
  campo: HIST_LAN_LAL
  regras:
  - regra: REGRA_NAO_PREENCHER_TIPO_DIFERENTE_E
    descricao: Verifica se o campo M300.HIST_LAN_LAL está preenchido quando o tipo da linha é “E” e M300.IND_RELACAO = “4” (Sem relacionamento).
    tipo: Erro
tabelas_dinamicas: |-
  Formato: NS = Numérico Com Sinal; N = Numérico Sem Sinal
  Tipo: R = Rótulo; E = Editável; CA = Cálculo Alterável; CNA = Cálculo Não Alterável
  Tipo_Lançamento: A = Adição; E = Exclusão; P = Compensação de Prejuízos; R = Rótulo; L = Lucro
  Atenção: Códigos do tipo XX.XX não significam que são hierarquicamente subordinados a códigos do tipo XX. Todos os códigos possuem a mesma hierarquia.
