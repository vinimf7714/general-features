_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: K355
nome: Saldos Finais das Contas Contábeis de Resultado Antes do Encerramento
bloco: K
nome_tabela_registros: Saldos Finais das Contas Contábeis de Resultado Antes do Encerramento
paginas_manual:
- 152
- 153
descricao: |-
  Registro onde devem ser informados os saldos finais de todas as contas de resultado da escrituração societária da pessoa jurídica antes do encerramento. Poderá ser preenchido das seguintes formas:
  - Edição pelo programa da ECF;
  - Calculado pelo sistema através da funcionalidade de recuperar ECD; e
  - Importado de arquivo digital.
titulo_leiaute: 'REGISTRO K355: SALDOS FINAIS DAS CONTA CONTÁBEIS DE RESULTADO ANTES DO ENCERRAMENTO'
regras_validacao_registro:
- REGRA_CONTA_ANALITICA
- REGRA_COMPATIBILIDADE_K355_E355
- REGRA_COMPATIBILIDADE_E355_K355
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: COD_CTA + COD_CCUS
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: F
  ocorrencia: '[0;N]'
hierarquia:
  pai: K030
  filhos:
  - K356
  irmaos:
  - K155
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (K355).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[K355]'
  obrigatorio: true
- numero: 2
  campo: COD_CTA
  descricao: Código da Conta Analítica de Resultado.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: COD_CCUS
  descricao: Código do Centro de Custos.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: VL_SLD_FIN
  descricao: Valor do Saldo Final Antes do Lançamento de Encerramento.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: IND_VL_SLD_FIN
  descricao: |-
    Indicador da Situação do Saldo Final:
    D – Devedor.
    C – Credor.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[D; C]'
  obrigatorio: true
regras_validacao_registro_detalhe:
- regra: REGRA_CONTA_ANALITICA
  descricao: Verifica se a conta e o centro de custos estão no plano de contas (J050) como conta analítica. Se a regra não for cumprida, o sistema gera um erro.
- regra: REGRA_COMPATIBILIDADE_K355_E355
  descricao: Verifica se os valores utilizados no registro K355 são iguais aos valores calculados do registro E355. Se a regra não for cumprida, o sistema gera um aviso.
- regra: REGRA_COMPATIBILIDADE_E355_K355
  descricao: |-
    Verifica se os campos do registro E355 com algum valor maior que zero, são referenciados no registro K355 para o mesmo período de apuração.
    Se a regra não for cumprida, o sistema gera um aviso.
regras_validacao_campos:
- numero: 2
  campo: COD_CTA
  regras:
  - regra: REGRA_NATUREZA_PERMITIDA_4
    descricao: Verifica se a conta informada no registro K355 possui J050.COD_NAT igual a “04” (Contas de Resultado).
    tipo: Erro
- numero: 4
  campo: VL_SLD_FIN
  regras:
  - regra: REGRA_MAPEAMENTO
    descricao: Verifica se o somatório de K356.VAL_CTA_REF_FIN é igual ao K355.VL_SLD_FIN.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|K355|3.01.1234||5000,00|C|'
  explicacao:
  - valor: '|K355|'
    descricao: Identificação do tipo do registro.
  - valor: '|3.01.1234|'
    descricao: Código da conta analítica de resultado.
  - valor: '||'
    descricao: Código do centro de custos (Não há).
  - valor: '|5000,00|'
    descricao: Valor do saldo final da conta de resultado antes do encerramento (R$ 5.000,00).
  - valor: '|C|'
    descricao: Indicador de situação do saldo final (C = Credor).
