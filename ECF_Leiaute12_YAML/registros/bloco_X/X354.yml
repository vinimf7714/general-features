  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X354
nome: Demonstrativo de Prejuízos Acumulados
bloco: X
nome_tabela_registros: Demonstrativo de Prejuízos Acumulados
paginas_manual:
- 494
- 494
descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas para demonstrar os prejuízos acumulados no exterior de controladas, diretas ou indiretas, equiparadas ou coligadas em regime de competência.
  Observação 1: Em X354.RES_NEG deverá ser o valor total do resultado negativo de cada controlada, direta ou indireta, equiparada ou coligada.
  Observação 2: Este demonstrativo é o que se refere o inciso III do art. 35 da Instrução Normativa RFB no 1.520, de 4 de dezembro de 2014.
  Observação 3: Todos os campos devem ser informados, ainda que o valor a ser informado seja “zero”.
