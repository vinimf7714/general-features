exemplos_preenchimento:
- linhas_exemplo:
  - '|X355|100000,00|250000,00|1000000,00|2500000,00|900000,00|2250000,00|90,00|'
  explicacao:
  - valor: '|X355|'
    descricao: Identificação do tipo do registro.
  - valor: '|100000,00|'
    descricao: Renda passiva própria em moeda do país de domicílio (U$ 100.000,00).
  - valor: '|250000,00|'
    descricao: Renda passiva própria em reais (R$ 250.000,00).
  - valor: '|1000000,00|'
    descricao: Renda total em moeda do país de domicílio (U$ 1.000.000,00).
  - valor: '|2500000,00|'
    descricao: Renda total em reais (R$ 2.500.000,00).
  - valor: '|900000,00|'
    descricao: Renda ativa própria em moeda do país de domicílio (U$ 900.000,00 = U$ 1.000.000,0 – U$ 100.000,00).
  - valor: '|2250000,00|'
    descricao: Renda ativa própria em reais (R$ 2.250.000,00 = R$ 2.500.000,00 – R$ 250.000,00).
  - valor: '|90,00|'
    descricao: Valor percentual (U$ 900.000,00/U$ 1.000.000,00 = 90%).
