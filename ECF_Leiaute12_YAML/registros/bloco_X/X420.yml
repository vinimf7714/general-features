_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X420
nome: Royalties Recebidos ou Pagos a Beneficiários do Brasil e do Exterior
bloco: X
nome_tabela_registros: Royalties Recebidos ou Pagos a Beneficiários do Brasil e do Exterior
paginas_manual:
- 523
- 528
descricao: |-
  Este registro será habilitado somente para as pessoas jurídicas que, durante o ano-calendário, tiveram recebimentos ou pagamentos de pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior, a título de royalties (0020.IND_ROY_REC = “S” (Sim) ou 0020.IND_ROY_PAG = “S”) relativos a:
  - Exploração econômica dos direitos patrimoniais do autor, de marcas, de patentes e de desenho industrial;
  - Exploração de know-how;
  - Exploração de franquias;
  - Exploração dos direitos relativos à propriedade intelectual referente a cultivares.
  Observação: A pessoa jurídica deverá informar os valores consolidados por país.
titulo_leiaute: 'REGISTRO X420: ROYALTIES RECEBIDOS OU PAGOS A BENEFICIÁRIOS DO BRASIL E DO EXTERIOR'
regras_validacao_registro:
- REGRA_ROYALTIES_BRASIL
- REGRA_ROYALTIES_EXTERIOR
- REGRA_X420_OBRIGATORIO_R
- REGRA_X420_OBRIGATORIO_P
- REGRA_X420_PREENCHIDO
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: TIP_ROY + PAIS
