campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (X420)
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X420]'
  obrigatorio: true
- numero: 2
  campo: TIP_ROY
  descricao: |-
    Indicar se são royalties recebidos ou pagos a beneficiários no Brasil e no exterior.
    Tipo dos royalties:
    R - Recebido
    P – Pago
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[R; P]'
  obrigatorio: true
- numero: 3
  campo: PAIS
  descricao: |-
    País: País ou a dependência de país de residência ou de domicílio da pessoa física ou jurídica que efetuou o pagamento ou a remessa do valor recebido ou pago pela pessoa jurídica declarante, observado os exemplos a seguir:
    Exemplos:
    1) Pessoa jurídica domiciliada na França possui conta corrente no Canadá e a partir desta remete royalties para a pessoa jurídica declarante. Nesse caso, o país a ser selecionado é a França.
    2) Pessoa jurídica declarante efetua remessa, por conta e ordem do beneficiário do pagamento que é residente no Japão, para conta corrente localizada nos Estados Unidos da América. Nesse caso, o país a ser selecionado é o Japão.
    Código do país, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: N
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: VL_EXPL_DIR_SW
  descricao: |-
    Valor da Exploração Econômica dos Direitos Patrimoniais do Autor Relativos a Software: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos atos e aos contratos de licença ou cessão de direitos de comercialização, distribuição e reprodução de programa de computador, de que trata a Lei nº 9.609, de 19 de fevereiro de 1998. Informar também neste campo o valor relativo aos contratos que impliquem transferência de tecnologia de programa de computador, de que trata o art. 11 da Lei nº 9.609, de 1998. Ainda, deverá ser informado, neste campo, o valor recebido em decorrência dos contratos que envolvam concessão de licença para uso próprio do adquirente, sob a modalidade de cópia única.
    Atenção: Não incluir neste campo o valor recebido ou pago ou remetido a título de transferência total dos direitos patrimoniais do programa de computador.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 5
  campo: VL_EXPL_DIR_AUT
  descricao: |-
    Valor da Exploração Econômica dos Direitos Patrimoniais do Autor, Exceto Software:
    Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos contratos que transferem a terceiros, por meio de licenciamento, concessão, cessão ou por outros meios admitidos em Direito, o direito de reproduzir, comercializar ou distribuir a obra protegida pelo Direito Autoral, de que trata o art. 7º da Lei nº 9.610, de 19 de fevereiro de1998, exceto programas de computador, tais como:
    - textos de obras literárias, artísticas ou científicas;
    - conferências, alocuções, sermões e outras obras da mesma natureza;
    - obras dramáticas e dramático-musicais;
    - obras coreográficas e pantomímicas, cuja execução cênica se fixe por escrito ou por qualquer outra forma;
    - composições musicais, tenham ou não letra;
    - obras audiovisuais, sonorizadas ou não, inclusive as cinematográficas;
    - obras fotográficas e as produzidas por qualquer processo análogo ao da fotografia;
    - obras de desenho, pintura, gravura, escultura, litografia e arte cinética;
    - ilustrações, cartas geográficas e outras obras da mesma natureza;
    - projetos, esboços e obras plásticas concernentes à geografia, engenharia, topografia, arquitetura, paisagismo, cenografia e ciência;
    - adaptações, traduções e outras transformações de obras originais, apresentadas como criação intelectual nova;
    - coletâneas ou compilações, antologias, enciclopédias, dicionários, bases de dados e outras obras, que, por sua seleção, organização ou disposição de seu conteúdo, constituam uma criação intelectual.
    Atenção: Não incluir neste campo o valor recebido ou pago ou remetido a título de transferência total dos direitos patrimoniais da obra protegida pelo Direito Autoral.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: VL_EXPL_MARCA
  descricao: |-
    Valor da Exploração Econômica dos Direitos Patrimoniais de Marcas: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos contratos de licenciamento de uso de marca registrada ou de pedidos de registros depositados junto ao Instituto Nacional de Propriedade Industrial (INPI), de que trata a Lei nº 9.279, de 14 de maio de 1996.
    Atenção:
    1) Não incluir neste campo o valor recebido ou pago ou remetido a título de transferência total dos direitos patrimoniais da marca protegida pelo Direito da Propriedade Industrial.
    2) Não informar neste campo o valor recebido ou pago ou remetido correspondente aos contratos de uso de marcas relativos à concessão de franquia. Esse valor deve ser informado no campo “Exploração de Franquias”.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 7
  campo: VL_EXPL_PAT
  descricao: |-
    Valor da Exploração Econômica dos Direitos Patrimoniais de Patentes e de Desenho Industrial: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos contratos de licenciamento de patente ou de desenho industrial concedido ou de pedido de patente depositado junto ao Instituto Nacional de Propriedade Industrial (INPI), de que trata a Lei nº 9.279, de 14 de maio de 1996.
    Atenção:
    1) Não incluir neste campo o valor recebido ou pago ou remetido a título de transferência total dos direitos patrimoniais de patente ou desenho industrial protegidos pelo Direito da Propriedade Industrial.
    2) Não informar neste campo o valor recebido ou pago ou remetido correspondente aos contratos de patentes relativos à concessão de franquia. Esse valor deve ser informado no campo “Exploração de Franquias”.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: VL_EXPL_KNOW
  descricao: |-
    Valor da Exploração de Know-How: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos contratos que disponibilizam conhecimentos, fórmulas e técnicas secretos, não amparados pelo Direito de Propriedade Industrial, destinados à produção ou à comercialização de bens e de serviços.
    Atenção:
    1) Não informar neste campo o valor recebido ou pago ou remetido correspondente aos contratos de know-how relativos à concessão de franquia. Esse valor deve ser informado no campo “Exploração de Franquias”.
    2) Não informar neste campo o valor recebido ou pago ou remetido correspondente aos contratos de assistência técnica, científica, administrativa e assemelhados que impliquem transferência de tecnologia e os referentes a serviços técnicos e de assistência que não impliquem transferência de tecnologia. Informações sobre esses contratos devem ser prestadas no Registro X430 – “Rendimentos Relativos a Serviços, Juros e Dividendos Recebidos do Brasil e do Exterior”.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 9
  campo: VL_EXPL_FRANQ
  descricao: 'Valor da Exploração de Franquias: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes aos contratos de concessão temporária de direitos que envolvam uso de marcas, prestação de serviços de assistência técnica, combinadamente ou não, com qualquer outra modalidade de transferência de tecnologia necessária à consecução do contrato de franquia.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
- numero: 10
  campo: VL_EXPL_INT
  descricao: 'Valor da Exploração dos Direitos Relativos à Propriedade Intelectual Referente a Cultivares: Valor relativo aos royalties recebidos ou pagos ou remetidos referentes à autorização concedida pelo titular da cultivar protegida para sua produção com fins comerciais, seu oferecimento à venda ou a comercialização do material de propagação da cultivar, de acordo com a Lei nº 9.456, de 25 de abril de 1997.'
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: false
regras_validacao_registro_detalhe:
- regra: REGRA_X420_OBRIGATORIO_R
  descricao: Verifica, quando 0020.IND_ROY_REC igual a “S”, se existe X420.TIP_ROY igual a “R”. Se a regra não for cumprida, o sistema gera um erro.
- regra: REGRA_X420_OBRIGATORIO_P
  descricao: Verifica, quando 0020.IND_ROY_PAG igual a “S”, se existe X420.TIP_ROY igual a “P”. Se a regra não for cumprida, o sistema gera um erro.
- regra: REGRA_X420_PREENCHIDO
  descricao: Verifica se, pelo menos, um campo de valor foi informado. Se a regra não for cumprida, o sistema gera um erro.
exemplos_preenchimento:
- linhas_exemplo:
  - '|X420|R|105|50000,00|10000,00|5000,00|6000,00|7000,00|8000,00|9000,00|'
  explicacao:
  - valor: '|X420|'
    descricao: Identificação do tipo do registro.
  - valor: '|R|'
    descricao: Tipo dos royalties (R = Royalties recebidos).
  - valor: '|105|'
    descricao: Código do país (105 = Brasil).
  - valor: '|50000,00|'
    descricao: Valor da Exploração Econômica dos Direitos Patrimoniais do Autor Relativos a Software (R$ 50.000,00).
  - valor: '|10000,00|'
    descricao: Valor da Exploração Econômica dos Direitos Patrimoniais do Autor, Exceto Software (R$ 10.000,00).
  - valor: '|5000,00|'
    descricao: Valor da Exploração Econômica dos Direitos Patrimoniais de Marcas (R$ 5.000,00).
  - valor: '|6000,00|'
    descricao: Valor da Exploração Econômica dos Direitos Patrimoniais de Patentes e de Desenho Industrial (R$ 6.000,00).
  - valor: '|7000,00|'
    descricao: Valor da Exploração de Know-How (R$ 7.000,00).
  - valor: '|8000,00|'
    descricao: Valor da Exploração de Franquias (R$ 8.000,00).
  - valor: '|9000,00|'
    descricao: Valor da Exploração dos Direitos Relativos à Propriedade Intelectual Referente a Cultivares (R$ 9.000,00).
