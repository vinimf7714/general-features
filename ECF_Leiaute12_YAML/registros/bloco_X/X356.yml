descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas para demonstrar a estrutura societária no exterior de controladas, diretas ou indiretas, equiparadas ou coligadas.
  Observação 1: Este demonstrativo é o que se refere o inciso VI do art. 35 da Instrução Normativa RFB no 1.520, de 4 de dezembro de 2014.
  Observação 2: Todos os campos devem ser informados, ainda que o valor a ser informado seja “zero”.
