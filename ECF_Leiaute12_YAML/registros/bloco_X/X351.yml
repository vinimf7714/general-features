regras_validacao_campos:
- numero: null
  campo: RES_NEG_ACUM_REAL
  regras:
  - regra: REGRA_RES_NEG_ACUM_VALOR_1
    descricao: Verifica quando (X351.RES_INV_PER_REAL - X351.RES_ISEN_PETR_PER_REAL) maior que 0 E (X351.RES_NEG_ACUM_REAL maior que (X351.RES_INV_PER_REAL - X351.RES_ISEN_PETR_PER_REAL)).
    tipo: Erro
  - regra: REGRA_RES_NEG_ACUM_VALOR_2
    descricao: Verifica quando X351.RES_NEG_ACUM_REAL é maior que X354.RES_NEG_ANT_REAL.
    tipo: Erro
- numero: null
  campo: RES_POS_TRIB
  regras:
  - regra: REGRA_POS_TRIB_VALOR
    descricao: Verifica, quando (X351.RES_INV_PER - X351.RES_ISEN_PETR_PER) for positivo e maior que X351.RES_NEG_ACUM, se o resultado da subtração de (X351.RES_INV_PER - X351.RES_ISEN_PETR_PER) por X351.RES_NEG_ACUM é igual ao valor informado em X351.RES_POS_TRIB.
    tipo: Aviso
  - regra: REGRA_POS_TRIB_NAO_PREENCHER
    descricao: Verifica, quando (X351.RES_INV_PER - X351.RES_ISEN_PETR_PER) for negativo ou quando (X351.RES_INV_PER - X351.RES_ISEN_PETR_PER) for menor ou igual a X351.RES_NEG_ACUM, se valor informado em X351.RES_POS_TRIB é igual a zero.
    tipo: Aviso
exemplos_preenchimento:
- linhas_exemplo:
  - '|X351|100000,00|250000,00|10000,00|90000,00|235000,00|50000,00|125000,00|20000,00|50000,00|'
  explicacao:
  - valor: '|X351|'
    descricao: Identificação do tipo do registro.
  - valor: '|100000,00|'
    descricao: Resultado do período da própria investida na moeda do país de domicílio (U$ 100.000,00).
  - valor: '|250000,00|'
    descricao: Resultado do período da própria investida em reais (R$ 250.000,00).
  - valor: '|10000,00|'
    descricao: Resultado negativo acumulado de anos anteriores na moeda do país de domicílio (U$ 10.000,00).
  - valor: '|90000,00|'
    descricao: Resultado positivo a tributar na moeda do país de domicílio (U$ 90.000,00 = U$ 100.000,00 – U$ 10.000,00).
  - valor: '|225000,00|'
    descricao: Resultado positivo a tributar em reais (R$ 225.000,00).
  - valor: '|50000,00|'
    descricao: Imposto pago no país de domicílio na moeda do país de domicílio (U$ 50.000,00).
  - valor: '|125000,00|'
    descricao: Imposto pago no país de domicílio na moeda do país de domicílio (R$ 125.000,00).
  - valor: '|20000,00|'
    descricao: Imposto pago no exterior sobre rendimentos recebidos na moeda do país de domicílio (U$ 20.000,00).
  - valor: '|50000,00|'
    descricao: Imposto pago no exterior sobre rendimentos recebidos em reais (R$ 50.000,00).
informacoes_adicionais:
- titulo: I – Regra de Validação de Registro
  conteudo: 'REGRA_X351_PREENCHER: Este registro só ser preenchido/habilitado quando X340.IND_CONTROLE for diferente de “6” (Coligada em Regime de Caixa).'
