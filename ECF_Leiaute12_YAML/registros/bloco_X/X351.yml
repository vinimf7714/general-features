campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (X351).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X351]'
  obrigatorio: true
- numero: 2
  campo: RES_INV_PER
  descricao: Resultado (positivo ou negativo) da Própria Investida em Moeda do País de Domicílio. Devem ser expurgados o valor do resultado positivo ou negativo de eventuais controladas indiretas.
  tipo: NS
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: RES_INV_PER_REAL
  descricao: Resultado (positivo ou negativo) da Própria Investida em Reais. Devem ser expurgados o valor do resultado positivo ou negativo de eventuais controladas indiretas.
  tipo: NS
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: RES_ISEN_PETR_PER
  descricao: 'Resultado da Investida em Operações que Gozem de Isenção Relacionada à Prospecção e Exploração de Petróleo e Gás: Resultado (positivo ou negativo) da própria investida em moeda do país de domicílio apenas em operações decorrentes de afretamento por tempo ou casco nu, arrendamento mercantil operacional, aluguel, empréstimo de bens ou prestação de serviços diretamente relacionados à prospecção e exploração de petróleo e gás, em território brasileiro, que gozem de isenção nos termos do art. 77, §3º, da Lei nº 12.973, de 13 de maio de 2014. Deve ser expurgado o valor do resultado positivo ou negativo de eventuais controladas indiretas.'
  tipo: NS
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: RES_ISEN_PETR_PER_REAL
  descricao: 'Resultado da Investida em Operações que Gozem de Isenção Relacionada à Prospecção e Exploração de Petróleo e Gás em Reais (R$): Resultado (positivo ou negativo) da própria investida em Reais apenas em operações decorrentes de afretamento por tempo ou casco nu, arrendamento mercantil operacional, aluguel, empréstimo de bens ou prestação de serviços diretamente relacionados à prospecção e exploração de petróleo e gás, em território brasileiro, que gozem de isenção nos termos do art. 77, §3º, da Lei nº 12.973, de 13 de maio de 2014. Deve ser expurgado o valor do resultado positivo ou negativo de eventuais controladas indiretas.'
