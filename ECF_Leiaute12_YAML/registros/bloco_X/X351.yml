  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X351
nome: Demonstrativo de Resultados e de Imposto Pago no Exterior
bloco: X
nome_tabela_registros: Demonstrativo de Resultados e de Imposto a Pagar no Exterior
paginas_manual:
- 487
- 490
descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas para demonstrar os resultados e o imposto pago no exterior.
  Observação:
  1) Este demonstrativo é o que se refere os incisos I e V do art. 35 da Instrução Normativa RFB no 1.520, de 4 de dezembro de 2014.
  2) As informações contidas neste registro referem-se à demonstração do resultado da investida no exterior e devem ser informadas pelo valor integral (100%) e não pelo valor correspondente à participação da investidora nos resultados da investida.
  Observação: Todos os campos devem ser informados, ainda que o valor a ser informado seja “zero”.
titulo_leiaute: 'REGISTRO X351: DEMONSTRATIVO DE RESULTADOS E DE IMPOSTO PAGO NO EXTERIOR'
regras_validacao_registro:
- REGRA_X351_PREENCHER
nivel_hierarquico: 3
ocorrencia: 0:1
