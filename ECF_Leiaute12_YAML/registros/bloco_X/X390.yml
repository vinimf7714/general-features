_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X390
nome: Origem e Aplicação de Recursos – Imunes e Isentas
bloco: X
nome_tabela_registros: Origem e Aplicação de Recursos - Imunes ou Isentas
paginas_manual:
- 516
- 517
descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas imunes ou isentas do imposto de renda. Neste registro, a pessoa jurídica discrimina a origem (receitas e demais entradas) e a aplicação (despesas e demais saídas) dos recursos auferidos e despendidos durante o ano-calendário.
  Discriminar os valores, em Reais, conforme melhor se enquadrarem entre os títulos apresentados, utilizando as linhas X390/7 (Outros Recursos) e X390/15 (Outras Despesas) somente em caso de impossibilidade de melhor classificação.
  Os empréstimos tomados devem ser incluídos na linha X390/7 (Outros recursos).
  As amortizações e o pagamento de juros devem ser informados na linha X390/15 (Outras Despesas).
titulo_leiaute: 'REGISTRO X390: ORIGENS E APLICAÇÕES DE RECURSOS – IMUNES E ISENTAS'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: CODIGO
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: 'Se 0010.FORMA_TRIB = “8” ou “9” '
  ocorrencia: '[0;N]'
hierarquia:
