campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (X410)
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X410]'
  obrigatorio: true
- numero: 2
  campo: PAIS
  descricao: |-
    País: País em que disponibiliza homepage ou mantém servidor à sua disposição.
    Código do país, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: N
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: IND_HOME_DISP
  descricao: |-
    Indicador de Homepage Disponível:
    S – Sim
    N – Não
    A pessoa jurídica deverá marcar “Sim” ou “Não”, para cada país selecionado, onde tenha o domínio de sua homepage registrado, caso disponibilize, ou não, efetivamente sua homepage. A disponibilização efetiva da homepage se dá por meio do conhecer ao público de seu conteúdo.
    Atenção: Deve assinalar “Não” neste campo, a pessoa jurídica que tenha efetuado somente o registro de sua homepage num determinado país e não tenha construído ou disponibilizado efetivamente essa homepage para o público.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S; N]'
  obrigatorio: true
- numero: 4
  campo: IND_SERV_DISP
  descricao: |-
    Indicador de Disponibilidade de Servidor:
    S – Sim
    N – Não
    A pessoa jurídica que, por meio de sua homepage, aceite pedidos de compra, receba pagamentos, preste serviços ou efetue a entrega de bens digitais por meio de download deve selecionar “Sim” neste campo, para cada país selecionado, para informar o país onde mantém os servidores que estão à sua disposição. Para que um servidor seja considerado à sua disposição basta que ele seja o meio pelo qual a pessoa jurídica atue no comércio eletrônico. Esses servidores podem pertencer à pessoa jurídica, como podem ser alugados, arrendados ou cedidos a título gratuito ou oneroso.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S, N]'
  obrigatorio: true
exemplos_preenchimento:
- linhas_exemplo:
  - '|X410|105|S|N|'
  explicacao:
  - valor: '|X410|'
    descricao: Identificação do tipo do registro.
  - valor: '|105|'
    descricao: Código do país (105 = “Brasil”).
  - valor: '|S|'
    descricao: Homepage disponível (S = Sim).
  - valor: '|N|'
    descricao: Servidor não disponível (N = Não).
informacoes_adicionais:
- titulo: I – Regras de Validação de Registro
  conteudo: 'REGRA_HOMEPAGE_SERVIDOR: Verfica se, para cada X410.PAIS, X410.IND_HOME_DISP igual a “S” e X410.IND_SERV_DISP igual a “N” ou X410.IND_HOME_DISP igual a “N” e X410.IND_SERV_DISP igual a “S”. Caso a regra não seja cumprida, o sistema gera um erro.'
