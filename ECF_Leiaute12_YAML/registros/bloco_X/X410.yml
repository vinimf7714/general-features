  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X410
nome: Comércio Eletrônico – Informação de Homepage/Servidor
bloco: X
nome_tabela_registros: Comércio Eletrônico – Informação de Homepage/Servidor
paginas_manual:
- 521
- 522
descricao: |-
  Este registro será habilitado somente para as pessoas jurídicas que efetuaram durante o ano-calendário, por meio da Internet, vendas de bens tangíveis (corpóreos), de bens intangíveis (incorpóreos) ou prestado serviços para pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior (0020.IND_E-COM_TI = "S").
  Deverão, também, preencher este registro as pessoas jurídicas que possuam servidor à sua disposição (próprio, alugado, arrendado ou cedido a título oneroso ou gratuito), a partir do qual realize transações de comércio eletrônico.
  Não deve preencher este registro a pessoa jurídica que tenha homepage utilizada apenas como meio de publicidade ou de divulgação institucional da empresa e de sua marca; assim, não deve preencher este registro a pessoa jurídica que não forneça, por meio desta homepage, endereço eletrônico ou um “Fale Conosco”.
titulo_leiaute: 'REGISTRO X410: COMÉRCIO ELETRÔNICO – INFORMAÇÃO DE HOMEPAGE/SERVIDOR'
regras_validacao_registro:
- REGRA_HOMEPAGE_SERVIDOR
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: PAIS
tabela_registros:
  nivel: 2
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0020. IND_E-COM_TI="S"
  ocorrencia: '[0;N]'
