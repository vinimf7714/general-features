  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X500
nome: Zonas de Processamento de Exportação (ZPE)
bloco: X
nome_tabela_registros: Zonas de Processamento de Exportação (ZPE)
paginas_manual:
- 556
- 557
descricao: |-
  Este registro deverá ser preenchido pela pessoa jurídica autorizada a operar em Zonas de Processamento de Exportação, voltadas para a produção de bens a serem comercializados no exterior, de acordo com o estabelecido pela Lei no 11.508, de 20 de julho de 2007, com alterações introduzidas pela Lei no 11.732, de 30 de junho de 2008, pela Lei no 12.507, de 11 de outubro de 2011, e pela Lei no 12.546, de 14 de dezembro de 2012.
  Atenção:
  1) É vedada a instalação em ZPE de empresas cujos projetos evidenciem a simples transferência de plantas industriais já instaladas no País (Lei no 11.508, de 20 de julho de 2007, art. 5o).
  2) Não serão autorizadas, em ZPE, a produção, a importação ou exportação de (Lei no 11.508, de 20 de julho de 2007, art. 5o, parágrafo único):
  a) armas ou explosivos de qualquer natureza, salvo com prévia autorização do Comando do Exército;
  b) material radioativo, salvo com prévia autorização da Comissão Nacional de Energia Nuclear - CNEN; e
  c) outros indicados em regulamento.
