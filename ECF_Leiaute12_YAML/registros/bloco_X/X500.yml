  - valor: '|13|'
    descricao: Código da linha.
  - valor: '|Suspensão do IPI sobre Aquisições de Mercadorias entre Empresas Autorizadas a Operar em ZPE (art. 18, § 5º)|'
    descricao: Descrição da linha.
  - valor: '|100000,00|'
    descricao: Valor da linha (R$ 100.000,00).
