regras_validacao_campos_observacoes: OBS. Na condição de erro, os campos que não devem ser preenchidos são desabilitados.
exemplos_preenchimento:
- linhas_exemplo:
  - '|X350|1000000,00|600000,00|400000,00|100000,00|0,00|40000,00|10000,00|450000,00|50000,00|0,00|0,00|500000,00|100000,00|400000,00|'
  explicacao:
  - valor: '|X350|'
    descricao: Identificação do tipo do registro.
  - valor: '|1000000,00|'
    descricao: Receita líquida de todas as atividades exploradas pela filial, sucursal, controlada ou coligada residente ou domiciliada no exterior (R$ 1.000.000,00).
  - valor: '|600000,00|'
    descricao: Total dos custos das atividades exploradas pela filial, sucursal, controlada ou coligada domiciliada no exterior (R$ 600.000,00).
  - valor: '|400000,00|'
    descricao: Lucro bruto (R$ 400.000,00 = R$ 1.000.000,00 – R$ 600.000,00).
  - valor: '|100000,00|'
    descricao: Receitas financeiras auferidas pela filial, sucursal, controlada ou coligada residente ou domiciliada no exterior (R$ 100.000,00).
  - valor: '|0,00|'
    descricao: Não há outras receitas operacionais.
  - valor: '|40000,00|'
    descricao: Despesas financeiras pagas ou creditadas pela filial, sucursal, controlada ou coligada residente ou domiciliada no exterior (R$ 40.000,00).
  - valor: '|10000,00|'
    descricao: Despesas operacionais da filial, sucursal, controlada ou coligada residente ou domiciliada no exterior (R$ 10.000,00).
  - valor: '|450000,00|'
    descricao: Lucro Operacional (R$ 450.000,00 = R$ 400.000,00 + R$ 100.000,00 + R$ 0,00 – R$ 40.000,00 – R$ 10.000,00).
  - valor: '|50000,00|'
    descricao: Receita de participação em controladas, coligadas, filiais ou sucursais residentes ou domiciliadas no exterior (R$ 50.000,00).
  - valor: '|0,00|'
    descricao: Não há outras receitas.
  - valor: '|0,00|'
    descricao: Não há outras despesas.
  - valor: '|500000,00|'
    descricao: Lucro líquido antes do imposto de renda (R$ 500.000,00).
  - valor: '|100000,00|'
    descricao: Imposto devido em reais (R$ 100.000,00).
  - valor: '|400000,00|'
    descricao: Lucro líquido do período de apuração (R$ 400.000,00 = R$ 500.000,00 – R$ 100.000,00).
