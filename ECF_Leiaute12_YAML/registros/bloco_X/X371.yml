_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X371
nome: Informações Sobre Ajustes Compensatórios
bloco: X
nome_tabela_registros: Informações Sobre Ajustes Compensatórios
paginas_manual:
- 512
- 512
descricao: Este registro deve ser preenchido quando X370.VL_COMPENSATORIO for maior que zero. Serão informadas as contas contábeis/centros de custos relacionados ao valor do ajuste compensatório, bem como os saldos utilizados.
titulo_leiaute: 'REGISTRO X371: INFORMAÇÕES SOBRE AJUSTES COMPENSATÓRIOS'
regras_validacao_registro: []
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: COD_CTA + COD_CCUS
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se X370.VL_COMPENSATORIO maior que zero
  ocorrencia: '[0;N]'
hierarquia:
  pai: X370
  filhos: []
  irmaos:
  - X375
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (X371).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X371]'
  obrigatorio: true
- numero: 2
  campo: COD_CTA
  descricao: Código da conta contábil.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: Códigos existentes no registro J050
  obrigatorio: true
- numero: 3
  campo: COD_CCUS
  descricao: Código do centro de custos
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: Códigos existentes no registro J100
  obrigatorio: false
- numero: 4
  campo: VALOR
  descricao: Saldo utilizado
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: IND_VALOR
  descricao: |-
    Indicador de saldo utilizado:
    D – Devedor
    C – Credor
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[D;C]'
  obrigatorio: true
exemplos_preenchimento:
- linhas_exemplo:
  - '|X371|2328.2.0001||25000,00|D|'
  explicacao:
  - valor: '|X371|'
    descricao: Identificação do tipo do registro.
  - valor: '|2328.2.0001|'
    descricao: Código da conta contábil.
  - valor: '||'
    descricao: Código do centro de custos (Não há).
  - valor: '|25000,00|'
    descricao: Saldo utilizado (R$ 25.000,00).
  - valor: '|D|'
    descricao: Indicador do saldo utilizado (D = Devedor).
