- numero: 1
  campo: REG
  descricao: Texto fixo contendo a identificação do registro (X280).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X280]'
  obrigatorio: true
- numero: 2
  campo: IND_ATIV
  descricao: |-
    Benefício fiscal:
    00 – Não preenchido
    01 – Isenção
    02 – Redução de 100%
    03 – Redução de 75%
    04 – Redução de 70%
    05 – Redução de 50%
    06 – Redução de 33,33%
    07 – Redução de 25%
    08 – Redução de 12,5%
    09 – Redução por Reinvestimento
    10 – PERSE (Lei nº 14.148/21 e Instrução Normativa RFB nº 2.114/22)
    99 – Subvenção para Investimento
    Selecionar no campo Benefício Fiscal o tipo de benefício (isenção ou redução do IRPJ) em relação a cada projeto aprovado no órgão competente, conforme lista disponível na Caixa de Combinação. E, para cada projeto aprovado selecionar no campo Projeto se o mesmo corresponde a "Novo Empreendimento", "Modernização", "Ampliação", "Diversificação", "Manutenção de Empreendimento", "Prouni", “Padis” ou “Outros”.
    I) Isenção: Este tipo de benefício deve ser selecionado pela pessoa jurídica: a) que tenha instalado, ampliado, modernizado ou diversificado empreendimento industrial ou agrícola, nas áreas de atuação da Sudam e da Sudene, até 31 de dezembro de 1997, nos termos da MP nº 1.740-32, de 1999, convalidada pela Lei nº 9.808, de 1999, art. 13; b) que tenham empreendimento industrial ou agrícola decorrente de projeto aprovado ou protocolizado até 14 de novembro de 1997 nas áreas de atuação da Sudam e da Sudene.
    c) instituição privada de ensino superior, com fins lucrativos ou sem fins lucrativos não beneficente, que aderir ao Programa Universidade para Todos (Prouni) nos termos do art. 5º da Lei nº 11.096, de 13 de janeiro de 2005, no período de vigência do termo de adesão. d) que tenha instalado, ampliado, modernizado ou diversificado empreendimento industrial ou agrícola, nas áreas de atuação da Sudam e da Sudene empreendimento fabricante de máquinas, equipamentos, instrumentos e dispositivos, baseados em tecnologia digital, voltados para o programa de inclusão digital, cujos projetos tenham sido aprovados nos termos do caput do art. 1º da MP nº 2.199-14, de 24 de agosto de 2001.
    Atenção: No caso de projeto que já esteja sendo utilizado o benefício fiscal nos termos do caput do art. 1º da MP nº 2.199-14, de 24 de agosto de 2001, o prazo de fruição passa a ser de dez anos contado a partir da data de publicação da Medida Provisória no 540, de 2 de agosto de 2011. e) que explora atividade transporte internacional aéreo, marítimo e terrestre, quando as companhias brasileiras de igual objetivo gozarem da mesma prerrogativa no país de nacionalidade da empresa estrangeira; f) subsidiária da Fifa no Brasil (ou a Emissora Fonte da Fifa, na hipótese de ser pessoa jurídica domiciliada no Brasil) que exploram atividades próprias e diretamente vinculadas à organização ou realização no Brasil dos Eventos (inciso VI do art. 2º da Lei nº 12.350, de 2010) relativos às Competições e às seguintes atividades relacionadas às Competições, oficialmente organizadas, chanceladas, patrocinadas ou apoiadas pela Subsidiária Fifa no Brasil: f.1) os congressos da Fifa, banquetes, cerimônias de abertura, encerramento, premiação e outras cerimônias, sorteio preliminar, final e quaisquer outros sorteios, lançamentos de mascote e outras atividades de lançamento; f.2) seminários, reuniões, conferências, workshops e coletivas de imprensa; f.3) atividades culturais: concertos, exibições, apresentações, espetáculos ou outras expressões culturais, bem como os projetos Futebol pela Esperança (Football for Hope) ou projetos beneficentes similares;
    f.4) partidas de futebol e sessões de treino; e f.5) outras atividades consideradas relevantes para a realização, organização, preparação, marketing, divulgação, promoção ou encerramento das Competições. g) Jogos Olímpicos Rio 2016: g.1) empresas vinculadas ao Comité International Olympique - CIO, e domiciliadas no Brasil, em relação aos fatos geradores decorrentes das atividades próprias e diretamente vinculadas à organização ou realização dos Eventos (Jogos e as atividades a eles relacionadas, oficialmente organizadas, chanceladas, patrocinadas, ou apoiadas pelo CIO, APO ou RIO 2016) de que trata o art. 9º da Lei nº 12.780, de 2013. g.2) Comitê Organizador dos Jogos Olímpicos Rio 2016 - RIO 2016, em relação aos fatos geradores decorrentes das atividades próprias e diretamente vinculadas à organização ou realização dos Eventos (Jogos e as atividades a eles relacionadas, oficialmente organizadas, chanceladas, patrocinadas, ou apoiadas pelo CIO, APO ou RIO 2016, de que trata o art. 10 da Lei nº 12.780, de 2013.
    Atenção: A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Novo Empreendimento", "Modernização", "Ampliação", "Diversificação", "Prouni", “Evento Fifa”, “Serviço da Fifa (SPE)”, “Eventos CIO”, “Serviços do CIO (SPE)” ou "Outros".
    II - Redução a) Redução de 100% (cem por cento) de alíquotas (Padis): Este tipo de benefício deve ser selecionado pela pessoa jurídica que tenha projeto aprovado em Portaria Conjunta do Ministério da Fazenda, do Ministério da Ciência e Tecnologia e do Ministério do Desenvolvimento, Indústria e Comércio Exterior, no âmbito do Programa de Apoio ao Desenvolvimento Tecnológico da Indústria de Semicondutores (Padis) (Lei nº 11.484, de 2007, arts. 1º a 11).
    Atenção:
    1) Apenas a pessoa jurídica previamente habilitada pela Secretaria da Receita Federal do Brasil - RFB é beneficiária do PADIS.
    2) A pessoa jurídica que utilizar indevidamente do benefício sujeitará ao pagamento do imposto em relação a cada período de apuração acrescido de juros e multa, sem prejuízo das sanções penais cabíveis.
    A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal “Padis". b) Redução de 75%: Este tipo deve ser selecionado pela pessoa jurídica que seja titular de projeto protocolizado e aprovado após 23 de agosto de 2000, enquadrado em setores da economia considerados, em ato do Poder Executivo, prioritários para o desenvolvimento regional, que tenha sido instalado, ampliado, modernizado ou diversificado, nas áreas de atuação da Sudene e da Sudam (MP nº 2.058, de 2000, art.
    1º e reedições, alterado pela Lei nº 11.196, de 2005, art. 32).
    Atenção:
    1) A pessoa jurídica que utilizar indevidamente do benefício sujeitará ao pagamento do imposto em relação a cada período de apuração acrescido de juros e multa, sem prejuízo das sanções penais cabíveis.
    2) As pessoas jurídicas devem pleitear reconhecimento do direito à redução à Secretaria da Receita Federal do Brasil (Decretos nº 4.212 e 4.213, de 2002, art. 3º).
    A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Novo Empreendimento", "Modernização", "Ampliação", Diversificação" ou "Outros". c) Redução de 70%: Este tipo benefício deve ser selecionado pela pessoa jurídica que tenha exploração de atividade hoteleira e outros meios de hospedagem, conforme projetos aprovados pelo Conselho Nacional de Turismo até 31/12/1985.
    Atenção: A pessoa jurídica deverá selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Novo Empreendimento" ou "Outros". d) Redução de 50%: Este tipo de benefício deve ser selecionado pela pessoa jurídica: d.1) que mantenha exploração de restaurante de turismo e de empreendimentos de apoio à atividade turística, conforme projetos aprovados pelo Conselho Nacional de Turismo até 31/12/1985; d.2) que mantenha exploração de atividade hoteleira e outros meios de hospedagem, de projeto de ampliação do empreendimento;
    Atenção: A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Manutenção de Empreendimento", "Ampliação" ou "Outros". e) Redução de 33,33%: Este tipo de benefício deve ser selecionado pela pessoa jurídica que mantiver empreendimento de exploração de atividade hoteleira e outros meios de hospedagem, conforme projeto de ampliação aprovado pelo Conselho Nacional de Turismo até 31/12/1995.
    Atenção: A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Ampliação" ou "Outros". f) Redução de 25%: Este tipo benefício deve ser selecionado pelas pessoas jurídicas: f.1) que seja titular de empreendimento industrial ou agrícola que tenha sido instalado, ampliado, modernizado ou diversificado, a partir de 1º de janeiro de 1998, nas áreas de atuação da Sudam e da Sudene, cujo projeto tenha sido protocolizado no período de 15 de novembro de 1997 a 23 de agosto de 2000 (MP nº 2.058, de 2000, art. 1º e reedições, e MP nº 1.740-32, de 1999, convalidada pela Lei nº 9.808, de 1999, art. 13);
    f.2) que tenha empreendimento industrial ou agrícola, nas áreas de atuação da Sudam e da Sudene, cujo projeto tenha sido aprovado ou protocolizado após 14 de novembro de 1997 e até 23 de agosto de 2000 (Lei nº 9.532, de 1997, art. 3º, inciso III; MP nº 2.058, de 2000, art. 1º e reedições, alterado pela Lei nº 11.196, de 2005, art. 32);
    Atenção: A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Novo Empreendimento", “Modernização”, “Ampliação”, “Diversificação” ou “Outros". g) Redução de 12,5%: Este tipo benefício deve ser selecionado pelas pessoas jurídicas detentoras de empreendimentos , nas áreas de atuação da Sudam e da Sudene, dos setores da economia considerados, pelo Poder Executivo, prioritários para o desenvolvimento regional e para os que têm sede na área de jurisdição da Zona Franca de Manaus, reconhecidos como de interesse para o desenvolvimento da região (MP nº 2.058, de 2000, art. 2º e reedições).
    Atenção:
    1) a pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Manutenção de Empreendimento".
    2) As pessoas jurídicas devem pleitear reconhecimento do direito à redução à Receita Federal, cujo pedido é instruído com a declaração de que trata o item 3 deste Atenção (Decretos nº 4.212 e 4.213, de 2002, art. 3º).
    3) A fruição do benefício fiscal tem efeito a partir da data em que a pessoa jurídica apresentar ao órgão competente do Ministério da Integração requerimento solicitando a declaração de que satisfaz as condições estabelecidas para gozo do favor fiscal. h) Redução por Reinvestimento: Este tipo de benefício deve ser selecionado pelas pessoas jurídicas que pleiteiam a redução de até 30% do valor do imposto de renda. A partir de 1º de janeiro de 2001 somente gozam desse benefício as pessoas jurídicas que detenham empreendimentos dos setores da economia que venham a ser considerados, em ato do Poder Executivo, prioritários para o desenvolvimento regional.
    Atenção: A pessoa jurídica deve selecionar no campo "Projeto", o benefício fiscal a que tem direito: "Outros".
    III) Subvenção para investimento: concessão de crédito fiscal de subvenção para investimento, nos termos da Lei nº 14.789, de 2023.
