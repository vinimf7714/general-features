regras_validacao_registro_detalhe:
- regra: REGRA_ISENCAO_AM_NE_REAL
  descricao: Verifica, quando 0010.FORMA_TRIB é igual “1” (Lucro Real) ou “2” (Lucro Real/Arbitrado), se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “01” (Isenção) e X280.IND_CONCEDENTE é igual a “AM” (Sudam) ou “NE” (Sudene), é igual ao somatório de N610(10) com N610(15), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_ISENCAO_OU_REAL
  descricao: Verifica, quando 0010.FORMA_TRIB é igual “1” (Lucro Real) ou “2” (Lucro Real/Arbitrado), se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “01” (Isenção) e X280.IND_CONCEDENTE é igual a “OU” (Outros), é igual ao somatório de N610(5), N610(20), N610(25), N610(30), N610(35) e N610(40), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_ISENCAO_PRESUMIDO
  descricao: Verifica, quando 0010.FORMA_TRIB é igual “5” (Lucro Presumido) ou “7” (Lucro Presumido/Arbitrado), se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “01” (Isenção), é igual ao somatório de P230(6), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_ISENCAO_MISTA
  descricao: Verifica, quando 0010.FORMA_TRIB é igual “3” (Lucro Presumido/Real) ou “4” (Lucro Presumido/Real/Arbitrado), se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “01” (Isenção), é igual ao somatório de N610(5), N610(20), N610(25), N610(30), N610(35) e N610(40), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(6), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_RECEITA_ISENCAO
  descricao: Verifica se o somatório de X280.REC_LIQ_INCENTIVO, quando X280.IND_ATIV é igual “01” (Isenção), é igual ao somatório de N600(2), N600(3), N600(4), N600(5), N600(6), N600(7), N600(8) e N600(9), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P130(2), P130(3), P130(4) e P130(5), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_RECEITA_REDUCOES
  descricao: Verifica se o somatório de X280.REC_LIQ_INCENTIVO, quando X280.IND_ATIV é diferente “01” (Isenção), é igual ao somatório de N600(10), N600(11), N600(12), N600(13), N600(14), N600(15), N600(16) e N600(17)., considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P130(11), P130(12), P130(13), P130(14), P130(20), P130(21), P130(22), P130(23), P130(29), P130(30), P130(31), P130(32), P130(38), P130(39), P130(40), P130(41), P130(47), P130(48), P130(49), P130(50), P130(56), P130(57), P130(58), P130(59), P130(65), P130(66), P130(67), P130(68), P130(74), P130(75), P130(76), P130(77), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_REDUCAO_100
  descricao: Verifica se o somatório de X280. VL_INCENTIVO, quando X280.IND_ATIV é igual “02” (Redução de 100%), é igual ao somatório de N610(45), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_75
  descricao: Verifica se o somatório de X280. VL_INCENTIVO, quando X280.IND_ATIV é igual “03” (Redução de 75%), é igual ao somatório de N610(50), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(11), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_70
  descricao: Verifica se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “04” (Redução de 70%), é igual ao somatório de N610(55), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(16), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_50
  descricao: Verifica se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “05” (Redução de 50%), é igual ao somatório de N610(60), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(21), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_33
  descricao: Verifica se o somatório de X280. VL_INCENTIVO, quando X280.IND_ATIV é igual “06” (Redução de 33,33%), é igual ao somatório de N610(65), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(26), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_25
  descricao: Verifica se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “07” (Redução de 25%), é igual ao somatório de N610(70), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(31), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_12
  descricao: Verifica se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “08” (Redução de 12,5%), é igual ao somatório de N610(75), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(36), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_REDUCAO_REINVESTIMENTO
  descricao: Verifica se o somatório de X280.VL_INCENTIVO, quando X280.IND_ATIV é igual “09” (Redução por Reinvestimento), é igual ao somatório de N610(77), considerando os períodos “A00”, “T01”, “T02”, “T03” e “T04” (N030.PER_APUR), com o somatório de P230(38), considerando os períodos “T01”, “T02”, “T03” e “T04” (P030.PER_APUR). Se a regra não for cumprida, a ECF gera um erro.
- regra: REGRA_ISENCAO_REDUCAO
  descricao: Verifica, quando 0020.IND_LUC_EXP é igual a “S” (Sim) ou 0020.IND_RED_ISEN é igual a “S” (Sim), se existe X280.IND_ATIV igual a “01”, “02”, “03”, “04”, “05”, “06”, “07” ou “08” e o somatório de N630(17) com P300(8) é maior que zero. Se a regra não for cumprida, a ECF gera um erro.
regras_validacao_campos:
- numero: 3
  campo: IND_CONCEDENTE
  regras:
  - regra: REGRA_IND_CONCEDENTE
    descricao: Verifica, quando X280.IND_CONCEDENTE é igual a “OU” (Outros), se X280.IND_ATIV é igual a “01” (Isenção) ou “02” (Redução de 100%) ou “04” (Redução de 70%) ou “05” (Redução de 50%) ou “06” (Redução de 33,33%) ou “08” (Redução de 12,5%) ; ou quando X280.IND_CONCEDENTE é igual a “AM” (Sudam) ou “NE” (Sudene), se X280.IND_ATIV é igual a “01” (Isenção) ou “03” (Redução de 75%) ou “07” (Redução de 25%) ou “08” (Redução de 12,5%) ou “09” (Redução por Reinvestimento).
    tipo: Erro
- numero: 4
  campo: IND_PROJ
  regras:
  - regra: REGRA_IND_PROJ_ACEITO
    descricao: |-
      Verifica se IND_PROJ é compatível com a atividade.
      O erro ocorre:
      1) Se X280.IND_ATIV = “1” e X280.IND_PROJ é diferente de “1” ou “2” ou “3” ou “4” ou “6” ou “8” ou “9” ou “10” ou “11” ou “99”
      2) Se X280.IND_ATIV = “2” e X280.IND_PROJ é diferente de “7” ou “99”
      3) Se X280.IND_ATIV = “3” e X280.IND_PROJ é diferente de “1” ou “2” ou “3” ou “4” ou “99”
      4) Se X280.IND_ATIV = “4” e X280.IND_PROJ é diferente de “1” ou “99”
      5) Se X280.IND_ATIV = “5” e X280.IND_PROJ é diferente de “3” ou “5” ou “99”
      6) Se X280.IND_ATIV = “6” e X280.IND_PROJ é diferente de “3” ou “99”
      7) Se X280.IND_ATIV = “7” e X280.IND_PROJ é diferente de “1” ou “2” ou “3” ou “4” ou “99” 8) Se X280.IND_ATIV = “8” e X280.IND_PROJ é diferente de “5” ou “99” 9) Se X280.IND_ATIV = “9” e X280.IND_PROJ é diferente de “99”
    tipo: Erro
- numero: 6
  campo: VIG_INI
  regras:
  - regra: REGRA_MENOR_IGUAL_DT_FIN
    descricao: Verifica se X280.VIG_INI é menor ou igual a 0000.DT_FIN.
    tipo: Erro
- numero: 7
  campo: VIG_FIM
  regras:
  - regra: REGRA_MAIOR_IGUAL_DT_INI
    descricao: Verifica se X280.VIG_FIM é maior ou igual a 0000.DT_INI.
    tipo: Erro
  - regra: REGRA_MAIOR_IGUAL_VIG_INI
    descricao: Verifica se X280.VIG_FIM é maior ou igual a X280.VIG_INI.
    tipo: Erro
- numero: 8
  campo: CNPJ_INCENTIVO
  regras:
  - regra: REGRA_VALIDA_CNPJ
    descricao: Verifica se o CNPJ informado em X280.CNPJ_INCENTIVO é válido.
    tipo: Erro
  - regra: REGRA_VALIDA_CNPJ_MATRIZ
    descricao: Verifica se os 8 (oito) primeiros dígitos do campo X280.CNPJ_INCENTIVO são iguais aos 8 primeiros dígitos do campo 0000.CNPJ.
    tipo: Erro
