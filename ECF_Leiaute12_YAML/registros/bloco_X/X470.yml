_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X470
nome: Capacitação de Informática e Inclusão Digital
bloco: X
nome_tabela_registros: Capacitação de Informática e Inclusão Digital
paginas_manual:
- 543
- 544
descricao: Este registro deverá ser preenchido pela pessoa jurídica que tiver investido em atividades de pesquisa e desenvolvimento em tecnologias da informação no âmbito dos programas de capacitação e competitividade dos setores de informática e automação e tecnologias da informação de que tratam a Lei nº 8.248, de 23 de outubro de 1991, a Lei nº 10.176, de 11 de janeiro de 2001, a Lei nº 11.077, de 30 de dezembro de 2004, a Lei nº 12.249, de 11 de junho de 2010, e a Lei nº 12.431, de 24 de junho de 2011, regulamentadas pelo Decreto nº 5.906, de 26 de setembro de 2006, ou ter efetuado venda a varejo nos termos dos arts. 28 a 30 da Lei nº 11.196, de 2005, com redação dada pelo art. 17 da Lei nº 12.249, de 2010, que dispõem sobre o programa de inclusão digital.
titulo_leiaute: 'REGISTRO X470: CAPACITAÇÃO DE INFORMÁTICA E INCLUSÃO DIGITAL'
