  - valor: '|Receita Auferida na Venda Efetuada às Sociedades de Arrendamento Mercantil e Leasing (art. 28, § 3º)|'
    descricao: Descrição da linha.
  - valor: '|100000,00|'
    descricao: Valor da linha (R$ 100.000,00).
