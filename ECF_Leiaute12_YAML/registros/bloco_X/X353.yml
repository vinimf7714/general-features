  - '|X353|100000,00|250000,00|50000,00|125000,00|10000,00|50000,00|'
  explicacao:
  - valor: '|X353|'
    descricao: Identificação do tipo do registro.
  - valor: '|100000,00|'
    descricao: Resultado negativo utilizado na consolidação na moeda do país de domicílio (U$ 100.000,00).
  - valor: '|250000,00|'
    descricao: Resultado negativo utilizado na consolidação em reais (R$ 250.000,00).
  - valor: '|50000,00|'
    descricao: Resultado negativo não utilizado na moeda do país de domicílio (U$ 50.000,00).
  - valor: '|125000,00|'
    descricao: Resultado negativo não utilizado em reais (R$ 125.000,00).
  - valor: '|10000,00|'
    descricao: Resultado positivo próprio da controlada no período na moeda do país de domicílio. (R$ 10.000,00).
  - valor: '|50000,00|'
    descricao: Resultado positivo próprio da controlada no período na moeda do país de domicílio. (R$ 50.000,00).
informacoes_adicionais:
- titulo: I – Regra de Validação de Registro
  conteudo: 'REGRA_X353_PREENCHER: Este registro só ser preenchido/habilitado quando X340.IND_CONTROLE for igual a 1” (Controlada Direta), “2” (Controlada Indireta), “3” (Equiparada a Controlada e quando X340.IND_CONSOL igual a “S” (Sim).'
