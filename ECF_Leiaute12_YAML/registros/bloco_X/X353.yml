descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas para demonstrar os resultados consolidados no exterior de controladas, diretas ou indiretas, equiparadas.
  Observação 1: Este demonstrativo é o que se refere o inciso II do art. 35 da Instrução Normativa RFB no 1.520, de 4 de dezembro de 2014.
  Observação 2: Todos os campos devem ser informados, ainda que o valor a ser informado seja “zero”.
