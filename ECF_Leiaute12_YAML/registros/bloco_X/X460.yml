_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X460
nome: Inovação Tecnológica e Desenvolvimento Tecnológico
bloco: X
nome_tabela_registros: Inovação Tecnológica e Desenvolvimento Tecnológico
paginas_manual:
- 541
- 542
descricao: |-
  Este registro deverá ser preenchido pela pessoa jurídica que realizou, durante o ano-calendário, atividades de pesquisa tecnológica e desenvolvimento de inovação tecnológica para os fins de que trata o Decreto no 5.798, de 7 de junho de 2006, com redação dada pelo art. 1o do Decreto no 6.909, de 22 de julho de 2009, ou o Decreto no 6.260, de 20 de novembro de 2007, com redação dada pelo art.
  2º do Decreto no 6.909, de 2009, ou, ainda, pela pessoa jurídica que tenha executado, direta ou indiretamente, programas de desenvolvimento tecnológico industrial ou agropecuário (PDTI/PDTA) de que trata o Decreto no 949, de 5 de outubro de 1993.
titulo_leiaute: 'REGISTRO X460: INOVAÇÃO TECNOLÓGICA E DESENVOLVIMENTO TECNOLÓGICO'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: CODIGO
