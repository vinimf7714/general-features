  - valor: '|2|'
    descricao: Código da linha.
  - valor: '|Entrada de Mercadorias Estrangeiras Sujeitas à Isenção do II e do IPI|'
    descricao: Descrição da linha.
  - valor: '|100000,00|'
    descricao: Valor da linha (R$ 100.000,00).
  - valor: '|X510|'
