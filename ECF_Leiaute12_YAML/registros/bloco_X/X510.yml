_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X510
nome: Áreas de Livre Comércio (ALC)
bloco: X
nome_tabela_registros: Áreas de Livre Comércio (ALC)
paginas_manual:
- 558
- 559
descricao: Este registro deverá ser preenchido pelas pessoas jurídicas autorizadas a operar nas Áreas de Livre Comércio (ALC) de Boa Vista, Bonfim, Tabatinga, Macapá e Santana, Brasiléia, Cruzeiro do Sul ou Guajará-Mirim, beneficiárias dos incentivos de que tratam a Lei no 8.256, de 25 de novembro de 1991, a Lei no 11.732, de 30 de junho de 2008, a Lei no 7.965, de 22 de dezembro de 1989, a Lei no 8.387, de 30 de dezembro de 1991, o Decreto no 517, de 8 de maio de 1992, a Lei no 8.857, de 8 de março de 1994, e a Lei no 8.210, de 19 de julho de 1991, e alterações posteriores.
titulo_leiaute: 'REGISTRO X510: ÁREAS DE LIVRE COMÉRCIO (ALC)'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 2
ocorrencia: 0:N
campos_chave: CODIGO
