  - valor: '|3|'
    descricao: Código da linha.
  - valor: '|Receita de Vendas de Produtos Industrializados na Área de Atuação para a Amazônia Ocidental|'
    descricao: Descrição da linha.
  - valor: '|100000,00|'
    descricao: Valor da linha (R$ 100.000,00).
