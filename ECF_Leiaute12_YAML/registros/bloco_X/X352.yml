_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: X352
nome: Demonstrativo de Resultados no Exterior Auferidos por Intermédio de Coligadas
bloco: X
nome_tabela_registros: Demonstrativo de Resultados no Exterior Auferidos por Intermédio de Coligada
paginas_manual:
- 491
- 491
descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas para demonstrar os resultados no exterior de coligadas.
  Observação: Em X352.RES_PER, X352.RES_PER_REAL, X352.LUC_DISP e X352.LUC_DIPS_REAL deverá ser o valor total do resultado (positivo ou negativo) e do lucro disponibilizado de cada controlada, direta ou indireta, equiparada ou coligada.
  Observação 1: Este demonstrativo é o que se refere o inciso VII do art. 35 da Instrução Normativa RFB no 1.520, de 4 de dezembro de 2014.
  Observação 2: Todos os campos devem ser informados, ainda que o valor a ser informado seja “zero”.
titulo_leiaute: 'REGISTRO X352: DEMONSTRATIVO DE RESULTADOS NO EXTERIOR AUFERIDOS POR INTERMÉDIO DE COLIGADAS'
