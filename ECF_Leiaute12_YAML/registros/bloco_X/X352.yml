informacoes_adicionais:
- titulo: I – Regra de Validação de Registro
  conteudo: 'REGRA_X352_PREENCHER: Este registro será obrigatório se X340.IND_CONTROLE for igual a “4” (Coligada em Regime de Competência) ou “6” (Coligada em Regime de Caixa) ou “10” Coligada em Regime de Competência por Opção) ou “11 (Coligada em regime misto).'
