  Regras de validação da tabela dinâmica X480:
  Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_X480_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas. (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
