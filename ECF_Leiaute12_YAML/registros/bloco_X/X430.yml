informacoes_adicionais:
- titulo: I – Regra de Validação de Registro
  conteudo: 'REGRA_CAMPOS_X430: Verifica se, pelo menos, um dos campos 3 a 8 está preenchido, quando os campos 1 e 2 estiverem preenchidos. Se a regra não cumprida, o sistema gera um erro.'
