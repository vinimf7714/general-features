registro: X430
nome: Rendimentos Relativos a Serviços, Juros e Dividendos Recebidos do Brasil e do Exterior
bloco: X
nome_tabela_registros: Rendimentos Relativos a Serviços, Juros e Dividendos Recebidos do Brasil e do Exterior
paginas_manual:
- 529
