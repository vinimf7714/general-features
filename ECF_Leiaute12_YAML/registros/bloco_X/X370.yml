campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (X370).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[X370]'
  obrigatorio: true
- numero: 2
  campo: IDENTIFICADOR
  descricao: Identificador da entidade com a qual o contribuinte realizou a transação controlada.
  tipo: C
  tamanho: 6
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: TIPO_TRANSACAO
  descricao: |-
    Código do tipo de transação:
    01 - Exportações de Bens - Commodities
    02 - Importações de Bens - Commodities
    03 - Exportações de Serviços
    04 - Importações de Serviços
    05 - Exportações de Direitos
    06 - Importações de Direitos
    07 - Operações Financeiras - Receitas Auferidas
    08 - Operações Financeiras - Despesas incorridas
    09 - Transações com Intangíveis - Receitas Auferidas 10 Transações com Intangíveis – Despesas Incorridas
    11 - Contratos de Compartilhamento de Custos
    12 - Exportações de Bens - Demais
    13 - Importações de Bens - Demais
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: '[01;02;03;04; 05;06;07; 08;09;10;11;12;13]'
  obrigatorio: true
- numero: 4
  campo: NOME_ENT
  descricao: Nome da entidade com a qual o contribuinte realizou a transação controlada.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: PAIS
  descricao: País de residência da entidade com a qual o contribuinte realizou a transação controlada.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: 'TABELA: PAIS_SISCOMEX'
  obrigatorio: true
- numero: 6
  campo: COD_NCM
  descricao: Nomenclatura Comum do Mercosul (NCM) dos bens exportados ou importados, para os códigos 01, 02, 12 e 13 do tipo de transação.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: TABELA_NCM
  obrigatorio: false
- numero: 7
  campo: TIPO_DEMAIS
  descricao: |-
    Tipo de Serviço, Direito, Operações Financeiros, Intangível ou Composição de Custos:
    101|Compras|S
    102|Manufatura ou produção|S
    103|Vendas, marketing ou distribuição|S
    104|Serviços administrativos e contábeis|S
    105|Serviços financeiros|S
    106|Seguro|S
    107|Gestão de ações e outros instrumentos de capital|S 108|Tecnologia da informação|S 109|Serviços jurídicos|S 110|Consultoria estratégica|S 111|Recursos humanos|S 112|Pesquisa e desenvolvimento|S 113|Gestão de propriedade intelectual|S 199|Outros tipos de serviços|S 201 Aluguel de Plataforma /Afretamento|D 202 Aluguel de equipamentos|D 299 Outros|D 301|Empréstimo|F 302|Leasing|F 303|Arrendamento mercantil|F 304|Garantia|F 399|Outro tipo de operações financeiras|F 401|Patente|I 402|Marca registrada|I 403|Direitos autorais|I 404|Know-how|I 405|Licença|I 406|Franquia|I 499|Outro tipo de transações com Intangíveis|I 501|Lista de tipo de serviços ou atividades|C 502|Pesquisa e desenvolvimento|C 503|Gestão de propriedade intelectual|C 504|Compras|C 505|Manufatura ou produção|C 506|Vendas, marketing ou distribuição|C 507|Serviços administrativos ou de gestão|C 508|Serviços financeiros|C 509|Seguro|C 510|Gestão de ações e outros instrumentos de capital|C 511|Serviços de TI|C
    5 99|Outros Contratos de compartilhamento de custos|C
  tipo: C
  tamanho: 3
  decimal: '-'
  valores_validos: '[101 a 113;199 201; 202; 299 301 a 304; 399 401 a 406; 499501 a 511; 599]'
  obrigatorio: false
- numero: 8
  campo: DESCR_BSDI
  descricao: D escrição da transação controlada.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 9
  campo: VL_TRANSACAO
  descricao: Valor da transação controlada.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 10
  campo: IND_AJUSTES
  descricao: Houve ajustes em função das regras de preços de transferência? S – Sim N – Não
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 11
  campo: VL_ESPONTANEO
  descricao: Valor do ajuste espontâneo.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 12
  campo: VL_COMPENSATORIO
  descricao: Valor do ajuste compensatório.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 13
  campo: TIP_AJ_COMPENSATORIO
  descricao: |-
    Tipo de ajuste compensatório:
    01 – Aumento da receita
    02 – Redução de custo
    03 – Redução de despesas
    99 - Outros
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: '[01;02;03;99]'
  obrigatorio: false
- numero: 14
  campo: METODO
  descricao: |-
    Método de preços de transferência utilizado:
    PIC – Preços Independentes Comparados PRL – Preço de Revenda Menos Lucro MCL – Custo Mais Lucro MLT – Margem Líquida da Transação MDL – Divisão do Lucro OUT – Outro Método
  tipo: C
  tamanho: 3
  decimal: '-'
  valores_validos: '[PIC; PRL; MCL; MLT; MDL; OUT]'
  obrigatorio: true
- numero: 15
  campo: DESCRICAO
  descricao: Descrição do método de preços de transferência utilizado com uma breve justificativa do porquê os outros métodos previstos no art. 33 não se aplicam ou não produzem resultados confiáveis, quando selecionada a opção 'Outro Método' (art. 45 da IN RFB nº 2.161/2023) na linha anterior.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 16
  campo: COMP_INTENCIONAL
  descricao: Houve compensações intencionais (art. 27 da IN RFB nº 2.161/2023)? S – Sim N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 17
  campo: SINERGIA
  descricao: Houve efeitos de sinergia (art. 31 da IN RFB nº 2.161/2023)? S – Sim N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 18
  campo: IND_TRANS_COMBINADAS
  descricao: A transação foi avaliada combinadamente com outras transações (art. 25 da IN RFB nº 2.161/2023)? S – Sim N - Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 19
  campo: IND_DADOS_MULTIP
  descricao: Houve utilização de dados de múltiplos anos (art. 30 da IN RFB nº 2.161/2023)? S – Sim N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 20
  campo: IND_SIMPLIFIC
  descricao: |-
    O contribuinte adotou a medida de simplificação para serviços intragrupo de baixo valor agregado (art. 53 da IN RFB nº 2.161/2023)? S – Sim N – Não
    Observação: Esse campo apenas deve ser preenchido para transação controlada que envolva prestação de serviços.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
regras_validacao_campos:
- numero: 6
  campo: COD_NCM
  regras:
  - regra: REGRA_COD_NCM_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.TIPO_TRANSACAO for igual a “01 –
      Exportações de Bens - Commodities” ou “02 – Importações de Bens - Commodities” ou"12 - Exportações de Bens - Demais" ou "13 - Importações de Bens - Demais'.
      Quando a transação controlada envolver mais de um bem, recomenda-se informar a NCM do bem que tiver maior relevância qualitativa ou quantitativa na transação.
    tipo: Erro
  - regra: REGRA_COD_NCM_NÃO_PREENCHER
    descricao: Verifica se o campo não está preenchido quando X370.TIPO_TRANSACAO for diferente de “01 – Exportações de Bens” e “02 – Importações de Bens” e "12 - Exportações de Bens - Demais" e "13 - Importações de Bens - Demais'
    tipo: Erro
- numero: 7
  campo: TIPO_DEMAIS
  regras:
  - regra: REGRA_TIPO_DEMAIS_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.TIPO_TRANSACAO for diferente de “01 – Exportações de Bens” e “02 – Importações de Bens” e “12 – Exportações de Bens - Demais” e “13 – Importações de Bens - Demais”.
      REGRA_ TIPO_DEMAIS_NAO_PREENCHER: Verifica se o campo não está preenchido quando X370.TIPO_TRANSACAO for igual a “01 – Exportações de Bens” ou “02 – Importações de Bens” ou “12 – Exportações de Bens - Demais” ou “13 – Importações de Bens - Demais.
    tipo: Erro
- numero: 11
  campo: VL_ESPONTANEO
  regras:
  - regra: REGRA_VL_ESPONTANEO_OBRIGATORIO
    descricao: Verifica se o campo está preenchido quando X370.IND_AJUSTES for igual a “S – Sim”.
    tipo: Erro
  - regra: REGRA_VL_ESPONTANEO_NAO_PREENCHER
    descricao: Verifica se o campo não está preenchido quando X370.IND_AJUSTES for igual a “N – Não”.
    tipo: Erro
- numero: 12
  campo: VL_COMPENSATORIO
  regras:
  - regra: REGRA_VL_COMPENSATORIO_OBRIGATÓRIO
    descricao: Verifica se o campo não está preenchido quando X370.IND_AJUSTES for igual a “S – Sim”.
    tipo: Erro
  - regra: REGRA_VL_COMPENSATORIO_NAO_PREENCHER
    descricao: Verifica se o campo não está preenchido quando X370.IND_AJUSTES for igual a “N – Não”.
    tipo: Erro
  - regra: REGRA_VL_COMPENSATORIO_MAPEADO
    descricao: Verifica se o valor do campo é igual ao somatório de X371.VALOR.
    tipo: Erro
- numero: 13
  campo: TIP_AJ_COMPENSATORIO
  regras:
  - regra: REGRA_AJ_COMPENSATORIO_OBRIGATORIO
    descricao: Verifica se o campo está preenchido quando X370.VL_COMPENSATORIO for maior que zero.
    tipo: Erro
  - regra: REGRA_AJ_COMPENSATORIO_NAO_PREENCHER
    descricao: Verifica se o campo não está preenchido quando X370.VL_COMPENSATORIO for igual a zero.
    tipo: Erro
- numero: 15
  campo: DESCRICAO
  regras:
  - regra: REGRA_DESCRICAO_OBRIGATORIO
    descricao: Verifica se o campo está preenchido quando X370.METODO for igual a “OUT – Outro Método”.
    tipo: Erro
  - regra: REGRA_DESCRICAO_NAO_PREENCHER
    descricao: Verifica se o campo não está preenchido quando X370.METODO for diferente de “OUT – Outro Método”.
    tipo: Erro
- numero: 16
  campo: IND_COMP_INTENCIONAL
  regras:
  - regra: REGRA_COMP_INTENCIONAL_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.METODO for diferente de “PIC – Preços Independentes Comparados”.
      REGRA_ COMP_INTENCIONAL_NAO_PREENCHER: Verifica se o campo não está preenchido quando X370.METODO for igual a “PIC – Preços Independentes Comparados”.
    tipo: Erro
- numero: 17
  campo: IND_SINERGIA
  regras:
  - regra: REGRA_IND_SINERGIA_OBRIGATÓRIO
    descricao: Verifica se o campo está preenchido quando X370.METODO for diferente de “PIC – Preços Independentes Comparados”.
    tipo: Erro
  - regra: REGRA_IND_SINERGIA_NAO_PREENCHER
    descricao: |-
      Verifica se o campo não está preenchido quando X370.METODO for igual a “PIC
      – Preços Independentes Comparados”.
    tipo: Erro
- numero: 18
  campo: IND_TRANS_COMBINADAS
  regras:
  - regra: REGRA_TRANS_COMBINADAS_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.METODO for diferente de “PIC – Preços Independentes Comparados”.
      REGRA_ TRANS_COMBINADAS _NAO_PREENCHER: Verifica se o campo não está preenchido quando X370.METODO for igual a “PIC – Preços Independentes Comparados”.
    tipo: Erro
- numero: 19
  campo: IND_DADOS_MULTIP
  regras:
  - regra: REGRA_DADOS_MULTIP_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.METODO for diferente de “PIC –
      Preços Independentes Comparados” e “MDL – Divisão de Lucro”.
      REGRA_ DADOS_MULTIP_NAO_PREENCHER: Verifica se o campo não está preenchido quando X370.METODO for igual a “PIC
      – Preços Independentes Comparados” ou “MDL – Divisão de Lucro”.
    tipo: Erro
- numero: 20
  campo: IND_SIMPLIFIC
  regras:
  - regra: REGRA_SIMPLIFIC_OBRIGATORIO
    descricao: |-
      Verifica se o campo está preenchido quando X370.TIPO_TRANSACAO for igual a “03 –
      Exportações de Serviços” ou “04 – Importações de Serviços”.
      REGRA_ SIMPLIFIC _NAO_PREENCHER: Verifica se o campo está preenchido quando X370.TIPO_TRANSACAO for diferente de a “03 – Exportações de Serviços” e “04 – Importações de Serviços”.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|X370|E01|01|Entidade 01|1|11212121||TRANSACAO CONTROLADA XYZ|100000,00|N||||PIC||N|N|N|N|N|'
  explicacao:
  - valor: '|X370|'
    descricao: Identificação do tipo de registro.
  - valor: '|E01|'
    descricao: Identificador da entidade.
  - valor: '|01|'
    descricao: Tipo de transação (01 – Exportações de Bens).
  - valor: '|Entidade 01|'
    descricao: Nome da entidade.
  - valor: '|1|'
    descricao: País (1 – Canadá).
  - valor: '|11212121|'
    descricao: Nomenclatura Comum do Mercosul (NCM).
  - valor: '||'
    descricao: Tipo de serviço, direito, operações financeiras, intangível ou composição de custos.
  - valor: '|TRANSACAO CONTROLADA XYZ|'
    descricao: Descrição da transação controlada.
  - valor: '|100000,00|'
    descricao: Valor da transação controlada (R$ 100.000,00).
  - valor: '|N|'
    descricao: Houve ajustes em função das regras de preços de transferência? (N – Não).
  - valor: '||'
    descricao: Valor do ajuste espontâneo (0,00).
  - valor: '||'
    descricao: Valor do ajuste compensatório (0,00).
  - valor: '||'
    descricao: Tipo de ajustes compensatório.
  - valor: '|PIC|'
    descricao: Método de preços de transferência utilizado (PIC – Preços Independentes Comparados).
  - valor: '||'
    descricao: Descrição.
  - valor: '|N|'
    descricao: Houve compensações intencionais? (N – Não).
  - valor: '|N|'
    descricao: Houve efeitos de sinergia? (N – Não).
  - valor: '|N|'
    descricao: A transação foi avaliada combinadamente com outras transações? (N – Não).
  - valor: '|N|'
    descricao: Houve utilização de dados de múltiplos anos? (N – Não).
  - valor: '||'
    descricao: O contribuinte adotou a medida de simplificação para serviços intragrupo de baixo valor agregado (art. 53 da IN RFB nº 2.161/2023)
