  tipo: N
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: IND_ADM_FUN_CLU
  descricao: |-
    Administradora de Fundos e Clubes de Investimento:
    S – Sim
    N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 5
  campo: IND_PART_CONS
  descricao: |-
    Participações em Consórcios de Empresas:
    S – Sim
    N – Não
    A pessoa jurídica participante de consórcio constituído nos termos do disposto nos arts.
    278 e 279 da Lei nº 6.404, de 15 de dezembro de 1976, deve assinalar este campo.
    Atenção: Somente deve ser assinalado este campo quando houver receita de pelo menos uma consorciada.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 6
  campo: IND_OP_EXT
  descricao: |-
    Operações com o Exterior:
    S – Sim
    N – Não
    A pessoa jurídica, inclusive instituição financeira ou companhia seguradora, conforme relacionadas no § 1º do art. 22 da Lei nº 8.212, de 1991, e no inciso II do art. 14 da Lei nº 9.718, de 1998, que realizou exportação/importação de bens, serviços ou direitos ou auferiu receitas financeiras ou incorreu em despesas financeiras em operações efetuadas com pessoa física ou jurídica residente ou domiciliada no exterior, ainda que essas operações não tenham sido realizadas com pessoa vinculada ou com pessoa residente ou domiciliada em país ou dependência com tributação favorecida ou cuja legislação interna oponha sigilo relativo à composição societária de pessoas jurídicas ou a sua titularidade, deve assinalar este campo.
    Deve também assinalar este campo a pessoa jurídica, inclusive instituição financeira ou companhia seguradora, que realizar as operações acima referidas por intermédio de interposta pessoa.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 7
  campo: IND_OP_VINC
  descricao: |-
    Operações com Pessoa Vinculada/Interposta Pessoa / País com Tributação Favorecida.
    S – Sim
    N – Não
    Deve assinalar este campo, a pessoa jurídica, inclusive instituição financeira ou companhia seguradora, conforme relacionadas no § 1º do art. 22 da Lei nº 8.212, de 1991, e no inciso II do art. 14 da Lei nº 9.718, de 1998, que realizou exportação/importação de bens, serviços ou direitos ou auferiu receitas financeiras ou incorreu em despesas financeiras em operações efetuadas com pessoa física ou jurídica residente ou domiciliada no exterior, considerada pela legislação brasileira: a) pessoa vinculada; b) pessoa residente ou domiciliada em países com tributação favorecida ou cuja legislação interna oponha sigilo relativo à composição societária de pessoas jurídicas ou a sua titularidade; e c) a partir de 1º de janeiro de 2009, pessoa residente ou domiciliada no exterior, que goze, nos termos da legislação, de regime fiscal privilegiado (Art. 24-A da Lei nº 9.430, de 1996, instituído pela Lei nº 11.727, de 2008 e alterado pela Lei nº 14.596, de 2023).
    Deve também assinalar este campo a pessoa jurídica, inclusive instituição financeira ou companhia seguradora, que realizar as operações acima referidas por intermédio de interposta pessoa.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 8
  campo: IND_PJ_ENQUAD
  descricao: |-
    PJ Enquadrada nos artigos 48 ou 49 da Instrução Normativa RFB nº 1.312/2012:
    S – Sim
    N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 9
  campo: IND_PART_EXT
  descricao: |-
    Participações no Exterior: A pessoa jurídica deve assinalar este campo, caso tenha participações no exterior.
    S – Sim
    N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 10
  campo: IND_ATIV_RURAL
  descricao: |-
    Atividade Rural: A pessoa jurídica deve assinalar este campo, caso explore atividade rural.
    S – Sim
    N – Não
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 11
  campo: IND_LUC_EXP
  descricao: |-
    Existência de Lucro da Exploração:
    S – Sim
    N – Não
    Este campo deve ser assinalado pelas pessoas jurídicas que adotam a forma de tributação pelo lucro real, inclusive se optantes pelo Refis, que gozem de benefícios fiscais calculados com base no lucro da exploração.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 12
  campo: IND_RED_ISEN
  descricao: |-
    Isenção e Redução do Imposto para Lucro Presumido:
    S – Sim
    N – Não
    A pessoa jurídica tributada pelo lucro presumido e optante pelo Refis deve assinalar este campo caso usufrua benefícios fiscais relativos a isenção ou redução do imposto de renda.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 13
  campo: IND_FIN
  descricao: |-
    Indicativo da Existência de FINOR/FINAM:
    S – Sim
    N – Não
    Este campo deve ser assinalado pelas pessoas jurídicas ou grupos de empresas coligadas de que trata o art. 9º da Lei nº 8.167, de 1991, alterado pela Medida Provisória nº 2.199- 14, de 24 de agosto de 2001, titulares de empreendimento de setor da economia considerado, em ato do Poder Executivo, prioritário para o desenvolvimento regional, aprovado ou protocolizado até 2 de maio de 2001 nas áreas da Sudam e da Sudene ou do Grupo Executivo para Recuperação Econômica do Estado do Espírito Santo (Geres) (MP nº 2.199-14, de 2001, art. 4º, e MP nº 2.145, de 2 de maio de 2001, art. 50, XX, atuais MP nº 2.156-5, de 2001, art. 32, XVIII, e nº 2.157-5, de 2001, art. 32, IV).
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 14
  campo: IND_PART_COLIG
  descricao: |-
    Participação Avaliada pelo Método de Equivalência Patrimonial:
    S – Sim
    N – Não
    A pessoa jurídica domiciliada no Brasil, que teve participações permanentes, no ano- calendário, em capital de pessoa jurídica domiciliada no Brasil ou no exterior, considerada, pela legislação brasileira, avaliada pelo método de equivalência patrimonial, deve assinalar este campo.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 15
  campo: IND_REC_EXT
  descricao: |-
    Recebimentos do Exterior ou de Não Residentes:
    S – Sim
    N – Não
    Deve assinalar este campo, a pessoa jurídica que recebeu, durante o ano-calendário, de pessoas físicas ou jurídicas, residentes ou domiciliadas no exterior ou de não-residentes:
    - quaisquer valores mediante operações de câmbio de qualquer natureza;
    - quaisquer valores por intermédio de transferências internacionais em reais (TIR), ou seja, provenientes de conta bancária em reais (R$) titulada por não-residente;
    - valores iguais ou superiores a R$ 120.000,00 (cento e vinte mil reais), equivalentes a R$ 10.000,00 por mês, por intermédio de cartões de crédito;
    - quaisquer valores por intermédio de depósitos em contas bancárias mantidas no exterior.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 16
  campo: IND_ATIV_EXT
  descricao: |-
    Ativos no Exterior:
    S – Sim
    N – Não
    Preenchida por todas as pessoas jurídicas (Sim), salvo quando o valor contábil total dos ativos a declarar, convertido para Reais no final do período abrangido pela ECF, for inferior a R$ 100.000,00 (cem mil reais) (Não).
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 17
  campo: IND_PGTO_EXT
  descricao: |-
    Pagamentos ao Exterior ou a Não Residentes:
    S – Sim
    N – Não
    Deve assinalar este campo, a pessoa jurídica que tiver pagado, creditado, entregado, empregado ou remetido, durante o ano-calendário, a pessoas físicas ou jurídicas, residentes ou domiciliadas no exterior ou a não-residentes:
    - quaisquer valores mediante operações de câmbio de qualquer natureza;
    - quaisquer valores por intermédio de transferências internacionais em reais (TIR), ou seja, pela utilização de reais (R$) para crédito de conta bancária titulada por não- residentes;
    - valores iguais ou superiores a R$ 120.000,00 (cento e vinte mil reais), equivalentes a R$ 10.000,00 por mês, por intermédio de cartões de crédito;
    - quaisquer valores mediante a utilização de recursos mantidos no exterior.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 18
  campo: IND_E-COM_TI
  descricao: |-
    Comércio Eletrônico e Tecnologia da Informação:
    S – Sim
    N – Não
    A pessoa jurídica que efetuou durante o ano-calendário vendas de bens (tangíveis ou intangíveis) ou tiver prestado serviços, por meio da Internet, para pessoas físicas e jurídicas, residentes ou domiciliadas no Brasil ou no exterior, deve assinalar este campo.
    Ao assinalar este campo, são disponibilizados os registros X400 (Comércio Eletrônico e Tecnologia da Informação) e X410 (Comércio Eletrônico).
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 19
  campo: IND_ROY_REC
  descricao: |-
    Royalties Recebidos do Brasil e do Exterior:
    S – Sim
    N – Não
    A pessoa jurídica que tiver recebido, durante o ano-calendário, de pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior, rendimentos a título de royalties relativos a: exploração econômica dos direitos patrimoniais do autor, de marcas, de patentes e de desenho industrial; exploração de know-how; exploração de franquias e exploração dos direitos relativos à propriedade intelectual referente a cultivares, deve preencher este campo com “Sim”.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 20
  campo: IND_ROY_PAG
  descricao: |-
    Royalties Pagos a Beneficiários do Brasil e do Exterior:
    S – Sim
    N – Não
    A pessoa jurídica que tiver efetuado pagamento ou remessa, durante o ano-calendário, a pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior, a título de royalties relativos a: exploração econômica dos direitos patrimoniais do autor, de marcas, de patentes e de desenho industrial; exploração de know-how; exploração de franquias e exploração dos direitos relativos à propriedade intelectual referente a cultivares, deve preencher este campo com “Sim”.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 21
  campo: IND_REND_SERV
  descricao: |-
    Rendimentos Relativos a Serviços, Juros e Dividendos Recebidos do Brasil e do Exterior:
    S – Sim
    N – Não
    A pessoa jurídica que tiver recebido, durante o ano-calendário, de pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior, rendimentos relativos a: serviços de assistência técnica, científica, administrativa e semelhantes que impliquem transferência de tecnologia; serviços técnicos e de assistência que não impliquem transferência de tecnologia; juros sobre capital próprio, bem como juros decorrentes de contratos de mútuo entre empresas ligadas e juros decorrentes de contratos de financiamento; dividendos decorrentes de participações em outras empresas, deve preencher este campo com “Sim”.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 22
  campo: IND_PGTO_REM
  descricao: |-
    Pagamentos ou Remessas a Título de Serviços, Juros e Dividendos a Beneficiários do Brasil e do Exterior:
    S – Sim
    N – Não
    A pessoa jurídica que tiver pagado ou remetido, durante o ano-calendário, a pessoas físicas ou jurídicas, residentes ou domiciliadas no Brasil ou no exterior, valores relativos a: serviços de assistência técnica, científica, administrativa e semelhantes que impliquem transferência de tecnologia; serviços técnicos e de assistência que não impliquem transferência de tecnologia; juros sobre capital próprio, bem como juros decorrentes de contratos de mútuo entre empresas ligadas e juros decorrentes de contratos de financiamento; dividendos decorrentes de participações em outras empresas, deve preencher este campo com “Sim”.
    As pessoas jurídicas que realizaram pagamentos ou remessas ao exterior para as operações previstas no art. 1º, inc. II, III, IV, X, XI e XII, da Lei nº 9.481, de 1997, e art.
    9º da Lei nº 11.774, de 2008.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 23
  campo: IND_INOV_TEC
  descricao: |-
    Inovação Tecnológica e Desenvolvimento Tecnológico:
    S – Sim
    N – Não
    A pessoa jurídica beneficiária de incentivos fiscais relativos às atividades de pesquisa tecnológica e desenvolvimento de inovação tecnológica de que tratam os arts. 17 a 26 da Lei nº 11.196, de 21 de novembro de 2005, ou a pessoa jurídica executora dos programas de desenvolvimento tecnológico industrial ou agropecuário (PDTI/PDTA) de que trata a Lei nº 8.661, de 1993, aprovados até 31 de dezembro de 2005, que não tenha migrado para o regime estabelecido nos arts. 17 a 26 da Lei nº 11.196, de 2005, deve preencher este campo com “Sim”.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 24
  campo: IND_CAP_INF
  descricao: |-
    Capacitação de Informática e Inclusão Digital:
    S – Sim
    N – Não
    A pessoa jurídica que tiver investido em atividades de pesquisa e desenvolvimento em tecnologia da informação no âmbito dos programas de capacitação e competitividade dos setores de informática e automação e tecnologias da informação de que trata a Lei nº 8.248, de 23 de outubro de 1991, a Lei nº 10.176, de 11 de janeiro de 2001, e a Lei nº 11.077, de 30 de dezembro de 2004, regulamentadas pelo Decreto nº 5.906, de 26 de setembro de 2006, ou tiver efetuado venda a varejo nos termos dos arts. 28 a 30 da Lei nº 11.196, de 2005, que dispõem sobre o programa de inclusão digital, deve preencher este campo com “Sim”.
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S;N]'
  obrigatorio: true
- numero: 25
  campo: IND_PJ_HAB
  descricao: |-
    PJ Habilitada ao Repes, Recap, Padis, Reidi, Recine, Retid, Óleo Bunker, Reporto, RET II, RET PMCMV/PCVA, RET EEI, EBAS Imune, Repetro-Industrialização, Repetro- Nacional, Repetro-Permanente e Repetro-Temporário:
    S – Sim
    N – Não
    Este registro deverá ser preenchido pela pessoa jurídica: a) habilitada ao Regime Especial de Tributação para a Plataforma de Exportação de Serviços de Tecnologia da Informação (Repes), instituído pela Lei nº 11.196, de 2005, com as alterações introduzidas pela Lei nº 11.774, de 17 de setembro de 2008 e pela Lei 12.715, de 17 de setembro de 2012, regulamentado pelo Decreto nº 5.712, de 2 de março de 2006, com as alterações introduzidas pelo Decreto nº 6.887, de 25 de junho de 2009; ou b) habilitada ao Regime Especial de Aquisição de Bens de Capital para Empresas Exportadoras (Recap) instituído pela Lei nº 11.196, de 2005, com as alterações introduzidas pela Lei nº 11.774, de 2008 e pela Lei 12.715, de 17 de setembro de 2012, regulamentado pelo Decreto nº 5.649, de 29 de dezembro de 2005, com as alterações posteriores; ou c) executora de projeto aprovado no âmbito do Programa de Apoio ao Desenvolvimento Tecnológico da Indústria de Semicondutores (Padis), instituído pela Lei nº 11.484, de 31 de maio de 2007, com alterações introduzidas pelo art. 20 c/c art. 139, I, “d” da Lei nº 12.249, de 11 de junho de 2010, regulamentado pelo Decreto nº 6.233, de 11 de outubro de 2007, com as alterações introduzidas pelo Decreto nº 6.887, de 2009; ou
    d) habilitada ou co-habilitada ao Regime Especial de Incentivos para o Desenvolvimento da Infraestrutura (Reidi), instituído pela Lei nº 11.488, de 15 de junho de 2007, com as alterações posteriores, regulamentado pelo Decreto nº 6.144, de 3 de julho de 2007, com as alterações introduzidas pelo Decreto nº 6.167, de 24 de julho de 2007 e pelo Decreto nº 6.416, de 28 de março de 2008; ou e) detentora de projeto de exibição cinematográfica aprovado no âmbito do Regime Especial de Tributação para Desenvolvimento da Atividade de Exibição Cinematográfica (Recine), instituído pela Lei nº 12.599, de 23 de março de 2012, regulamentada pelo Decreto nº 7.729, de 25 de maio de 2012; ou f) beneficiária do Regime Especial Tributário para a Indústria de Defesa (Retid), nos termos e condições estabelecidos na Lei nº 12.598, de 22 de março de 2012, ou g) habilitada a usufruir a suspensão do pagamento da Contribuição para o PIS/Pasep e da Cofins incidentes nas vendas no mercado interno de óleo combustível do tipo bunker destinado à navegação de cabotagem e de apoio portuário e marítimo e da Contribuição para o PIS/Pasep-Importação e da Cofins-Importação incidentes na sua importação, criada pelo art. 2º da Lei nº 11.774, de 17 de setembro de 2008. h) habilitada ao Regime Tributário para o Incentivo à Modernização e à Ampliação da Estrutura Portuária (Reporto), instituído pelo art. 13 da Lei nº 11.033, de 2004, regulamentado pelo Decreto nº 6.582, de 2008, e Decreto nº 8.033, de 2013. i) com opção efetivada pela RFB para o Regime Especial de Tributação Aplicável às Incorporações Imobiliárias objeto de patrimônio de afetação (RET-II), de que tratam os arts. 1º a 11-A da Lei nº 10.931, de 2 de agosto de 2004. j) com opção efetivada pela RFB para o Regime Especial de Tributação Aplicável às Construções de Unidades Habitacionais Contratadas no Âmbito do Programa Minha Casa, Minha Vida (RET-PMCMV), de que tratam os arts. 1º a 2º-A da Lei nº 12.024, de 27 de agosto de 2009, ou do Programa Casa Verde e Amarela (RET-PCVA), de que trata a Lei nº 14.118, de 2021 k) com opção efetivada pela RFB para o Regime Especial de Tributação Aplicável às Construções ou Reformas de Estabelecimentos de Educação Infantil (RET-EEI), de que tratam os arts. 24 a 27 da Lei nº 12.715, de 17 de setembro de 2012, regulamentados pelos arts. 486 a 495 do Decreto nº 9.580, de 22 de novembro de 2018.
    l) entidade beneficente de assistência social (EBAS) imune de contribuições sociais, de que trata o parágrafo 7º do art. 195 da Constituição da República Federativa do Brasil, de 5 de outubro de 1988, e certificada nos termos da Lei Complementar nº 187, de 16 de dezembro de 2021. m) habilitada ao Regime Especial de Industrialização de Bens Destinados às Atividades de Exploração, de Desenvolvimento e de Produção de Petróleo, de Gás Natural e de Outros Hidrocarbonetos Fluidos (Repetro-Industrialização), instituído pelo art. 6º da Lei nº 13.586, de 28 de dezembro de 2017, regulamentado pelo Decreto nº 9.537, de 24 de outubro de 2018. n) habilitada ao Regime Aduaneiro Especial de Exportação e Importação de Bens Destinados às Atividades de Pesquisa e de Lavra das Jazidas de Petróleo e de Gás Natural (Repetro), de que tratam o art. 6º da Lei nº 12.276, de 30 de junho de 2010, o art. 61 da Lei nº 12.351, de 22 de dezembro de 2010, o art. 5º da Lei nº 13.586, de 28 de dezembro de 2017, e regulamentado pelos arts. 458 a 462 do Decreto nº 6.759, de 5 de fevereiro de 2009. o) habilitada ao Regime Tributário e Aduaneiro Especial de Utilização Econômica de Bens Destinados às Atividades de Exploração, Desenvolvimento e Produção das Jazidas de Petróleo e de Gás Natural (Repetro-Sped), de que tratam o art. 6º da Lei nº 12.276, de 30 de junho de 2010, o art. 61 da Lei nº 12.351, de 22 de dezembro de 2010, o art. 5º da Lei nº 13.586, de 28 de dezembro de 2017, e regulamentado pelos arts. 372, 377, 426 e 462 do Decreto nº 6.759, de 5 de fevereiro de 2009.
    Ainda a pessoa jurídica com opção efetivada pela RFB para os Regimes Especiais de Tributação Aplicáveis às Incorporações Imobiliárias objeto de patrimônio de afetação (RET-II), de que tratam os arts. 1º a 11-A da Lei nº 10.931, de 2 de agosto de 2004, às Construções de Unidades Habitacionais Contratadas no Âmbito do Programa Minha Casa, Minha Vida (RET-PMCMV), de que tratam os arts. 1º a 2º-A da Lei nº 12.024, de 27 de agosto de 2009, ou do Programa Casa Verde e Amarela (RET-PCVA), de que trata a Lei de Conversão da Medida Provisória nº 996, de 25 de agosto de 2020, e às Construções ou Reformas de Estabelecimentos de Educação Infantil (RET-EEI), de que tratam os arts. 24 a 27 da Lei nº 12.715, de 17 de setembro de 2012, regulamentados pelos arts. 486 a 495 do Decreto nº 9.580, de 22 de novembro de 2018.
    Entidade Beneficente de Assistência Social (EBAS) imune de contribuições sociais, de que trata o parágrafo 7º do art. 195 da Constituição da República Federativa do Brasil,
    de 5 de outubro de 1988, e certificada nos termos da Lei Complementar nº 187, de 16 de dezembro de 2021.
    Habilitada ao Regime Especial de Industrialização de Bens Destinados às Atividades de Exploração, de Desenvolvimento e de Produção de Petróleo, de Gás Natural e de Outros Hidrocarbonetos Fluidos (Repetro-Industrialização), instituído pelo art. 6º da Lei nº 13.586, de 28 de dezembro de 2017, e regulamentado pelo Decreto nº 9.537, de 24 de outubro de 2018.
    Habilitada ao Regime Aduaneiro Especial de Exportação e Importação de Bens Destinados às Atividades de Pesquisa e de Lavra das Jazidas de Petróleo e de Gás Natural (Repetro) ou no Regime Tributário e Aduaneiro Especial de Utilização Econômica de Bens Destinados às Atividades de Exploração, Desenvolvimento e Produção das Jazidas de Petróleo e de Gás Natural (Repetro-Sped), de que tratam o art.
    6º da Lei nº 12.276, de 30 de junho de 2010, o art. 61 da Lei nº 12.351, de 22 de dezembro de 2010, o art. 5º da Lei nº 13.586, de 28 de dezembro de 2017, e regulamentado pelos arts. 372, 377, 426, 458 a 462 do Decreto nº 6.759, de 5 de fevereiro de 2009.
    Habilitada ao Regime Especial de Tributação para Serviços de Datacenter - REDATA – instituído pela Medida Provisória nº 1.318, de 17 de setembro de 2025, que altera a Lei nº 11.196, de 21 de novembro de 2005. Porém, por conta do Ato Declaratório do Presidente da Mesa do Congresso Nacional nº 11, de 2026, o regime vigeu até a data de 25 de fevereiro de 2026. As pessoas jurídicas que conseguiram habilitar e usufruir do benefício devem prestar informação.
