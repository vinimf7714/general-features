regras_validacao_campos:
- numero: 2
  campo: IND_ALIQ_CSLL
  regras:
  - regra: REGRA_PREENCHIMENTO_IMUNE_ISENTA_DESOBRIGADA
    descricao: Verifica, quando 0010.FORMA_TRIB é igual a “8” (Imune do IRPJ) ou “9” (Isento do IPRJ) e 0010. APUR_CSLL = “D” (Desobrigada), se 0020.IND_ALIQ_CSLL não está preenchido.
    tipo: Erro
  - regra: REGRA_PREENCHIMENTO_IND_ALIQ_CSSL
    descricao: Verifica, quando o ano da ECF for maior ou igual a 2019, se o campo 0020.IND_ALIQ_CSLL é igual a “1” (9%) ou “4” (15%).
    tipo: Erro
- numero: 3
  campo: IND_QTE_SCP
  regras:
  - regra: REGRA_SCP_NAO_PREENCHER_QTD
    descricao: Verifica, quando 0000.TIP_ECF é igual a “0” (ECF de empresa não participante de SCP como sócio ostensivo) ou “2” (ECF da SCP), se 0020.IND_QTE_SCP não está preenchido.
    tipo: Erro
  - regra: REGRA_SCP_OBRIGATORIO_QTD
    descricao: Verifica, quando 0000.TIP_ECF é igual a “1” (ECF de empresa participante de SCP como sócio ostensivo), se 0020.IND_QTE_SCP está preenchido.
    tipo: Erro
  - regra: REGRA_QTD_SCP
    descricao: Verifica se 0020.IND_QTE_SCP é igual ao número de registros 0035 informados.
    tipo: Erro
- numero: 4
  campo: IND_ADM_FUN_CLU
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_ADM_FUN_CLU
    descricao: Verifica, quando 00010.FORMA_TRIB é igual a “8” (Imune do IRPJ) e 0010_TIP_ENT é diferente de “06” (Entidade Fechada de Previdência Complementar), “11” (Associação de Poupança e Empréstimo) e “12” (Entidade Aberta de Previdência Complementar Sem Fins Lucrativos), se 0020.IND_ADM_FUN_CLU está preenchido.
    tipo: Erro
- numero: 5
  campo: IND_PART_CONS
  regras:
  - regra: REGRA_PREENCHIMENTO_ATIV_13
    descricao: Verifica, quando 0010_TIP_ENT é igual a “13” (Fifa e Entidades Relacionadas), se 0020.IND_PART_CONS é igual a “N”.
    tipo: Erro
- numero: 6
  campo: IND_OP_EXT
  regras:
  - regra: REGRA_PREENCHIMENTO_IMUNE_ISENTA
    descricao: Verifica, quando 0010.FORMA_TRIB é igual a “8” (Imune do IRPJ) ou “9” (Isento do IPRJ), se 0020.IND_OP_EXT é igual a “N”.
    tipo: Erro
- numero: 7
  campo: IND_OP_VINC
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_OP_VINC
    descricao: Verifica, quando 0020.IND_OP_EXT é igual a “N”, se 0020.IND_OP_VINC também é igual a “N”.
    tipo: Erro
- numero: 9
  campo: IND_PART_EXT
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_PART_EXT
    descricao: |-
      Verifica as regras abaixo:
      Se 0010.FORMA_TRIB igual a “8” (Imune de IRPJ) ou “9” (Isento do IPRJ), então 0020.IND_PART_EXT deve ser igual a “N”.
      Se [0010.FORMA_TRIB é igual a “5” (Lucro Presumido) ou “7” (Lucro Presumido/Arbitrado)) e 0010.OPT_REFIS igual a “N”], então IND_PART_EXT deve ser igual a “N”.
    tipo: Erro
- numero: 10
  campo: IND_ATIV_RURAL
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_ATIV_RURAL
    descricao: Verifica, quando 0010.COD_QUALIF_PJ = “02” (PJ Componente do Sistema Financeiro) ou “03” (Sociedades Seguradoras, de Capitalização ou Entidade Aberta de Previdência Complementar), se 0020.IND_ATIV_RURAL é igual a “N”.
    tipo: Erro
- numero: 11
  campo: IND_LUC_EXP
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_LUC_EXP
    descricao: Verifica, quando 0010.COD_QUALIF_PJ é diferente de “01” (PJ em Geral) ou 0010.FORMA_TRIB é diferente de “1” (Lucro Real), “2” (Lucro Real/Arbitrado), “3” (Lucro Presumido/Real) ou “4” (Lucro Presumido/Real/Arbitrado), se 0020.IND_LUC_EXP é igual a “N”.
    tipo: Erro
- numero: 12
  campo: IND_RED_ISEN
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_RED_ISEN
    descricao: Verifica, quando 0010.OPT_REFIS é diferente de “S” ou 0010.COD_QUALIF_PJ é diferente de “01” (PJ em Geral) ou 0010.FORMA_TRIB é diferente de “5” (Lucro Presumido) ou “7” (Lucro Presumido/Arbitrado), se 0020.IND_RED_ISEN é igual a “N”.
    tipo: Erro
- numero: 13
  campo: IND_FIN
  regras:
  - regra: REGRA_PREENCHIMENTO_IND_FIN
    descricao: Verifica, quando 0010.FORMA_TRIB é diferente de “1” (Lucro Real), “2” (Lucro Real/Arbitrado), “3” (Lucro Presumido/Real) ou “4” (Lucro Presumido/Real/Arbitrado), se 0020.IND_FIN é igual a “N”.
    tipo: Erro
