exemplos_preenchimento:
- linhas_exemplo:
  - '|0010||N|1|T|01|RRRR||||||1|'
  explicacao:
  - valor: '|0010|'
    descricao: Identificação do tipo do registro.
  - valor: '||'
    descricao: Hashcode da ECF do período imediatamente anterior (Não há).
  - valor: '|N|'
    descricao: Indicador de optante pelo Refis (N = Não).
  - valor: '|1|'
    descricao: Forma de tributação do lucro (1 = Lucro Real).
  - valor: '|T|'
    descricao: Forma de apuração do IRPJ e da CSLL (T = Trimestral).
  - valor: '|01|'
    descricao: Qualificação da pessoa jurídica (01 = PJ em Geral).
  - valor: '|RRRR|'
    descricao: Forma de tributação no período (RRRR = Lucro Real nos quatro trimestres).
  - valor: '||'
    descricao: Forma de apuração da estimativa (Não há).
  - valor: '||'
    descricao: Tipo de escrituração (não obrigatório para o lucro real).
  - valor: '||'
    descricao: Tipo de pessoa jurídica imune ou isenta (não obrigatório para o lucro real).
  - valor: '||'
    descricao: Existência de atividade tributada pelo IRPJ para imunes ou isentas (não obrigatório para o lucro real).
  - valor: '||'
    descricao: Apuração da CSLL para imunes ou isentas (não obrigatório para o lucro real).
  - valor: '|1|'
    descricao: Regime de caixa.
