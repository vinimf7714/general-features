      tipo: Erro
  - numero: 11
    campo: DT_FIN
    regras:
    - regra: REGRA_DT_FINAL_ESCRITURACAO
      descricao: Verifica, quando 0000.SIT_ESPECIAL for igual a “0” (Normal), se o dia e o mês em 0000.DT_FIN é igual a 31/12.
      tipo: Erro
    - regra: REGRA_EVENTO_ACONTECIMENTO
      descricao: |-
        Verifica:
        - Quando 0000.SIT_ESPECIAL for igual a “1” (Extinção), “2” (Fusão), “3” (Incorporação/Incorporada), “4” (Incorporação/Incorporadora), “5” (Cisão Total) ou “6” (Cisão Parcial), se 0000.DT_FIN é igual a 0000.DT_SIT_ESP.
        - Quando 0000.SIT_ESPECIAL for “7” (Transformação), “8” (Desenquadramento de Imune e Isenta” ou “9” (Inclusão no Simples Nacional), se 0000.DT_FIN é igual a 0000.DT_SIT_ESP – 1.
      tipo: Erro
  - numero: 13
    campo: NUM_REC
    regras:
    - regra: REGRA_REC_ANTERIOR_OBRIGATORIO
      descricao: Verifica, quando o campo 0000.RETIFICADORA é igual a “S” (ECF Retificadora) ou “F” (ECF original com mudança de forma de tributação), se 0000.NUM_REC está preenchido.
      tipo: Erro
    - regra: REGRA_DV_RECIBO
      descricao: Verifica se o número do recibo informado é válido.
      tipo: Erro
    - regra: REGRA_NRO_REC_ANTERIOR_NAO_SE_APLICA
      descricao: Verifica, quando 0000.RETIFICADORA é igual a “N” (ECF Original), se 0000.NUM_REC não está preenchido.
      tipo: Erro
  - numero: 15
    campo: COD_SCP
    regras:
    - regra: REGRA_SCP_OBRIGATORIO
      descricao: Verifica, quando 0000.TIP_ECF é igual a “2” (ECF da SCP), se 0000.COD_SCP está preenchido.
      tipo: Erro
    - regra: REGRA_SCP_NAO_PREENCHER
      descricao: Verifica, quando 0000.TIP_ECF é igual a “0” (ECF de empresa não participante de SCP como sócio ostensivo) ou “1” (ECF de empresa participante de SCP como sócio ostensivo), se 0000.COD_SCP não está preenchido.
      tipo: Erro
    - regra: REGRA_VALIDA_TAM_SCP
      descricao: O campo 0000.COD_SCP da SCP deve conter exatamente 14 números.
      tipo: Erro
    - regra: REGRA_CNPJ_DIFERENTE_SCP
      descricao: Verifica se 0000.COD_SCP é diferente de 0000.CNPJ.
      tipo: Erro
    - regra: REGRA_VALIDA_CNPJ
      descricao: Verifica se a regra de formação do código é válida.
      tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|0000|LECF|0011|11111111000191|EMPRESA TESTE|0|0|||01012025|31122025|N||0||'
  explicacao:
  - valor: '|0000|'
    descricao: Identificação do tipo do registro.
  - valor: '|LECF|'
    descricao: Identificação do tipo de Sped (LECF = Escrituração Contábil Fiscal).
  - valor: '|0009|'
    descricao: Código da versão do leiaute (Versão 0011).
  - valor: '|11111111000191|'
    descricao: 'CNPJ: (11.111.111/0001-91).'
  - valor: '|EMPRESA TESTE|'
    descricao: Nome empresarial.
  - valor: '|0|'
    descricao: Indicador de início do período (0 = Regular – início no primeiro dia do ano).
  - valor: '|0|'
    descricao: Situação especial (0 = Normal – sem ocorrência de situação especial ou evento).
  - valor: '||'
    descricao: Patrimônio remanescente em caso de cisão (Não há).
  - valor: '||'
    descricao: Data da situação especial ou evento (Não há).
  - valor: '|01012025|'
    descricao: Data inicial das informações contidas no arquivo (01/01/2025).
  - valor: '|31122025|'
    descricao: Data final das informações contidas no arquivo (31/12/2025).
  - valor: '|N|'
    descricao: Escrituração original (não é retificadora).
  - valor: '||'
    descricao: Número do recibo da ECF a ser retificada (Não há).
  - valor: '|0|'
    descricao: Tipo da ECF (0 = ECF da empresa não participante de SCP).
  - valor: '||'
    descricao: Identificação da SCP (Não há).
