descricao: |-
  Este registro identifica unicamente uma escrituração no PGE por meio dos seguintes campos:
  - 0000.CNPJ – Campo CNPJ (CNPJ BÁSICO – 8 primeiras posições);
  - 0000.COD_SCP – Campo CNPJ da SCP; e
  - 0000.DT_FIN – Campo data fim da ECF.
  Considerando a existência de apenas uma situação especial ou evento no ano, conforme tabela a seguir:

  | SITUAÇÃO ESPECIAL OU EVENTO | ESCRITURAÇÕES | PRAZO DE ENTREGA | EXCEÇÕES |
  |---|---|---|---|
  | 1 – Extinção | Uma única ECF com data final igual a data da situação especial. | Até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. | Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. |
  | 2 – Fusão | Uma única ECF com data final igual a data da situação especial. | Até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. | Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. |
  | 3 - Incorporação \ Incorporada | Uma única ECF com data final igual a data da situação especial. | Até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. | Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. |
  | 4 - Incorporação \ Incorporadora | Duas ECF: • Uma com data final igual a data da situação especial. • Outra com data inicial igual a data imediatamente posterior à situação especial. O indicador de início do período deve ser igual a 2 (resultante de cisão/fusão ou remanescente de cisão, ou realizou incorporação). O campo situação especial deve ser preenchido com “0” (Normal). | • A primeira deve ser entregue até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. • A segunda deve ser entregue no prazo das ECF normais. | • Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. • No caso de incorporada e incorporadora estiverem sobre o mesmo controle societário desde o ano calendário anterior ao evento não é necessária a entrega de ECF de situação especial. |
  | 5 - Cisão total | Uma única ECF com data final igual a data da situação especial. | Até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. | Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. |

  | SITUAÇÃO ESPECIAL OU EVENTO | ESCRITURAÇÕES | PRAZO DE ENTREGA | EXCEÇÕES |
  |---|---|---|---|
  | 6 - Cisão parcial | Duas ECF: • Uma com data final igual a data da situação especial. • Outra com data inicial igual a data imediatamente posterior à situação especial. O indicador de início do período deve ser igual a 6 – Realizou incorporação ou resultante de cisão parcial O campo situação especial deve ser preenchido com “0” (Normal). | • A primeira deve ser entregue até o último dia útil do 3º (terceiro) mês subsequente à data da situação especial. • A segunda deve ser entregue no prazo das ECF normais. | Para situações especiais que ocorrerem entre janeiro e abril do ano calendário, a entrega é até o último dia útil do mês de julho. |
  | 7 – Mudança de Qualificação de Pessoa Jurídica Observação: Será utilizado quando a pessoa jurídica mudar a qualificação de “PJ em Geral” para “Financeira”, de “PJ em Geral” para “Seguradora”, de “Financeira” para “PJ em Geral”, de “Financeira” para “Seguradora”, de “Seguradora” para “PJ em Geral” ou de “Seguradora” para “Financeira”. | Duas ECF: • Uma com data final igual a data do evento. • Outra com data inicial igual a data imediatamente posterior ao evento. O indicador de início do período deve ser igual a 3 (Resultante de mudança de qualificação de pessoa jurídica). O campo situação especial deve ser preenchido com “0” (Normal). | As duas ECF devem ser entregues no prazo das ECF normais. | |
  | 8 – Desenquadramento de Imune/Isenta | Duas ECF: • Uma com data final igual a data do evento. • Outra com data inicial igual a data imediatamente posterior ao evento. O indicador de início do período deve ser igual a 4 (Início de obrigatoriedade da entrega no curso do ano calendário). O campo situação especial deve ser preenchido com “0” (Normal). | As duas ECF devem ser entregues no prazo das ECF normais. | |
  | 9 – Inclusão no Simples nacional: Esse evento indica que a empresa passou a ser do simples nacional. | Uma ECF: • Uma com data final igual a data do evento menos um dia. | A ECF deve ser entregue no prazo das ECF normais. | |

  Observação: No caso de situação especial ocorrida em 31 de dezembro, somente será exigida do contribuinte a apresentação de uma ECF, de 1o de janeiro até 31 de dezembro do ano-calendário, com a informação de situação especial no campo 11 (indicador de situação especial).
