- numero: 3
  campo: IDENT_CPF_CNPJ
  descricao: |-
    CPF/CNPJ:
    O tamanho do campo deve ser exatamente o informado na coluna “Tamanho”.
  tipo: C
  tamanho: CPF (11) CNPJ(14)
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 4
  campo: IDENT_QUALIF
  descricao: Código de qualificação do assinante, conforme tabela do Sped (Disponibilizada no programa da ECF no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas/SPEDECF_LOCAL$SPEDECF_QUALIF_ASSINANTE).
  tipo: C
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 5
  campo: IND_CRC
  descricao: Número de inscrição do contabilista no Conselho Regional de Contabilidade.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: EMAIL
  descricao: E-mail do signatário
  tipo: C
  tamanho: 60
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 7
  campo: FONE
  descricao: DDD e telefone do signatário
  tipo: C
  tamanho: 14
  decimal: '-'
  valores_validos: null
  obrigatorio: true
regras_validacao_registro_detalhe:
- regra: REGRA_OBRIGATORIO_ASSIN_CONTADOR
  descricao: Verifica se existe, no mínimo, um registro 0930, cujo 0930.IDENT_QUALIF seja igual a 900 (Contador ou Contabilista), no caso de forma de tributação diferente de imunes/isentas (0010.FORMA_TRIB diferente de “8” ou “9”) ou 0010.TIP_ESC_PRE igual a “C” – Obrigada a entregar a ECD ou entrega facultativa) e, no mínimo, um registro 0930, cujo 0930.IDENT_QUALIF seja diferente de 900. Se a regra não for cumprida, o programa da ECF gera um erro.
- regra: REGRA_OCORRENCIA_0930
  descricao: Verifica se o registro 0930 possui, no máximo, duas ocorrências. Se a regra não for cumprida, o programa da ECF gera um erro.
regras_validacao_campos:
- numero: 3
  campo: IDENT_CPF_CNPJ
  regras:
  - regra: REGRA_CONTADOR_CPF
    descricao: Verifica, quando 0930.IDENT_QUALIF igual a 900 (Contador ou Contabilista), se 0930.IDENT_CPF_CNPJ possui 11 caracteres.
    tipo: Erro
  - regra: REGRA_VALIDA_CPF_CNPJ
    descricao: Verifica se a regra de formação do 0930.IDENT_CPF_CNPJ é válida.
    tipo: Erro
- numero: 5
  campo: IND_CRC
  regras:
  - regra: REGRA_OBRIGATORIO_CONTADOR
    descricao: 0930.IND_CRC obrigatório quando 0930.IDENT_QUALIF for igual a 900 (Contador ou Contabilista).
    tipo: Erro
