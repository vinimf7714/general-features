descricao: |-
  Informa os dados dos signatários da escrituração. São obrigatórias duas assinaturas: uma do contabilista e uma da pessoa jurídica, podendo ser utilizado certificado na nuvem, desde de que respeitadas as demais regras apresentadas a seguir.
  Para a assinatura do contabilista só podem ser utilizados certificados digitais de pessoa física (e-CPF), do tipo A1 ou A3.
  Para a assinatura da pessoa jurídica, poderá ser utilizado certificado digital válido, do tipo A1 ou A3:
  1. O e-CNPJ do estabelecimento que contenha a mesma base do CNPJ (8 primeiros caracteres);
  2. O e-CPF do representante legal da pessoa jurídica.
  3.
  3.1. O e-CPF do procurador (outorgado) constituído diretamente no e-CAC (Centro Virtual de Atendimento), a partir do e-CNPJ da pessoa jurídica (outorgante).
  3.2. O e-CPF do procurador (outorgado) constituído nos termos da Instrução Normativa RFB no 2.066/2022, por meio de procuração cadastrada no site da Receita Federal do Brasil e validada em qualquer uma de suas unidades, tendo como outorgante a pessoa jurídica.
  3.3. O e-CNPJ do procurador (outorgado) constituído diretamente no e-CAC (Centro Virtual de Atendimento), a partir do e-CNPJ da pessoa jurídica (outorgante);
  3.4. O e-CNPJ do procurador (outorgado) constituído nos termos da Instrução Normativa RFB n.º 2.066/2022, por meio de procuração cadastrada na página da Receita Federal do Brasil e validada em qualquer uma de suas unidades, tendo como outorgante a pessoa jurídica.
  Cadastramento de Procuração Eletrônica ou Procuração RFB:
  No site da RFB, http://receita.fazenda.gov.br, no menu “Serviços”, clicar em “Procurações Digitais” ou opcionalmente https://cav.receita.fazenda.gov.br/scripts/CAV/login/login.asp.
  Para procuração Eletrônica, o caminho é o seguinte:
  1. Login com certificado digital de pessoa jurídica ou representante legal/procurador;
  2. Selecionar “Procuração eletrônica”;
  3. Selecionar “Cadastrar Procuração” ou outra opção, se for o caso;
  4. Selecionar “Solicitação de procuração para a Receita Federal do Brasil”;
  5. Preencher os dados do formulário apresentado e selecionar a opção “Transmissão de Declarações/Arquivos, inclusive todos do CNPJ, com Assinatura Digital via Receitanet.”
  6. Para finalizar, clicar em “Cadastrar procuração”, ou “Limpar” ou “Voltar”.
  Observação: Na procuração eletrônica, é importante habilitar o serviço “ECF – Escrituração Contábil Fiscal” ou habilitar a opção para todos os serviços.
  A assinatura digital será verificada quanto a sua existência, prazo e validade para a pessoa jurídica identificada na ECF, no início do processo de transmissão do arquivo digital.
  Para Procuração RFB, selecione a opção “Solicitar uma procuração”, preencha as informações solicitadas e apresente, via processo, os documentos necessários para a análise, via processo digital, conforme orientações disponíveis em https://www.gov.br/pt-br/servicos/cadastrar-ou-cancelar-procuracao-para-acesso-ao-e-cac
  Assinatura como procurador: O contador pode assinar a ECF como contador e procurador. Para assinar como procurador, é necessária a procuração eletrônica cadastrada no e-CAC. É importante ressaltar que o serviço ECF – Escrituração Contábil Fiscal – ou a opção para todos os serviços devem estar explicitamente habilitados na procuração eletrônica. Para o preenchimento do registro 0930, as duas linhas conterão os dados do contador (Nome e CPF, conforme e-CPF do contador). Uma linha será com a qualificação “Contabilista” e a outra linha será com a qualificação “Procurador”.
  Observação: No caso de imunes ou isentas sem obrigatoriedade de entrega da ECD, o sistema somente exigirá a assinatura do representante legal ou procurador. Não será obrigatória a assinatura de um contador. Nos demais casos, o sistema exigirá a assinatura do representante legal ou procurador e do contador.
