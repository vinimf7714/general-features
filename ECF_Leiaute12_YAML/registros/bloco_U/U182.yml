_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: U182
nome: Cálculo da Contribuição Social sobre o Lucro Líquido (CSLL) das Empresas Imunes e Isentas
bloco: U
nome_tabela_registros: Cálculo da CSLL das Empresas Imunes ou Isentas
paginas_manual:
- 415
- 416
descricao: |-
  Este registro deve ser preenchido pelas:
  a) entidades sem fins lucrativos de que trata o inciso I do art. 12 do Decreto nº 3.048, de 6 de maio de 1999, que não se enquadrem na imunidade ou isenção da Lei nº 9.532, de 1997;
  b) as associações de poupança e empréstimo.
  Atenção: As entidades sujeitas a planificação contábil própria apuram a CSLL de acordo com essa planificação. Nesses casos, a contribuição social sobre o lucro líquido pode ser apurada anualmente ou trimestralmente. A pessoa jurídica imune ou isenta de IRPJ pode optar pela apuração anual da CSLL, que está sujeita ao pagamento da CSLL apurada sobre a base de cálculo estimada mensalmente ou sobre balanço ou balancete de suspensão ou redução.
titulo_leiaute: 'REGISTRO U182: CÁLCULO DA CSLL DAS EMPRESAS IMUNES E ISENTAS'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 3
ocorrencia: 1:N
campos_chave: CODIGO
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0010. FORMA_TRIB = “8” ou “9” E ((0010.APUR_CSLL = “A” ou “T”) OU (0010. FORMA_APUR_I = “A” ou “T”)
  ocorrencia: '[0;N]'
hierarquia:
  pai: U030
  filhos: []
  irmaos:
