_meta:
  fonte: Manual_ECF_Leiaute_12_23_07_2026_AC_2025_SIT_ESP_2026.pdf
  leiaute: 12
  atualizacao: julho/2026
  legenda_campos:
    tipo: N = numérico; NS = numérico com sinal; C = alfanumérico
    tamanho: Algarismo = tamanho exato (N/NS) ou exato no caso geral (C); "-" em N/NS = sem máximo; "-" em C = máximo de 255 caracteres; "65536" = até 65.536 caracteres
    decimal: Algarismo = quantidade máxima de casas decimais; "-" = sem casas decimais
    obrigatorio: true = Sim; false = Não
    formato_linha: 'Cada linha do arquivo: |REG|CAMPO2|CAMPO3|...| (campos delimitados por pipe, valores decimais com vírgula)'
registro: U150
nome: Demonstração do Resultado
bloco: U
nome_tabela_registros: Demonstração do Resultado
paginas_manual:
- 409
- 412
descricao: Apresenta a demonstração do resultado das empresas imunes e isentas. No caso de entidades fechadas de previdência complementar, será apresentado o plano de gestão administrativa (PGA).
titulo_leiaute: 'REGISTRO U150: DEMONSTRAÇÃO DO RESULTADO'
regras_validacao_registro:
- REGRA_DUPLICIDADE_DESPREZADA
- REGRA_LINHA_DESPREZADA
- REGRA_LINHA_ATUALIZADA
nivel_hierarquico: 3
ocorrencia: 0:N
campos_chave: CODIGO
tabela_registros:
  nivel: 3
  obrigatoriedade_entrada:
    codigo: F
  obrigatoriedade_saida:
    codigo: OC
    condicao: Se 0010. FORMA_TRIB = “8” ou “9” E 0010. TIP_ESP_PRE = “C”
  ocorrencia: '[0;N]'
hierarquia:
  pai: U030
  filhos: []
  irmaos:
  - U100
  - U180
  - U182
campos:
- numero: 1
  campo: REG
  descricao: Texto Fixo Contendo a Identificação do Registro (U150).
  tipo: C
  tamanho: 4
  decimal: '-'
  valores_validos: '[U150]'
  obrigatorio: true
- numero: 2
  campo: CODIGO
  descricao: Código da Conta Referencial (Analíticas e Sintéticas), conforme tabela dinâmica do Sped (Disponibilizada no item III deste registro e no programa da ECF, no diretório Arquivos de Programas/Programas Sped/ECf/SpedEcf/Recursos/Tabelas).
  tipo: C
  tamanho: 50
  decimal: '-'
  valores_validos: null
  obrigatorio: true
- numero: 3
  campo: DESCRICAO
  descricao: Descrição da Conta Referencial.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 4
  campo: TIPO
  descricao: |-
    Indicador do Tipo de Conta:
    S – Sintética
    A – Analítica
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[S; A]'
  obrigatorio: true
- numero: 5
  campo: NIVEL
  descricao: Nível da Conta.
  tipo: N
  tamanho: 3
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 6
  campo: COD_NAT
  descricao: |-
    Natureza da Conta:
    04 – Contas de Resultado
  tipo: C
  tamanho: 2
  decimal: '-'
  valores_validos: '[04]'
  obrigatorio: false
- numero: 7
  campo: COD_CTA_SUP
  descricao: Código da Conta Sintética de Nível Imediatamente Superior.
  tipo: C
  tamanho: '-'
  decimal: '-'
  valores_validos: null
  obrigatorio: false
- numero: 8
  campo: VALOR
  descricao: Saldo Final da Conta Referencial.
  tipo: N
  tamanho: 19
  decimal: 2
  valores_validos: null
  obrigatorio: true
- numero: 9
  campo: IND_VALOR
  descricao: |-
    Indicador do Sinal do Saldo Final:
    C – Credor
    D – Devedor
  tipo: C
  tamanho: 1
  decimal: '-'
  valores_validos: '[D; C]'
  obrigatorio: true
regras_validacao_registro_detalhe:
- regra: REGRA_DUPLICIDADE_DESPREZADA
  descricao: Verifica se o registro já foi importado anteriormente, de acordo com a chave e os registros pais. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_DESPREZADA
  descricao: Verifica se o registro existe na importação, mas não será importado por não existir na tabela dinâmica devido às configurações do bloco 0 ou da tabela dinâmica. Se a regra não for cumprida, a ECF gera um aviso.
- regra: REGRA_LINHA_ATUALIZADA
  descricao: Verifica se o registro está desatualizado em relação à tabela da RFB. Se a regra não for cumprida, a ECF gera um aviso.
regras_validacao_campos:
- numero: 4
  campo: VALOR
  regras:
  - regra: REGRA_OBRIGATORIO_TIPO_DIFERENTE_R
    descricao: Verifica se o campo está preenchido quando o tipo da linha é diferente de “R”.
    tipo: Erro
exemplos_preenchimento:
- linhas_exemplo:
  - '|U150|3.04.01.01| GANHOS NA ALIENAÇÃO DE BENS DE USO – FUNDO PARTIDÁRIO|A|4|04|3.04.01|10000,00|C|'
  explicacao:
  - valor: '|U150|'
    descricao: Identificação do tipo do registro.
  - valor: '|3.04.01.01|'
    descricao: Código da linha.
  - valor: '|GANHOS NA ALIENAÇÃO DE BENS DE USO – FUNDO PARTIDÁRIO|'
    descricao: Descrição da linha.
  - valor: '|A|'
    descricao: Tipo da conta (A = Analítica).
  - valor: '|4|'
    descricao: Nível da conta.
  - valor: '|04|'
    descricao: Natureza da conta (04 = Contas de Resultado).
  - valor: '|3.04.01|'
    descricao: Código da conta superior.
  - valor: '|10000,00|'
    descricao: Valor do saldo final (R$ 10.000,00).
  - valor: '|C|'
    descricao: Indicador do sinal do saldo final da conta (C = Credor).
informacoes_adicionais:
- titulo: III – Plano de Contas Referencial
  conteudo: |-
    Código: Chave da linha.
    Ordem: Ordem de apresentação das linhas.
    Tipo: S = Sintética; A = Analítica
    Natureza: 01 = Ativo; 02 = Passivo; 03 = Patrimônio Líquido
    II.1 – U150A - Plano de Contas Referencial - Contas de Resultado - Imunes e Isentas - PJ em Geral:
    Vide planilha deste Registro no arquivo “Tabelas_Dinamicas_ECF_Leiaute_12_AC2025_SIT_ESP_2026.xlsx” a partir do link http://sped.rfb.gov.br/pasta/show/1644.
    (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
    Regras de validação da tabela dinâmica U150A:
    Vide arquivo “SPEDECF_DINAMICO_2021$SPEDECF_DINAMICA_U150_A_REGRAS” no diretório C:\Arquivos de Programas RFB\Programas SPED\ECF\recursos\tabelas. (*) A partir do ano-calendário 2021, os arquivos de tabelas dinâmicas são únicos, para todos os anos-calendário (de 2021 em diante).
