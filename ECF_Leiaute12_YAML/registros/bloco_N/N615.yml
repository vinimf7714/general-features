regras_validacao_campos:
- numero: 2
  campo: BASE_CALC
  regras:
  - regra: REGRA_BASE_CALC_ZERO
    descricao: Verifica se N615.BASE_CALC é igual a zero e N615.PER_INCEN_FINOR + N615.PER_INCEN_FINAM + N615.PER_INCEN_FUNRES é igual a zero.
    tipo: Aviso
  - regra: REGRA_BASE_CAL_IGUAL
    descricao: |-
      Verifica se N615.BASE_CALC é igual:
      N630(3) – (N630(6) + N630(7) + N630(8) + N630(9) + N630(10) + N630(11) + N630(12) + N630(13) + N630(14) + N630(15) + N630(16) + 3,33 x N630(18) + N630(19) + N630(27))
    tipo: Aviso
  - regra: REGRA_BASE_CAL_IGUAL_ISENCAO_REDUCAO
    descricao: |-
      Verifica, quando 0020.IND_LUC_EXP igual a “S”, se N615.BASE_CALC é igual:
      N630(3) – (N610(7) + N610(12) + N610(17) + (N610(47) x 75%) + (N610(52) x 70%) + (N610(57) x 50%) + (N610(62) x 33,33%) + (N610(67) x 25%) + (N610(72) x 12,50%) + N630(6) + N630(7) + N630(8) + N630(9) + N630(10) + N630(11) + N630(12) + N630(13) + N630(14) + N630(15) + N630(16) + 3,33 x N630(18) + N630(19) + N630(27))
    tipo: Aviso
- numero: 3
  campo: PER_INCEN_FINOR
  regras:
  - regra: REGRA_PERCENTUAL_MAIOR_6
    descricao: Verifica se N615.PER_INCEN_FINOR é menor ou igual a “6”.
    tipo: Aviso
  - regra: REGRA_PERCENTUAL
    descricao: Verifica se o valor informado no campo N615.PER_INCEN_FINOR está entre “0” e “100”.
    tipo: Erro
- numero: 4
  campo: VL_LIQ_INCEN_FINOR
  regras:
  - regra: REGRA_FINOR_LIQUIDO_DIFERENTE
    descricao: Verifica se o valor informado em N615.VL_LIQ_INCEN_ FINOR é igual ao resultado da multiplicação de N615.PER_INCEN_FINOR por N615.BASE_CALC.
    tipo: Erro
- numero: 5
  campo: PER_INCEN_FINAM
  regras:
  - regra: REGRA_PERCENTUAL_MAIOR_6
    descricao: Verifica se N615.PER_INCEN_FINAM é menor ou igual a “6”.
    tipo: Aviso
  - regra: REGRA_PERCENTUAL_MAIOR_6_GERAL
    descricao: Verifica se N615.PER_INCEN_FINOR somado ao N615.PER_INCEN_FINAM é menor ou igual a “6”.
    tipo: Aviso
  - regra: REGRA_PERCENTUAL
    descricao: Verifica se o valor informado no campo N615.PER_INCEN_FINOR está entre “0” e “100”.
    tipo: Erro
- numero: 6
  campo: VL_LIQ_INCEN_FINAM
  regras:
  - regra: REGRA_FINAM_LIQUIDO_DIFERENTE
    descricao: Verifica se o valor informado em N615.VL_LIQ_INCEN_ FINAM é igual ao resultado da multiplicação de N615.PER_INCEN_FINAM por N615.BASE_CALC.
    tipo: Erro
- numero: 7
  campo: VL_TOTAL
  regras:
  - regra: REGRA_TOTAL_DIFERENTE
    descricao: Verifica se N615.VL_LIQ_INCEN_ FINOR somado ao N615.VL_LIQ_INCEN_ FINAM é igual ao valor informado no campo N615.VL_TOTAL.
    tipo: Erro
