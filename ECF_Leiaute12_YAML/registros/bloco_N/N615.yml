descricao: |-
  Este registro deve ser preenchido pelas pessoas jurídicas ou grupos de empresas coligadas de que trata o art. 9º da Lei nº 8.167, de 1991, alterado pela Medida Provisória nº 2.199-14, de 24 de agosto de 2001, titulares de empreendimento de setor da economia considerado, em ato do Poder Executivo, prioritário para o desenvolvimento regional, aprovado ou protocolizado até 2 de maio de 2001 nas áreas da Sudam e da Sudene (MP nº 2.199-14, de 2001, art. 4º e MP nº 2.145, de 2 de maio de 2001, art. 50, inciso XX, atuais MP nº 2.156-5, de 2001, art. 32, inciso XVIII, e nº 2.157-5, de 2001, art. 32, inciso IV), e MP nº 634, de 2013, arts. 1º e 2º.
  Atenção:
  1) As aplicações somente podem ser efetuadas até o final do prazo previsto para a implantação do projeto, desde que o projeto esteja em situação de regularidade, cumpridos todos os requisitos previstos e os cronogramas aprovados.
  2) após 2 de maio de 2001, é vedada a aplicação nos fundos Finor e Finam pelas pessoas jurídicas que não se enquadram nas condições do art. 9º da Lei nº 8.167, de 1991 (MP nº 2.145, de 2 de maio de 2001, art. 50, inciso XX, atuais MP nº 2.156-5, de 2001, art. 32, inciso XVIII, e nº 2.157-5, de 2001, art. 32, inciso IV e Lei nº 12.995, de 2014), arts. 1º e 2º).
  Exemplo 01:

  | 01 - BASE DE CÁLCULO DOS INCENTIVOS FISCAIS | | 2.000,00 |
  |---|---|---|
  | | PERCENTUAL (%) | VALOR LÍQUIDO DO INCENTIVO |
  | 02 - Finor (até 6%) | 0,60% | 12,00 |
  | 03 - Finam (até 6%) | | |
  | 04 - TOTAL DOS INCENTIVOS (até 6%) | 0,60% | 12,00 |

  Exemplo 02:

  | 01 - BASE DE CÁLCULO DOS INCENTIVOS FISCAIS | | 2.000,00 |
  |---|---|---|
  | | PERCENTUAL (%) | VALOR LÍQUIDO DO INCENTIVO |
  | 02 - Finor (até 6%) | 3,00% | 60,00 |
  | 03 - Finam (até 6%) | | |
  | 04 - TOTAL DOS INCENTIVOS (até 6%) | 3,00% | 60,00 |

  Exemplo 03:

  | 01 - BASE DE CÁLCULO DOS INCENTIVOS FISCAIS | | 2.000,00 |
  |---|---|---|
  | | PERCENTUAL (%) | VALOR LÍQUIDO DO INCENTIVO |
  | 02 - Finor (até 6%) | 3,00% | 60,00 |
  | 03 - Finam (até 6%) | 3,00% | 60,00 |
  | 04 - TOTAL DOS INCENTIVOS (até 6%) | 6,00% | 120,00 |
