- numero: 2
  campo: BASE_CALC
  descricao: |-
    Base de Cálculo: Base de cálculo dos incentivos fiscais: Para fins de determinação da base de cálculo dos incentivos, deve-se observar a forma de apuração do imposto de renda da pessoa jurídica, as deduções permitidas. a) Regra Geral: O valor desta linha, quando a apuração do imposto de renda for com base no lucro real trimestral e no lucro real apurado em 31 de dezembro do ano-calendário (ajuste anual) será calculado pela seguinte fórmula:
    BASE_CALC = A - (B + C + D + E + F + G + H + I + J + L + M+ N + O + P), onde:
    A = Imposto de Renda devido à alíquota de 15% (Linha N630/3)
    B = Atividades Culturais e Artísticas (Linha N630/6) (art. 18, e §§ 1º e 3º, e art. 25 e 26 da Lei nº 8.313, de 1991, com as alterações do art. 1º, da Lei nº 9.874, de 1999, do art. 53 da MP nº 2.228, de 2001) C = Operações de Aquisição de Vale-Cultura (Linha N630/7) (Lei nº 12.761/2012, art. 10) D = Programa de Alimentação ao Trabalhador (Linha N630/8) E = Desenvolvimento Tecnológico Industrial/Agropecuário (Linha N630/9) F = Atividade Audiovisual (Linha N630/10) G = Fundo dos Direitos da Criança e do Adolescente (Linha N630/11) H = Fundos Nacional, Estaduais ou Municipais do Idoso (Linha N630/12) (Lei nº 12.213, de 2010, art. 3º).
    I = Atividades de Caráter Desportivo (Linha N630/13)
    J = Programa Nacional de Apoio à Atenção Oncológica - PRONON (Linha N630/14) - (Lei nº 12.715/2012, arts. 1º e 4º) L = Programa Nacional de Apoio à Atenção da Saúde da Pessoa com Deficiência - PRONAS/PCD (Linha N630/15) (Lei nº 12.715, de 2012, arts. 3º e 4º) M= Valor da Remuneração da Prorrogação da Licença-Maternidade (Linha N630/16) (Lei nº 11.770, de 2008, art. 5º) N = 3,33 x Redução por Reinvestimento (Linha N630/18) O = Imposto devido no Brasil à alíquota de 15% incidente sobre lucros, rendimentos e ganhos de capital oriundos do exterior (Linha N630/19) P = Imposto de renda sobre a diferença entre o Custo Orçado e o Custo Efetivo (Linha N630/27)
    b) Pessoa Jurídica com Direito à Isenção e/ou Redução do Imposto
    A pessoa jurídica que tiver direito à redução ou isenção do imposto (Linha N630/17) deve, com base nas informações do Registro N610 - Cálculo da Isenção e Redução do Imposto Sobre o Lucro Real, deduzir do valor determinado pela aplicação da Regra Geral (item "a") o seguinte valor (Z):
    Z = [Linhas N610/7 + N610/12 + N610/17 + (N610/47 x 75%) + (N610/52 x 70%) + (N610/57x 50%) + (N610/62 x 33,33%) + (N610/67 x 25%) + (N610/72 x 12,50%)] O valor desta linha passa, então, a ser determinado pela seguinte fórmula:
    BASE_CALC = A - (Z + B + C + D + E + F + G + H + I + J + L + M + N + O + P)
    Atenção:
    1) Também compõe a base de cálculo dos incentivos (fórmula da letra a ou b) o valor correspondente à soma do imposto sobre a renda pago por SCP tributada com base no lucro real, exclusive adicional, das quais a declarante seja sócia ostensiva. Sendo que a opção somente poderá ser efetuada em relação à parte do imposto devido, exclusive o adicional, pertencente à pessoa jurídica sócia ostensiva, quer dizer, não pode ser efetivada em relação à parte do imposto que cabe aos demais sócios da SCP.
    2) Observar as instruções deste manual, com relação às deduções de incentivos fiscais, quando o imposto for calculado sobre a base de cálculo estimada.
