- secao: 1.3. Importação da ECF, Recuperação da ECD e Recuperação da ECF anterior
  paginas_manual:
  - 13
  - 14
  conteudo: |-
    | - Importação da ECF: | | | | |
    |---|---|---|---|---|
    | O arquivo da ECD não é importado para a ECF e sim recuperado. | | | | |
    | Primeiramente, deve ser criada uma ECF no próprio programa ou deve ser importado um arquivo da ECF. Em seguida deve ser feita a recuperação do arquivo da ECD (recuperação de contas, | | | | |
    | saldos e mapeamento, caso este mapeamento tenha sido realizado na ECD). | | | | |
    | - Recuperação da ECD: | | | | |
    | A ECD a ser recuperada na ECF deve ser a ECD transmitida ao SPED (ECD ativa na base). | | | | |
    | Para as pessoas jurídicas tributadas pelo lucro real, a recuperação da ECD na ECF é obrigatória. | | | | |
    | Para as pessoas jurídicas tributadas pelo lucro presumido e imunes ou isentas obrigadas a entregar a ECD, a recuperação da ECD na ECF é obrigatória. Neste caso, o campo escrituração – | | | | |
    | “TIP_ESC_PRE” – do registro 0010 deve ser preenchido com “C” (obrigada a entregar a ECD). O mesmo tratamento é dado para as pessoas jurídicas que entregarem a sua ECD, mesmo sem estar obrigadas, | | | | |
    | e desejarem efetuar a sua recuperação na ECF (campo escrituração – “TIP_ESC_PRE” – do registro 0010 deve ser preenchido com “C”). | | | | |
    | Para as pessoas jurídicas tributadas pelo lucro presumido e imunes ou isentas não obrigadas a entregar a ECD, o campo escrituração – “TIP_ESC_PRE” – do registro 0010 deve ser preenchido | | | | |
    | com “L” (não obrigada a entregar a ECD). Nessa situação, os blocos C, E, J e K não serão preenchidos. | | | | |
    | O programa da ECF exige a recuperação de arquivos principais da ECD (tipos G, R ou B), tantos quantos forem os arquivos necessários para abranger todo o período de ECF. | | | | |
    | Exemplo: Arquivo da ECF do ano-calendário de 2025 (01/01/2025 a 31/12/2025) | | | | |
    | Arquivos da ECD: | | | | |
    | Arquivo 1 da ECD: de 01/01/2025 a 31/03/2025 | | | | |
    | Arquivo 2 da ECD: de 01/04/2025 a 31/08/2025 | | | | |
    | Arquivo 3 da ECD: de 01/09/2025 a 31/12/2025 | | | | |
    | | Nesse exemplo, o programa da ECF exigirá a recuperação dos 3 (três) arquivos da ECD, que correspondem ao período integral da ECF (01/01/2025 a 31/12/2025). | | | |
    | São regras para habilitação da Recuperação da ECD: | | | | |
    | | | • Registro 0010, campo FORMA_TRIB igual a “1”, “3”, “4”; | “10” | ; ou |
    | | | • Registro 0010, campo FORMA_TRIB igual a “2” e campo FORMA_APUR igual a “T”; ou | | |
    | | | • Registro 0010, campo FORMA_TRIB igual a “5”, “7”, “8”, “9” e campo TIPO_ESC_PRE igual a “C”. | | |
    | - Recuperação da ECF Anterior: | | | | |

    Para as empresas tributadas pelo Lucro Real, o programa da ECF exige a recuperação da ECF do período imediatamente anterior (transmitida ao SPED – ativa).
    A recuperação da ECF do período imediatamente anterior é obrigatória quando:
    1 – Forma de tributação pelo lucro real (0010. FORMA_TRIB = “1”);
    2 – A data inicial da ECF (0000.DT_INI) do período atual for diferente de 01/01/2014; e
    3 – O indicador de situação de início de período (0000.IND_SIT_INI_PER) for igual a “0” (Regular – Início no primeiro dia do ano) ou “2” (quando remanescente de cisão ou realizou incorporação). Até o leiaute 10
    3 – O indicador de situação de início de período (0000.IND_SIT_INI_PER) for igual a “0” (Regular – Início no primeiro dia do ano) ou "3" (resultante de mudança de qualificação da pessoa jurídica) ou “6” (realizou incorporação ou remanescente de cisão parcial). A partir do leiaute 11.
    A verificação da não recuperação da ECF anterior somente ocorrerá no momento da transmissão, de acordo com as seguintes regras de erro:
    1 - Verifica, quando a forma de tributação for lucro real (0010.FORMA_TRIB = 1), se existe ECF transmitida para a base do Sped de período imediatamente anterior e com o HASHCODE igual ao que foi informado no campo 0010. HASH_ECF_ANTERIOR (hashcode da ECF do período imediatamente anterior a ser recuperado).
    2- Verifica, quando a forma de tributação for lucro real (0010.FORMA_TRIB = 1) e não existe ECF transmitida para a base do Sped de período imediatamente anterior, se o campo 0010.
    HASH_ECF_ANTERIOR (hashcode da ECF do período imediatamente anterior a ser recuperado) não está preenchido.
- secao: 1.4. Pessoas Jurídicas Imunes e Isentas
  paginas_manual:
  - 14
  - 15
  conteudo: |-
    A partir do ano-calendário 2015, todas as pessoas jurídicas imunes ou isentas estão obrigadas a entregar a ECF.
    As imunes/isentas (desobrigadas do IRPJ e da CSLL) e que não estejam obrigadas a entregar a ECD deverão preencher os seguintes registros:
    Registro 0000: Abertura do Arquivo Digital e Identificação da Pessoa Jurídica
    Registro 0010: Parâmetros de Tributação
    Registro 0020: Parâmetros Complementares
    Registro 0030: Dados Cadastrais
    Registro 0930: Identificação dos Signatários da ECF
    Registro X390: Origem e Aplicações de Recursos - Imunes e Isentas
    Registro Y612: Identificação e Rendimentos de Dirigentes, Conselheiros, Sócios ou Titular.
    No caso do registro 0930, para as imunes/isentas que não estejam obrigadas a entregar a ECD, só será exigida a assinatura do representante legal; ou seja, não será obrigatória a assinatura do contador.
    As imunes/isentas (desobrigadas do IRPJ e da CSLL) e que estejam obrigadas a entregar a ECD, além dos registros acima, também preencherão os blocos C, E, J, K e U (esses blocos serão preenchidos pelo sistema por meio da recuperação dos dados da ECD). Nessa situação, a assinatura do contador, no registro 0930, é obrigatória.
    O registro X390 é obrigatório para as pessoas jurídicas imunes e isentas que não recuperaram a ECD. Contudo, a pessoa jurídica, ainda que seja obrigada a entrega da ECD, pode preencher o referido Registro facultativamente.
    A partir do leiaute 12, todas as entidades imunes/isentas que possuírem Certificado de Entidade Beneficente de Assistência Social – CEBAS deveram informar seu registro no ato de entrega da ECF.
    Entidades nas áreas de assistência social, saúde ou educação ao preencherem o campo TIP_ENT do registro 0000 com 01 – Assistência Social, ou 02 – Educacional, ou 16 – Saúde, devem informar no campo POSSUI_CEBAS se é portadora do certificado. Em caso afirmativo, informá-lo no campo CEBAS.
